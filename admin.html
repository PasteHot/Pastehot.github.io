<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrador | PasteHot</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f5f7;
  color:#202124;
}

header{
  background:#111;
  color:white;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}

header h1{
  margin:0;
  font-size:25px;
}

header button{
  background:#e51b23;
  border:0;
  color:white;
  padding:11px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.container{
  max-width:1250px;
  margin:auto;
  padding:25px;
}

.login{
  max-width:430px;
  margin:80px auto;
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 10px 35px rgba(0,0,0,.10);
}

.login h2{
  margin-top:0;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  margin-top:6px;
  margin-bottom:15px;
  border:1px solid #d5d7da;
  border-radius:8px;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

label{
  font-weight:bold;
  font-size:14px;
}

.primary{
  background:#e51b23;
  color:white;
  border:0;
  border-radius:8px;
  padding:13px 18px;
  cursor:pointer;
  font-weight:bold;
}

.secondary{
  background:#222;
  color:white;
  border:0;
  border-radius:8px;
  padding:10px 15px;
  cursor:pointer;
}

.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:25px;
}

.tab{
  background:white;
  border:1px solid #ddd;
  padding:12px 18px;
  border-radius:9px;
  cursor:pointer;
  white-space:nowrap;
  font-weight:bold;
}

.tab.active{
  background:#e51b23;
  color:white;
  border-color:#e51b23;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.card{
  background:white;
  padding:22px;
  border-radius:15px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.card h2{
  margin-top:0;
}

.product-list{
  display:grid;
  gap:12px;
}

.product{
  background:white;
  border-radius:14px;
  padding:15px;
  display:flex;
  align-items:center;
  gap:15px;
  box-shadow:0 3px 14px rgba(0,0,0,.06);
}

.product img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:10px;
  background:#eee;
}

.product-info{
  flex:1;
  min-width:0;
}

.product-info h3{
  margin:0 0 5px;
}

.product-info p{
  margin:4px 0;
  color:#666;
}

.product-actions{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.edit-btn{
  background:#222;
  color:white;
  border:0;
  border-radius:8px;
  padding:10px 14px;
  cursor:pointer;
}

.photo-btn{
  background:#555;
  color:white;
  border:0;
  border-radius:8px;
  padding:10px 14px;
  cursor:pointer;
}

.switch{
  position:relative;
  width:58px;
  height:31px;
  display:inline-block;
}

.switch input{
  display:none;
}

.slider{
  position:absolute;
  inset:0;
  background:#d71920;
  border-radius:40px;
  cursor:pointer;
  transition:.2s;
}

.slider:before{
  content:"";
  position:absolute;
  width:25px;
  height:25px;
  left:3px;
  top:3px;
  background:white;
  border-radius:50%;
  transition:.2s;
  box-shadow:0 2px 5px rgba(0,0,0,.25);
}

.switch input:checked + .slider{
  background:#19a744;
}

.switch input:checked + .slider:before{
  transform:translateX(27px);
}

.status{
  font-size:12px;
  font-weight:bold;
}

.status.on{
  color:#15963c;
}

.status.off{
  color:#d71920;
}

.image-preview{
  width:100%;
  max-width:400px;
  max-height:220px;
  object-fit:cover;
  border-radius:12px;
  margin-top:10px;
  display:none;
}

.file-button{
  display:inline-block;
  background:#222;
  color:white;
  padding:12px 17px;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:10px;
}

.file-button input{
  display:none;
}

.design-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.design-box{
  border:1px solid #ddd;
  border-radius:12px;
  padding:18px;
}

.range-row{
  margin-top:15px;
}

.range-row input[type="range"]{
  margin:5px 0 0;
}

.range-value{
  font-size:13px;
  font-weight:bold;
}

.category-row{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:10px;
}

.category-row span{
  flex:1;
  padding:11px;
  background:#f2f2f2;
  border-radius:8px;
}

.delete-category{
  background:#d71920;
  color:white;
  border:0;
  border-radius:7px;
  padding:9px 12px;
  cursor:pointer;
}

.add-category{
  display:flex;
  gap:10px;
}

.add-category input{
  margin:0;
}

.add-category button{
  white-space:nowrap;
}

.message{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#111;
  color:white;
  padding:14px 18px;
  border-radius:10px;
  display:none;
  z-index:9999;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

@media(max-width:800px){

  .container{
    padding:15px;
  }

  .product{
    align-items:flex-start;
  }

  .product-actions{
    width:100%;
    justify-content:flex-start;
  }

  .design-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:550px){

  .product{
    flex-direction:column;
  }

  .product img{
    width:100%;
    height:180px;
  }

  .product-actions{
    width:100%;
  }

  .product-actions button{
    flex:1;
  }
}
</style>
</head>

<body>

<div id="loginScreen" class="login">

  <h2>Administrador PasteHot</h2>

  <label>Correo</label>
  <input id="email" type="email">

  <label>Contraseña</label>
  <input id="password" type="password">

  <button class="primary" style="width:100%" onclick="login()">
    Entrar
  </button>

  <p id="loginError" style="color:#d71920"></p>

</div>


<div id="adminScreen" style="display:none">

<header>

  <h1>Administrador</h1>

  <button onclick="logout()">Cerrar sesión</button>

</header>


<div class="container">

<div class="tabs">

  <button class="tab active" onclick="showTab('products',this)">

  </button>

  <button class="tab" onclick="showTab('design',this)">

  </button>

  <button class="tab" onclick="showTab('business',this)">

  </button>

  <button class="tab" onclick="showTab('orders',this)">

  </button>

    Clientes

</div>


<!-- PRODUCTOS -->

<section id="products" class="section active">

<div class="card">

<h2 id="productFormTitle">Agregar producto</h2>

<input type="hidden" id="productId">

<label>Nombre</label>
<input id="productName">

<label>Descripción</label>
<textarea id="productDescription"></textarea>

<label>Precio</label>

  Seleccionar imagen

<!-- DISEÑO -->

<section id="design" class="section">

<div class="card">

<h2>Diseño del menú</h2>

<div class="design-grid">

<div class="design-box">

<h3>Portada</h3>

<label class="file-button">
Seleccionar imagen
<input

<label class="file-button">
Seleccionar imagen
<input

  type="file"
  accept="image/*"
  onchange="uploadDesignImage('profile')"
>
</label>

<img id="profilePreview" class="image-preview">

oninput="document.getElementById('profileScaleValue').innerText=this.value+'%'">

</div>

<input id="profileY" type="range" min="-100" max="100" value="0"
oninput="document.getElementById('profileYValue').innerText=this.value">

<div class="design-box">

<select id="backgroundType" onchange="backgroundTypeChanged()">

</select>

Seleccionar imagen

>
</label>

<input id="backgroundScale" type="range" min="50" max="300" value="100"
oninput="document.getElementById('backgroundScaleValue').innerText=this.value+'%'">

</div>

<label>Horizontal</label>

oninput="document.getElementById('backgroundXValue').innerText=this.value">

</div>

<label>Vertical</label>
<input id="backgroundY" type="range" min="-100" max="100" value="0"

</div>

<h2>Datos del negocio</h2>

<textarea id="businessDescription"></textarea>

<label>Slogan</label>
<input id="businessSlogan">

<label>WhatsApp</label>
<input id="businessWhatsapp">

<input id="deliveryCost" type="number" step="0.01">

<textarea

></textarea>

Guardar información
</button>

<h2>Pedidos</h2>

</div>

</div>

<h2>Clientes</h2>

<div id="customersList">
Cargando...

</div>

<div id="message" class="message"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://cqlywpemisknrxswlmea.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wDu6p-CtnQtYu7KWH1YS1A_h7LeL0SX";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let products = [];

let categories = [
  "Pastes salados",
  "Pastes dulces",
  "Pastes de temporada",
  "Bebidas",
  "Promociones"
];

let designSettings = {};



function showMessage(text){

  const el =
    document.getElementById("message");

  el.innerText = text;
  el.style.display = "block";

  clearTimeout(window.messageTimer);

  window.messageTimer =
    setTimeout(()=>{
      el.style.display="none";
    },2500);
}



async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    document.getElementById("loginError").innerText =
      error.message;

    return;
  }

  document.getElementById("loginScreen").style.display="none";

  document.getElementById("adminScreen").style.display="block";

  await initializeAdmin();
}



async function logout(){

  await supabaseClient.auth.signOut();

  location.reload();
}



async function initializeAdmin(){

  await loadCategories();

  await loadProducts();

  await loadDesign();

  await loadBusiness();

  await loadOrders();

  await loadCustomers();

}



function showTab(id,button){

  document
    .querySelectorAll(".section")
    .forEach(x=>x.classList.remove("active"));

  document
    .querySelectorAll(".tab")
    .forEach(x=>x.classList.remove("active"));

  document
    .getElementById(id)
    .classList.add("active");

  button.classList.add("active");

}



async function loadProducts(){

  const {data,error} =
    await supabaseClient
      .from("products")
      .select("*")
      .order("sort_order",{ascending:true})
      .order("created_at",{ascending:true});

  if(error){

    document.getElementById("productList").innerText =
      error.message;

    return;
  }

  products = data || [];

  renderProducts();

  populateCategorySelect();

}



function renderProducts(){

  const list =
    document.getElementById("productList");

  if(!products.length){

    list.innerHTML =
      "<p>No hay productos.</p>";

    return;
  }

  list.innerHTML =
    products.map(product=>{

      const image =
        product.image_url ||
        "https://via.placeholder.com/150";

      const available =
        product.available === true;

      return `

      <div class="product">

        <img
          src="${escapeHtml(image)}"
          alt=""
        >

        <div class="product-info">

          <h3>${escapeHtml(product.name || "")}</h3>

          <p>${escapeHtml(product.description || "")}</p>

          <p><strong>$${Number(product.price || 0).toFixed(2)}</strong></p>

          <p>${escapeHtml(product.category || "")}</p>

        </div>


        <div class="product-actions">

          <div>

            <label class="switch">

              <input
                type="checkbox"
                ${available ? "checked" : ""}
                onchange="toggleProduct(${JSON.stringify(String(product.id))},this.checked)"
              >

              <span class="slider"></span>

            </label>

            <div class="status ${available ? "on":"off"}">

              ${available ? "DISPONIBLE":"AGOTADO"}

            </div>

          </div>


          <button
            class="edit-btn"
            onclick="editProduct(${JSON.stringify(String(product.id))})"
          >
            Editar
          </button>


          <button
            class="photo-btn"
            onclick="changeProductPhoto(${JSON.stringify(String(product.id))})"
          >
            Cambiar foto
          </button>

        </div>

      </div>

      `;

    }).join("");

}



async function toggleProduct(id,available){

  id = String(id);

  const {data,error} =
    await supabaseClient
      .from("products")
      .update({
        available:available,
        updated_at:new Date().toISOString()
      })
      .eq("id",id)
      .select()
      .single();

  if(error){

    showMessage("Error al guardar disponibilidad");

    console.error(error);

    await loadProducts();

    return;
  }

  const index =
    products.findIndex(
      p=>String(p.id)===id
    );

  if(index !== -1){

    products[index].available =
      data.available;

  }

  renderProducts();

  showMessage(
    available
      ? "Producto disponible"
      : "Producto marcado como agotado"
  );

}



function editProduct(id){

  id = String(id);

  const product =
    products.find(
      p=>String(p.id)===id
    );

  if(!product){

    showMessage("No se encontró el producto");

    return;
  }

  document.getElementById("productId").value =
    product.id;

  document.getElementById("productName").value =
    product.name || "";

  document.getElementById("productDescription").value =
    product.description || "";

  document.getElementById("productPrice").value =
    product.price ?? "";

  populateCategorySelect();

  document.getElementById("productCategory").value =
    product.category || categories[0];

  document.getElementById("productFormTitle").innerText =
    "Editar producto";

  const preview =
    document.getElementById("productImagePreview");

  if(product.image_url){

    preview.src = product.image_url;

    preview.style.display="block";

  }else{

    preview.style.display="none";

  }

  document
    .getElementById("products")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

}



function newProduct(){

  document.getElementById("productId").value="";

  document.getElementById("productName").value="";

  document.getElementById("productDescription").value="";

  document.getElementById("productPrice").value="";

  populateCategorySelect();

  document.getElementById("productCategory").value =
    categories[0];

  document.getElementById("productImage").value="";

  document.getElementById("productImagePreview").style.display="none";

  document.getElementById("productFormTitle").innerText =
    "Agregar producto";

}



function previewProductImage(){

  const file =
    document.getElementById("productImage").files[0];

  if(!file) return;

  const preview =
    document.getElementById("productImagePreview");

  preview.src =
    URL.createObjectURL(file);

  preview.style.display="block";

}



async function saveProduct(){

  const id =
    document.getElementById("productId").value.trim();

  const name =
    document.getElementById("productName").value.trim();

  const description =
    document.getElementById("productDescription").value.trim();

  const price =
    Number(document.getElementById("productPrice").value);

  const category =
    document.getElementById("productCategory").value;

  if(!name){

    showMessage("Escribe el nombre del producto");

    return;
  }

  if(!Number.isFinite(price)){

    showMessage("Escribe un precio válido");

    return;
  }


  const values = {

    name:name,

    description:description,

    price:price,

    category:category,

    updated_at:new Date().toISOString()

  };


  let savedProduct;


  if(id){

    const {data,error} =
      await supabaseClient
        .from("products")
        .update(values)
        .eq("id",id)
        .select()
        .single();

    if(error){

      showMessage("Error al actualizar producto");

      console.error(error);

      return;
    }

    savedProduct = data;

  }else{

    const {data,error} =
      await supabaseClient
        .from("products")
        .insert({
          ...values,
          available:true,
          sort_order:products.length
        })
        .select()
        .single();

    if(error){

      showMessage("Error al crear producto");

      console.error(error);

      return;
    }

    savedProduct = data;

  }


  const file =
    document.getElementById("productImage").files[0];


  if(file){

    const imageUrl =
      await uploadProductImage(
        file,
        savedProduct.id
      );

    if(imageUrl){

      await supabaseClient
        .from("products")
        .update({
          image_url:imageUrl,
          updated_at:new Date().toISOString()
        })
        .eq("id",savedProduct.id);

    }

  }


  showMessage("Producto guardado correctamente");

  newProduct();

  await loadProducts();

}



async function uploadProductImage(file,id){

  const extension =
    file.name.split(".").pop().toLowerCase();

  const path =
    "products/" +
    String(id) +
    "-" +
    Date.now() +
    "." +
    extension;


  const {error} =
    await supabaseClient
      .storage
      .from("product-images")
      .upload(
        path,
        file,
        {
          upsert:true,
          contentType:file.type
        }
      );


  if(error){

    console.error(error);

    showMessage("Error al subir imagen");

    return null;
  }


  const {data} =
    supabaseClient
      .storage
      .from("product-images")
      .getPublicUrl(path);


  return data.publicUrl;

}



async function changeProductPhoto(id){

  id = String(id);

  const input =
    document.createElement("input");

  input.type="file";
  input.accept="image/*";


  input.onchange =
    async function(){

      const file =
        input.files[0];

      if(!file) return;


      const imageUrl =
        await uploadProductImage(
          file,
          id
        );

      if(!imageUrl) return;


      const {error} =
        await supabaseClient
          .from("products")
          .update({
            image_url:imageUrl,
            updated_at:new Date().toISOString()
          })
          .eq("id",id);


      if(error){

        console.error(error);

        showMessage("No se pudo guardar la foto");

        return;
      }


      showMessage("Foto guardada");

      await loadProducts();

    };


  input.click();

}



async function loadCategories(){

  const {data,error} =
    await supabaseClient
      .from("settings")
      .select("key,value")
      .eq("key","categories")
      .maybeSingle();


  if(!error && data && data.value){

    try{

      const parsed =
        JSON.parse(data.value);

      if(Array.isArray(parsed) && parsed.length){

        categories = parsed;

      }

    }catch(e){}

  }


  renderCategories();

  populateCategorySelect();

}



function renderCategories(){

  const box =
    document.getElementById("categoryList");

  box.innerHTML =
    categories.map((category,index)=>`

      <div class="category-row">

        <span>${escapeHtml(category)}</span>

        <button
          class="delete-category"
          onclick="deleteCategory(${index})"
        >
          Eliminar
        </button>

      </div>

    `).join("");

}



function populateCategorySelect(){

  const select =
    document.getElementById("productCategory");

  if(!select) return;

  select.innerHTML =
    categories.map(category=>`

      <option value="${escapeHtml(category)}">
        ${escapeHtml(category)}
      </option>

    `).join("");

}



async function saveSetting(key,value){

  const {data:existing,error:findError} =
    await supabaseClient
      .from("settings")
      .select("id")
      .eq("key",key)
      .maybeSingle();


  if(findError){

    console.error(findError);

    return false;
  }


  if(existing){

    const {error} =
      await supabaseClient
        .from("settings")
        .update({
          value:String(value),
          updated_at:new Date().toISOString()
        })
        .eq("id",existing.id);

    if(error){

      console.error(error);

      return false;
    }

  }else{

    const {error} =
      await supabaseClient
        .from("settings")
        .insert({
          key:key,
          value:String(value)
        });

    if(error){

      console.error(error);

      return false;
    }

  }

  return true;

}



async function addCategory(){

  const input =
    document.getElementById("newCategory");

  const name =
    input.value.trim();

  if(!name) return;

  if(
    categories.some(
      c=>c.toLowerCase()===name.toLowerCase()
    )
  ){

    showMessage("Esa categoría ya existe");

    return;
  }


  categories.push(name);

  const ok =
    await saveSetting(
      "categories",
      JSON.stringify(categories)
    );


  if(!ok){

    categories.pop();

    showMessage("No se pudo guardar la categoría");

    return;
  }


  input.value="";

  renderCategories();

  populateCategorySelect();

  showMessage("Categoría agregada");

}



async function deleteCategory(index){

  if(categories.length<=1){

    showMessage("Debe existir al menos una categoría");

    return;
  }


  const deleted =
    categories[index];

  const replacement =
    categories[index === 0 ? 1 : 0];


  const {error} =
    await supabaseClient
      .from("products")
      .update({
        category:replacement,
        updated_at:new Date().toISOString()
      })
      .eq("category",deleted);


  if(error){

    console.error(error);

    showMessage("No se pudo eliminar la categoría");

    return;
  }


  categories.splice(index,1);


  const ok =
    await saveSetting(
      "categories",
      JSON.stringify(categories)
    );


  if(!ok){

    showMessage("No se pudo guardar");

    return;
  }


  renderCategories();

  populateCategorySelect();

  await loadProducts();

  showMessage("Categoría eliminada");

}



async function uploadDesignImage(type){

  let input;

  if(type==="cover")
    input=document.getElementById("coverFile");

  if(type==="profile")
    input=document.getElementById("profileFile");

  if(type==="background")
    input=document.getElementById("backgroundFile");


  const file =
    input.files[0];

  if(!file) return;


  const extension =
    file.name.split(".").pop().toLowerCase();


  const path =
    "design/" +
    type +
    "-" +
    Date.now() +
    "." +
    extension;


  const {error} =
    await supabaseClient
      .storage
      .from("product-images")
      .upload(
        path,
        file,
        {
          upsert:true,
          contentType:file.type
        }
      );


  if(error){

    console.error(error);

    showMessage("Error al subir imagen");

    return;
  }


  const {data} =
    supabaseClient
      .storage
      .from("product-images")
      .getPublicUrl(path);


  await saveSetting(
    type+"_image",
    data.publicUrl
  );


  let preview;

  if(type==="cover")
    preview=document.getElementById("coverPreview");

  if(type==="profile")
    preview=document.getElementById("profilePreview");

  if(type==="background")
    preview=document.getElementById("backgroundPreview");


  preview.src=data.publicUrl;

  preview.style.display="block";

  showMessage("Imagen guardada automáticamente");

}

function setRange(id,value){

  const el =
    document.getElementById(id);

  if(!el) return;

  el.value=value;

  el.dispatchEvent(
    new Event("input")
  );

}



function backgroundTypeChanged(){

    type==="color" ? "block" : "none";

async function loadOrders(){

  const box =
    document.getElementById("ordersList");

  const {data,error} =
    await supabaseClient
      .from("orders")
      .select("*")
      .order("created_at",{ascending:false});


  if(error){

    box.innerText=error.message;

    return;
  }


  if(!data || !data.length){

    box.innerText="No hay pedidos.";

    return;
  }


  box.innerHTML =
    data.map(order=>`

      <div class="card">

        <strong>Pedido ${escapeHtml(String(order.id))}</strong>

        <p>${escapeHtml(order.customer_name || "")}</p>

        <p>${escapeHtml(order.customer_phone || "")}</p>

        <p>${escapeHtml(order.delivery_type || "")}</p>

        <p>${escapeHtml(order.address || "")}</p>

        <p><strong>Total: $${Number(order.total || 0).toFixed(2)}</strong></p>

        <p>Estado: ${escapeHtml(order.order_status || "")}</p>

      </div>

    `).join("");

}

    return;
  }


  box.innerHTML =
    data.map(customer=>`

      <div class="card">

        <strong>${escapeHtml(customer.name || "")}</strong>

        <p>${escapeHtml(customer.phone || "")}</p>

        <p>${escapeHtml(customer.email || "")}</p>

      </div>

    `).join("");

}



function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

<title>Administrador PasteHot</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f3f4f6;

}

header{

padding:20px;
display:flex;

}

header h1{
margin:0;

}

header button{

border:0;

}

.container{
max-width:1250px;

}

.login{
max-width:420px;
margin:80px auto;
background:white;
padding:30px;
border-radius:16px;

}

.login h2{

}

label{

input,
textarea,

button{

}

.primary{

color:white;
border:0;
border-radius:8px;

}

.dark{

.delete{

.tabs{

}

.tab{
background:white;

padding:12px 18px;

.tab.active{

.section{

}

.section.active{

}

.card{

padding:22px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.card h2{
margin-top:0;
}

.product{
background:white;
border-radius:14px;
padding:15px;
margin-bottom:12px;
display:flex;
align-items:center;
gap:15px;

}

.product img{

height:90px;
object-fit:cover;
border-radius:10px;
background:#eee;
}

.product-info{
flex:1;
min-width:0;
}

.product-info h3{
margin:0 0 5px;
}

.product-info p{
margin:4px 0;
color:#666;
}

.actions{
display:flex;
align-items:center;
gap:9px;
flex-wrap:wrap;
}

.switch{
width:58px;
height:31px;
position:relative;
display:inline-block;
}

.switch input{
display:none;
}

.slider{
position:absolute;
inset:0;
background:#d71920;
border-radius:30px;
transition:.2s;
}

.slider:before{
content:"";
position:absolute;
width:25px;
height:25px;
left:3px;
top:3px;
background:white;
border-radius:50%;
transition:.2s;
box-shadow:0 2px 4px rgba(0,0,0,.3);
}

.switch input:checked + .slider{
background:#18a844;
}

.switch input:checked + .slider:before{
transform:translateX(27px);
}

.status{
font-size:11px;
font-weight:bold;
margin-top:4px;
}

.status.on{
color:#15963c;
}

.status.off{
color:#d71920;
}

.file-button{
display:inline-block;
background:#222;
color:white;
padding:12px 17px;
border-radius:8px;
cursor:pointer;
margin-bottom:10px;
}

.file-button input{
display:none;
}

.preview{
display:none;
width:100%;
max-width:400px;
max-height:250px;
object-fit:cover;
border-radius:12px;
margin-top:10px;
}

.design-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.design-box{
border:1px solid #ddd;
padding:18px;
border-radius:12px;
}

.range{
margin-top:15px;
}

.range input{
margin:4px 0;
}

.category-row{
display:flex;
gap:10px;
align-items:center;
margin-bottom:10px;
}

.category-name{
flex:1;
background:#f1f1f1;
padding:11px;
border-radius:8px;
}

.add-category{
display:flex;
gap:10px;
}

.add-category input{
margin:0;
}

.message{
position:fixed;
bottom:20px;
right:20px;
background:#111;
color:white;
padding:14px 20px;
border-radius:10px;
display:none;
z-index:9999;
}

@media(max-width:850px){

.design-grid{
grid-template-columns:1fr;
}

.product{
align-items:flex-start;
}

.actions{
width:100%;
}

}

@media(max-width:600px){

.container{
padding:15px;
}

.product{
flex-direction:column;
}

.product img{
width:100%;
height:190px;
}

.actions{
width:100%;
}

.actions button{
flex:1;
}

}

</style>

</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
"https://cqlywpemisknrxswlmea.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wDu6p-CtnQtYu7KWH1YS1A_h7LeL0SX";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let products=[];


let categories=[
"Pastes salados",
"Pastes dulces",
"Pastes de temporada",
"Bebidas",
"Promociones"
];


async function login(){

const email=
document.getElementById("email").value.trim();

const password=
document.getElementById("password").value;


const result=
await db.auth.signInWithPassword({
email,
password
});


if(result.error){

document.getElementById("loginError").innerText=
result.error.message;

return;

}


document.getElementById("loginScreen").style.display="none";

document.getElementById("adminScreen").style.display="block";


await init();

}


async function logout(){

await db.auth.signOut();

location.reload();

}


async function init(){

await loadCategories();

await loadProducts();

await loadDesign();

await loadBusiness();

await loadOrders();

await loadCustomers();

}


function showTab(id,button){

document
.querySelectorAll(".section")
.forEach(x=>x.classList.remove("active"));

document
.querySelectorAll(".tab")
.forEach(x=>x.classList.remove("active"));

document
.getElementById(id)
.classList.add("active");

button.classList.add("active");

}


async function loadProducts(){

const result=
await db
.from("products")
.select("*")
.order("sort_order",{ascending:true})
.order("created_at",{ascending:true});


if(result.error){

console.error(result.error);

showMessage(
"Error cargando productos: "+
result.error.message
);

return;

}


products=result.data || [];

renderProducts();

populateCategories();

}


function renderProducts(){

const box=
document.getElementById("productList");


if(!products.length){

box.innerHTML=
"<p>No hay productos.</p>";

return;

}


box.innerHTML="";


products.forEach(product=>{

const row=
document.createElement("div");

row.className="product";


const img=
document.createElement("img");

img.src=
product.image_url ||
"https://via.placeholder.com/300";

img.onerror=function(){

this.src="https://via.placeholder.com/300";

};


const info=
document.createElement("div");

info.className="product-info";


const title=
document.createElement("h3");

title.innerText=
product.name || "";


const desc=
document.createElement("p");

desc.innerText=
product.description || "";


const price=
document.createElement("p");

price.innerText=
"$"+Number(product.price || 0).toFixed(2);


const category=
document.createElement("p");

category.innerText=
product.category || "";


info.appendChild(title);
info.appendChild(desc);
info.appendChild(price);
info.appendChild(category);


const actions=
document.createElement("div");

actions.className="actions";


const switchBox=
document.createElement("div");


const label=
document.createElement("label");

label.className="switch";


const checkbox=
document.createElement("input");

checkbox.type="checkbox";

checkbox.checked=
product.available === true;


checkbox.addEventListener(
"change",
function(){

toggleProduct(
product.id,
this.checked
);

}
);


const slider=
document.createElement("span");

slider.className="slider";


label.appendChild(checkbox);
label.appendChild(slider);


const status=
document.createElement("div");

status.className=
"status "+
(
product.available
?"on"
:"off"
);

status.innerText=
product.available
?"DISPONIBLE"
:"AGOTADO";


switchBox.appendChild(label);
switchBox.appendChild(status);


const edit=
document.createElement("button");

edit.className="dark";

edit.innerText="Editar";


edit.addEventListener(
"click",
function(){

editProduct(product.id);

}
);


const photo=
document.createElement("button");

photo.className="dark";

photo.innerText="Cambiar foto";


photo.addEventListener(
"click",
function(){

changePhoto(product.id);

}
);


const deleteButton=
document.createElement("button");

deleteButton.className="delete";

deleteButton.innerText="Borrar";


deleteButton.addEventListener(
"click",
function(){

deleteProduct(product.id);

}
);


actions.appendChild(switchBox);
actions.appendChild(edit);
actions.appendChild(photo);
actions.appendChild(deleteButton);


row.appendChild(img);
row.appendChild(info);
row.appendChild(actions);


box.appendChild(row);

});

}


async function toggleProduct(id,available){

const result=
await db
.from("products")
.update({
available:available,
updated_at:new Date().toISOString()
})
.eq("id",id)
.select();


if(result.error){

console.error(result.error);

showMessage(
"No se pudo guardar: "+
result.error.message
);

await loadProducts();

return;

}


showMessage(
available
?"Producto encendido"
:"Producto apagado"
);


await loadProducts();

}


function editProduct(id){

const product=
products.find(
p=>String(p.id)===String(id)
);


if(!product){

showMessage("Producto no encontrado");

return;

}


document.getElementById("productId").value=
product.id;


document.getElementById("productName").value=
product.name || "";


document.getElementById("productDescription").value=
product.description || "";


document.getElementById("productPrice").value=
product.price || "";


populateCategories();


document.getElementById("productCategory").value=
product.category || categories[0];


const preview=
document.getElementById("productPreview");


if(product.image_url){

preview.src=
product.image_url;

preview.style.display="block";

}else{

preview.style.display="none";

}


document.getElementById("formTitle").innerText=
"Editar producto";


window.scrollTo({
top:0,
behavior:"smooth"
});


showMessage("Producto cargado para editar");

}


async function saveProduct(){

const id=
document.getElementById("productId").value;


const name=
document.getElementById("productName").value.trim();


const description=
document.getElementById("productDescription").value.trim();


const price=
Number(
document.getElementById("productPrice").value
);


const category=
document.getElementById("productCategory").value;


if(!name){

showMessage("Escribe el nombre");

return;

}


if(!Number.isFinite(price)){

showMessage("Escribe un precio válido");

return;

}


let product;


if(id){

const result=
await db
.from("products")
.update({
name,
description,
price,
category,
updated_at:new Date().toISOString()
})
.eq("id",id)
.select()
.single();


if(result.error){

console.error(result.error);

showMessage(
"Error: "+
result.error.message
);

return;

}


product=result.data;


}else{


const result=
await db
.from("products")
.insert({
name,
description,
price,
category,
available:true,
sort_order:products.length
})
.select()
.single();


if(result.error){

console.error(result.error);

showMessage(
"Error: "+
result.error.message
);

return;

}


product=result.data;

}


const file=
document.getElementById("productImage").files[0];


if(file){

const imageUrl=
await uploadProductImage(
file,
product.id
);


if(imageUrl){

const result=
await db
.from("products")
.update({
image_url:imageUrl
})
.eq("id",product.id);


if(result.error){

console.error(result.error);

}

}

}


showMessage(
id
?"Producto actualizado correctamente"
:"Producto creado correctamente"
);


newProduct();

await loadProducts();

}


async function uploadProductImage(file,id){

const ext=
file.name
.split(".")
.pop()
.toLowerCase();


const path=
"products/"+
String(id)+
"-"+
Date.now()+
"."+ext;


const upload=
await db
.storage
.from("product-images")
.upload(
path,
file,
{
upsert:false,
contentType:file.type
}
);


if(upload.error){

console.error(upload.error);

showMessage(
"Error subiendo imagen: "+
upload.error.message
);

return null;

}


const url=
db
.storage
.from("product-images")
.getPublicUrl(path);


return url.data.publicUrl;

}


function changePhoto(id){

const input=
document.createElement("input");

input.type="file";

input.accept="image/*";


input.onchange=
async function(){

const file=
input.files[0];

if(!file)return;


const url=
await uploadProductImage(
file,
id
);


if(!url)return;


const result=
await db
.from("products")
.update({
image_url:url,
updated_at:new Date().toISOString()
})
.eq("id",id);


if(result.error){

console.error(result.error);

showMessage(
"No se pudo guardar la imagen"
);

return;

}


showMessage("Imagen guardada");

await loadProducts();

};


input.click();

}


async function deleteProduct(id){

const product=
products.find(
p=>String(p.id)===String(id)
);


if(!product)return;


const confirmDelete=
confirm(
'¿Quieres borrar "'+
product.name+
'" definitivamente?'
);


if(!confirmDelete)return;


const result=
await db
.from("products")
.delete()
.eq("id",id);


if(result.error){

console.error(result.error);

showMessage(
"No se pudo borrar: "+
result.error.message
);

return;

}


showMessage("Producto borrado");

await loadProducts();

}


function newProduct(){

document.getElementById("productId").value="";

document.getElementById("productName").value="";

document.getElementById("productDescription").value="";

document.getElementById("productPrice").value="";

document.getElementById("productImage").value="";

document.getElementById("productPreview").style.display="none";

populateCategories();

document.getElementById("formTitle").innerText=
"Agregar producto";

}


async function loadCategories(){

const result=
await db
.from("settings")
.select("value")
.eq("key","categories")
.maybeSingle();


if(
result.data &&
result.data.value
){

try{

const saved=
JSON.parse(result.data.value);

if(
Array.isArray(saved) &&
saved.length
){

categories=saved;

}

}catch(e){}

}


renderCategories();

populateCategories();

}


function populateCategories(){

const select=
document.getElementById("productCategory");


select.innerHTML="";


categories.forEach(category=>{

const option=
document.createElement("option");

option.value=category;

option.textContent=category;

select.appendChild(option);

});

}


function renderCategories(){

const box=
document.getElementById("categoryList");

box.innerHTML="";


categories.forEach(
(category,index)=>{

const row=
document.createElement("div");

async function saveSetting(key,value){

const existing=
await db
.from("settings")
.select("id")
.eq("key",key)
.maybeSingle();


if(existing.error){

console.error(existing.error);

return false;

}


if(existing.data){

const result=
await db
.from("settings")
.update({
value:String(value),
updated_at:new Date().toISOString()
})
.eq("id",existing.data.id);


if(result.error){

console.error(result.error);

return false;

}

}else{

const result=
await db
.from("settings")
.insert({
key:key,
value:String(value)
});


if(result.error){

console.error(result.error);

return false;

}

}


return true;

}


async function addCategory(){

const input=
document.getElementById("newCategory");


const name=
input.value.trim();


if(!name){

showMessage("Escribe una categoría");

return;

}


if(
categories.some(
x=>x.toLowerCase()===name.toLowerCase()
)
){

showMessage("La categoría ya existe");

return;

}


categories.push(name);


const ok=
await saveSetting(
"categories",
JSON.stringify(categories)
);


if(!ok){

categories.pop();

showMessage("No se pudo guardar");

return;

}


input.value="";

renderCategories();

populateCategories();

showMessage("Nueva categoría creada");

}


async function deleteCategory(index){

if(categories.length<=1){

showMessage(
"Debe quedar al menos una categoría"
);

return;

}


const category=
categories[index];


const replacement=
categories[index===0?1:0];


const result=
await db
.from("products")
.update({
category:replacement,
updated_at:new Date().toISOString()
})
.eq("category",category);


if(result.error){

console.error(result.error);

showMessage(
"No se pudo borrar la categoría"
);

return;

}


categories.splice(index,1);


await saveSetting(
"categories",
JSON.stringify(categories)
);


renderCategories();

populateCategories();

await loadProducts();

showMessage("Categoría borrada");

}


async function uploadDesign(type){

let input;


if(type==="cover")
input=document.getElementById("coverFile");

if(type==="profile")
input=document.getElementById("profileFile");

if(type==="background")
input=document.getElementById("backgroundFile");


const file=input.files[0];

if(!file)return;


const ext=
file.name.split(".").pop().toLowerCase();


const path=
"design/"+
type+
"-"+
Date.now()+
"."+ext;


const upload=
await db
.storage
.from("product-images")
.upload(
path,
file,
{
upsert:false,
contentType:file.type
}
);


if(upload.error){

console.error(upload.error);

showMessage(
"Error subiendo imagen"
);

return;

}


const url=
db
.storage
.from("product-images")
.getPublicUrl(path);


await saveSetting(
type+"_image",
url.data.publicUrl
);


let preview;


if(type==="cover")
preview=document.getElementById("coverPreview");

if(type==="profile")
preview=document.getElementById("profilePreview");

if(type==="background")
preview=document.getElementById("backgroundPreview");


preview.src=url.data.publicUrl;

preview.style.display="block";


showMessage("Imagen guardada");

}

async function loadOrders(){

const box=
document.getElementById("ordersList");


const result=
await db
.from("orders")
.select("*")
.order("created_at",{ascending:false});


if(result.error){

box.innerText=result.error.message;

return;

}


if(!result.data.length){

box.innerText="No hay pedidos.";

return;

}


box.innerHTML=
result.data.map(
order=>`

<div class="card">

<strong>Pedido</strong>

<p>
${escapeHtml(order.customer_name || "")}
</p>

<p>
${escapeHtml(order.customer_phone || "")}
</p>

<p>
Total: $${Number(order.total||0).toFixed(2)}
</p>

</div>

`
).join("");

}


async function loadCustomers(){

const box=
document.getElementById("customersList");


const result=
await db
.from("customers")
.select("*")
.order("created_at",{ascending:false});


if(result.error){

box.innerText=result.error.message;

return;

}


if(!result.data.length){

box.innerText="No hay clientes.";

return;

}


box.innerHTML=
result.data.map(
customer=>`

<div class="card">

<strong>
${escapeHtml(customer.name||"")}
</strong>

<p>
${escapeHtml(customer.phone||"")}
</p>

<p>
${escapeHtml(customer.email||"")}
</p>

</div>

`
).join("");

}


function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function showMessage(text){

const box=
document.getElementById("message");

box.innerText=text;

box.style.display="block";


clearTimeout(window.msgTimer);


window.msgTimer=
setTimeout(
()=>{
box.style.display="none";
},
3000
);

}

}

}
);

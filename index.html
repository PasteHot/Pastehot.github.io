<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
  color:#171717;
  background:#f4f4f4;
}

body{
  min-height:100vh;
}

button,
input,
select,
textarea{
  font-family:inherit;
}

/* =========================
   FONDO
========================= */

#pageBackground{
  position:fixed;
  inset:0;
  z-index:-5;
  background:#f4f4f4;
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
}

#backgroundOverlay{
  position:fixed;
  inset:0;
  z-index:-4;
  background:rgba(255,255,255,.08);
  pointer-events:none;
}

/* =========================
   PORTADA
========================= */

.hero{
  position:relative;
  width:100%;
  aspect-ratio:16 / 9;
  min-height:220px;
  max-height:700px;
  overflow:hidden;
  background:#111;
}

.hero-cover{
  position:absolute;
  left:50%;
  top:50%;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  transform:translate(-50%,-50%);
  transform-origin:center center;
  display:none;
  user-select:none;
  pointer-events:none;
}

.hero-profile{
  position:absolute;
  left:50%;
  top:50%;
  width:150px;
  height:150px;
  border-radius:50%;
  object-fit:cover;
  object-position:center;
  transform:translate(-50%,-50%);
  border:6px solid white;
  box-shadow:0 8px 28px rgba(0,0,0,.30);
  display:none;
  user-select:none;
  pointer-events:none;
}

/* =========================
   CONTENEDOR
========================= */

.page{
  width:min(1180px,94%);
  margin:0 auto;
  padding:25px 0 50px;
}

.menu-title{
  text-align:center;
  margin:0 0 24px;
}

.menu-title h1{
  margin:0;
  font-size:30px;
  font-weight:800;
}

.menu-title p{
  margin:8px 0 0;
  color:#666;
}

/* =========================
   CATEGORÍAS
========================= */

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:4px 2px 15px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category-btn{
  flex:0 0 auto;
  border:none;
  border-radius:999px;
  padding:12px 20px;
  background:white;
  color:#333;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  transition:.2s;
}

.category-btn:hover{
  transform:translateY(-1px);
}

.category-btn.active{
  background:#111;
  color:white;
}

/* =========================
   PRODUCTOS
========================= */

.category-section{
  margin-top:28px;
}

.category-title{
  font-size:25px;
  margin:0 0 16px;
  font-weight:800;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:20px;
}

.product{
  position:relative;
  overflow:hidden;
  border-radius:20px;
  background:white;
  box-shadow:0 7px 25px rgba(0,0,0,.09);
  transition:.2s;
}

.product:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 30px rgba(0,0,0,.13);
}

.product-image-wrap{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  background:#eee;
  overflow:hidden;
}

.product-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:.2s;
}

/*
  IMPORTANTE:
  Cuando está agotado NO se aplica opacity al
  producto completo, porque eso también apagaba
  la palabra AGOTADO.
*/

.product.soldout .product-image{
  opacity:.40;
  filter:grayscale(.55);
}

.soldout-label{
  position:absolute;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  z-index:10;
  background:#d40000;
  color:white;
  font-size:14px;
  font-weight:900;
  letter-spacing:.8px;
  padding:7px 13px;
  border-radius:999px;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
  opacity:1 !important;
  filter:none !important;
  white-space:nowrap;
}

.product-body{
  padding:17px;
}

.product.soldout .product-body{
  opacity:.45;
}

.product-name{
  font-size:18px;
  font-weight:800;
  margin:0 0 7px;
}

.product-description{
  font-size:14px;
  color:#666;
  line-height:1.4;
  min-height:40px;
}

.product-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:15px;
}

.product-price{
  font-size:20px;
  font-weight:900;
}

.add-button{
  border:none;
  width:42px;
  height:42px;
  border-radius:50%;
  background:#111;
  color:white;
  font-size:24px;
  line-height:42px;
  cursor:pointer;
}

.product.soldout .add-button{
  cursor:not-allowed;
}

/* =========================
   CARRITO
========================= */

.cart-button{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:100;
  width:62px;
  height:62px;
  border:0;
  border-radius:50%;
  background:#111;
  color:white;
  cursor:pointer;
  box-shadow:0 8px 30px rgba(0,0,0,.28);
  display:flex;
  align-items:center;
  justify-content:center;
}

.cart-button svg{
  width:29px;
  height:29px;
}

.cart-count{
  position:absolute;
  right:-2px;
  top:-3px;
  min-width:23px;
  height:23px;
  padding:0 6px;
  border-radius:999px;
  background:#e00000;
  color:white;
  font-size:12px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
}

.cart-panel{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:200;
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.cart-panel.open{
  display:flex;
}

.cart-box{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:25px 25px 0 0;
  padding:25px;
}

.cart-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.cart-header h2{
  margin:0;
}

.close-cart{
  border:0;
  background:#eee;
  width:38px;
  height:38px;
  border-radius:50%;
  cursor:pointer;
  font-size:20px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:13px 0;
  border-bottom:1px solid #eee;
}

.cart-item-info{
  flex:1;
}

.cart-item-name{
  font-weight:800;
}

.cart-item-price{
  color:#666;
  margin-top:4px;
}

.qty-controls{
  display:flex;
  align-items:center;
  gap:8px;
}

.qty-controls button{
  width:30px;
  height:30px;
  border:0;
  border-radius:50%;
  background:#eee;
  cursor:pointer;
  font-weight:bold;
}

.cart-total{
  display:flex;
  justify-content:space-between;
  font-size:21px;
  font-weight:900;
  padding:20px 0;
}

.order-form{
  display:grid;
  gap:12px;
}

.order-form input,
.order-form textarea,
.order-form select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
}

.order-form textarea{
  min-height:80px;
  resize:vertical;
}

.delivery-option{
  display:grid;
  gap:8px;
}

.delivery-row{
  display:flex;
  gap:10px;
  align-items:center;
  padding:12px;
  border:1px solid #ddd;
  border-radius:12px;
  cursor:pointer;
}

.delivery-extra{
  font-size:12px;
  color:#777;
  margin-left:auto;
}

.transfer-panel{
  display:none;
  background:#f4f4f4;
  border-radius:14px;
  padding:15px;
  margin-top:3px;
  font-size:14px;
  line-height:1.6;
}

.transfer-panel.show{
  display:block;
}

.maps-button{
  display:none;
  text-decoration:none;
  background:#eee;
  color:#111;
  padding:11px 13px;
  border-radius:11px;
  font-weight:700;
  text-align:center;
}

.whatsapp-button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  background:#20b957;
  color:white;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
}

.whatsapp-button svg{
  width:22px;
  height:22px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){
  .products{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(max-width:650px){

  .hero{
    min-height:0;
    max-height:none;
  }

  .hero-profile{
    width:120px;
    height:120px;
    border-width:5px;
  }

  .page{
    width:94%;
    padding-top:20px;
  }

  .menu-title h1{
    font-size:25px;
  }

  .products{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:13px;
  }

  .product{
    border-radius:16px;
  }

  .product-body{
    padding:12px;
  }

  .product-name{
    font-size:16px;
  }

  .product-description{
    font-size:13px;
  }

  .product-price{
    font-size:17px;
  }

  .add-button{
    width:38px;
    height:38px;
    line-height:38px;
  }

  .cart-button{
    width:58px;
    height:58px;
    right:16px;
    bottom:16px;
  }
}

@media(max-width:390px){
  .products{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div id="pageBackground"></div>
<div id="backgroundOverlay"></div>

<header class="hero" id="hero">
  <img id="heroCover" class="hero-cover" alt="">
  <img id="heroProfile" class="hero-profile" alt="">
</header>

<main class="page">

  <div class="menu-title">
    <h1 id="menuTitle"></h1>
    <p id="menuSlogan"></p>
  </div>

  <div class="categories" id="categories"></div>

  <div id="menu"></div>

</main>

<button class="cart-button" onclick="openCart()" aria-label="Carrito">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="9" cy="20" r="1"></circle>
    <circle cx="18" cy="20" r="1"></circle>
    <path d="M3 4h2l2.4 11.3a2 2 0 0 0 2 1.7h7.9a2 2 0 0 0 1.9-1.4L21 8H6"></path>
  </svg>
  <span class="cart-count" id="cartCount">0</span>
</button>

<div class="cart-panel" id="cartPanel">
  <div class="cart-box">

    <div class="cart-header">
      <h2>Tu pedido</h2>
      <button class="close-cart" onclick="closeCart()">×</button>
    </div>

    <div id="cartItems"></div>

    <div class="cart-total">
      <span>Total</span>
      <span id="cartTotal">$0.00</span>
    </div>

    <div class="order-form">

      <input id="customerName" type="text" placeholder="Nombre">

      <input id="customerPhone" type="tel" placeholder="Teléfono">

      <div class="delivery-option">

        <label class="delivery-row">
          <input type="radio" name="deliveryType" value="delivery" checked onchange="updateDeliveryUI()">
          <span>Entrega a domicilio</span>
          <span class="delivery-extra">costo extra</span>
        </label>

        <label class="delivery-row">
          <input type="radio" name="deliveryType" value="pickup" onchange="updateDeliveryUI()">
          <span>Recoger</span>
        </label>

      </div>

      <input id="address" type="text" placeholder="Dirección de entrega">

      <a id="mapsButton" class="maps-button" href="#" target="_blank">
        📍 Ver ubicación para recoger
      </a>

      <select id="paymentMethod" onchange="updatePaymentUI()">
        <option value="cash">Efectivo</option>
        <option value="transfer">Transferencia</option>
      </select>

      <div id="transferPanel" class="transfer-panel"></div>

      <textarea id="orderNotes" placeholder="Notas del pedido"></textarea>

      <button class="whatsapp-button" onclick="sendOrder()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 11.5a8.4 8.4 0 0 1-12.7 7.3L3 20l1.3-4.1A8.5 8.5 0 1 1 20 11.5Z"></path>
          <path d="M8.5 8.5c.2-.5.4-.5.7-.5h.5c.2 0 .4.1.5.4l.7 1.6c.1.3.1.5-.1.7l-.5.6c.6 1.1 1.5 1.9 2.6 2.4l.5-.6c.2-.2.4-.2.7-.1l1.5.7c.3.1.4.3.4.5v.5c0 .3-.1.5-.4.7-.4.2-.9.3-1.3.2-2.3-.5-4.6-2.8-5.1-5.1-.1-.4 0-.9.2-1.3Z"></path>
        </svg>
        Pedir por WhatsApp
      </button>

    </div>

  </div>
</div>

<script>
const SUPABASE_URL = "https://cqlywpemisknrxswlmea.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_wDu6p-CtnQtYu7KWH1YS1A_h7LeL0SX";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let products = [];
let settings = {};
let cart = {};

const categoriesOrder = [
  "Pastes salados",
  "Pastes dulces",
  "Pastes de temporada",
  "Bebidas",
  "Promociones"
];

/* =========================
   CARGAR
========================= */

async function init(){

  const [productsResult, settingsResult] = await Promise.all([
    db
      .from("products")
      .select("*")
      .order("sort_order",{ascending:true})
      .order("id",{ascending:true}),

    db
      .from("settings")
      .select("*")
  ]);

  if(productsResult.error){
    console.error(productsResult.error);
    return;
  }

  if(settingsResult.error){
    console.error(settingsResult.error);
    return;
  }

  products = productsResult.data || [];

  settings = {};

  for(const row of settingsResult.data || []){
    settings[row.key] = row.value;
  }

  applyDesign();
  renderMenu();
  updatePaymentUI();
  updateDeliveryUI();
}

/* =========================
   DISEÑO
========================= */

function applyDesign(){

  const cover = document.getElementById("heroCover");
  const profile = document.getElementById("heroProfile");
  const background = document.getElementById("pageBackground");

  if(settings.cover_image){
    cover.src = settings.cover_image;
    cover.style.display = "block";

    const scale = Number(settings.cover_scale) || 1;
    const x = Number(settings.cover_x) || 0;
    const y = Number(settings.cover_y) || 0;

    cover.style.left = `calc(50% + ${x}%)`;
    cover.style.top = `calc(50% + ${y}%)`;
    cover.style.transform =
      `translate(-50%,-50%) scale(${scale})`;
  }else{
    cover.style.display = "none";
  }

  if(settings.profile_image){
    profile.src = settings.profile_image;
    profile.style.display = "block";

    const scale = Number(settings.profile_scale) || 1.3;
    const x = Number(settings.profile_x) || 0;
    const y = Number(settings.profile_y) || 0;

    profile.style.left = `calc(50% + ${x}%)`;
    profile.style.top = `calc(50% + ${y}%)`;
    profile.style.transform =
      `translate(-50%,-50%) scale(${scale})`;
  }else{
    profile.style.display = "none";
  }

  if(settings.background_type === "image" && settings.background_image){
    background.style.backgroundImage =
      `url("${settings.background_image}")`;
  }else{
    background.style.backgroundImage = "none";
  }

  background.style.backgroundColor =
    settings.background_color || "#f4f4f4";

  document.getElementById("menuTitle").textContent =
    settings.menu_title || "";

  document.getElementById("menuSlogan").textContent =
    settings.slogan || "";
}

/* =========================
   CATEGORÍAS
========================= */

function getCategories(){

  const found = new Set();

  products.forEach(p=>{
    if(p.category){
      found.add(p.category);
    }
  });

  const result = [];

  categoriesOrder.forEach(category=>{
    if(found.has(category)){
      result.push(category);
    }
  });

  found.forEach(category=>{
    if(!result.includes(category)){
      result.push(category);
    }
  });

  return result;
}

function renderCategories(){

  const container =
    document.getElementById("categories");

  container.innerHTML = "";

  const categories = getCategories();

  categories.forEach((category,index)=>{

    const button =
      document.createElement("button");

    button.className =
      "category-btn" + (index === 0 ? " active" : "");

    button.textContent = category;

    button.onclick = ()=>{

      document
        .querySelectorAll(".category-btn")
        .forEach(btn=>btn.classList.remove("active"));

      button.classList.add("active");

      const section =
        document.getElementById(
          "category-" + slug(category)
        );

      if(section){
        section.scrollIntoView({
          behavior:"smooth",
          block:"start"
        });
      }
    };

    container.appendChild(button);
  });
}

/* =========================
   MENÚ
========================= */

function renderMenu(){

  renderCategories();

  const menu =
    document.getElementById("menu");

  menu.innerHTML = "";

  const categories = getCategories();

  categories.forEach(category=>{

    const section =
      document.createElement("section");

    section.className = "category-section";
    section.id = "category-" + slug(category);

    const title =
      document.createElement("h2");

    title.className = "category-title";
    title.textContent = category;

    const grid =
      document.createElement("div");

    grid.className = "products";

    products
      .filter(product=>product.category === category)
      .forEach(product=>{
        grid.appendChild(createProduct(product));
      });

    section.appendChild(title);
    section.appendChild(grid);

    menu.appendChild(section);
  });
}

function createProduct(product){

  const card =
    document.createElement("article");

  card.className =
    "product" +
    (product.available ? "" : " soldout");

  const imageWrap =
    document.createElement("div");

  imageWrap.className = "product-image-wrap";

  const image =
    document.createElement("img");

  image.className = "product-image";
  image.src = product.image_url || "";
  image.alt = product.name || "";

  imageWrap.appendChild(image);

  if(!product.available){

    const soldout =
      document.createElement("div");

    soldout.className = "soldout-label";
    soldout.textContent = "AGOTADO";

    imageWrap.appendChild(soldout);
  }

  const body =
    document.createElement("div");

  body.className = "product-body";

  const name =
    document.createElement("h3");

  name.className = "product-name";
  name.textContent = product.name;

  const description =
    document.createElement("div");

  description.className = "product-description";
  description.textContent =
    product.description || "";

  const bottom =
    document.createElement("div");

  bottom.className = "product-bottom";

  const price =
    document.createElement("div");

  price.className = "product-price";
  price.textContent =
    "$" + Number(product.price).toFixed(2);

  const add =
    document.createElement("button");

  add.className = "add-button";
  add.textContent = "+";

  if(product.available){

    add.onclick = ()=>{
      addToCart(product.id);
    };

  }else{

    add.disabled = true;
  }

  bottom.appendChild(price);
  bottom.appendChild(add);

  body.appendChild(name);
  body.appendChild(description);
  body.appendChild(bottom);

  card.appendChild(imageWrap);
  card.appendChild(body);

  return card;
}

/* =========================
   CARRITO
========================= */

function addToCart(id){

  const product =
    products.find(p=>Number(p.id) === Number(id));

  if(!product || !product.available){
    return;
  }

  if(!cart[id]){
    cart[id] = {
      product,
      quantity:1
    };
  }else{
    cart[id].quantity++;
  }

  updateCart();
  openCart();
}

function changeQuantity(id,amount){

  if(!cart[id]) return;

  cart[id].quantity += amount;

  if(cart[id].quantity <= 0){
    delete cart[id];
  }

  updateCart();
}

function updateCart(){

  const items =
    Object.values(cart);

  const container =
    document.getElementById("cartItems");

  container.innerHTML = "";

  let total = 0;
  let count = 0;

  items.forEach(item=>{

    const subtotal =
      Number(item.product.price) *
      item.quantity;

    total += subtotal;
    count += item.quantity;

    const row =
      document.createElement("div");

    row.className = "cart-item";

    row.innerHTML = `
      <div class="cart-item-info">
        <div class="cart-item-name">
          ${escapeHtml(item.product.name)}
        </div>
        <div class="cart-item-price">
          $${subtotal.toFixed(2)}
        </div>
      </div>

      <div class="qty-controls">
        <button onclick="changeQuantity(${item.product.id},-1)">−</button>
        <strong>${item.quantity}</strong>
        <button onclick="changeQuantity(${item.product.id},1)">+</button>
      </div>
    `;

    container.appendChild(row);
  });

  document.getElementById("cartTotal").textContent =
    "$" + total.toFixed(2);

  document.getElementById("cartCount").textContent =
    count;
}

function openCart(){
  document
    .getElementById("cartPanel")
    .classList.add("open");

  updateCart();
}

function closeCart(){
  document
    .getElementById("cartPanel")
    .classList.remove("open");
}

/* =========================
   ENTREGA / RECOGER
========================= */

function updateDeliveryUI(){

  const type =
    document.querySelector(
      'input[name="deliveryType"]:checked'
    )?.value;

  const address =
    document.getElementById("address");

  const maps =
    document.getElementById("mapsButton");

  if(type === "pickup"){

    address.style.display = "none";

    if(settings.pickup_maps_url){

      maps.style.display = "block";
      maps.href = settings.pickup_maps_url;

    }else{

      maps.style.display = "none";
    }

  }else{

    address.style.display = "block";
    maps.style.display = "none";
  }
}

/* =========================
   TRANSFERENCIA
========================= */

function updatePaymentUI(){

  const method =
    document.getElementById("paymentMethod").value;

  const panel =
    document.getElementById("transferPanel");

  if(method !== "transfer"){

    panel.classList.remove("show");
    panel.innerHTML = "";
    return;
  }

  const bank =
    settings.bank_name || "";

  const account =
    settings.bank_account || "";

  const clabe =
    settings.bank_clabe || "";

  const holder =
    settings.bank_holder || "";

  panel.innerHTML = `
    <strong>Datos para transferencia</strong><br><br>
    ${bank ? "Banco: " + escapeHtml(bank) + "<br>" : ""}
    ${holder ? "Titular: " + escapeHtml(holder) + "<br>" : ""}
    ${account ? "Cuenta: " + escapeHtml(account) + "<br>" : ""}
    ${clabe ? "CLABE: " + escapeHtml(clabe) + "<br>" : ""}
  `;

  panel.classList.add("show");
}

/* =========================
   WHATSAPP
========================= */

function sendOrder(){

  const items =
    Object.values(cart);

  if(items.length === 0){
    alert("Agrega al menos un producto.");
    return;
  }

  const name =
    document.getElementById("customerName").value.trim();

  const phone =
    document.getElementById("customerPhone").value.trim();

  const deliveryType =
    document.querySelector(
      'input[name="deliveryType"]:checked'
    )?.value;

  const address =
    document.getElementById("address").value.trim();

  const payment =
    document.getElementById("paymentMethod").value;

  const notes =
    document.getElementById("orderNotes").value.trim();

  if(!name){
    alert("Escribe tu nombre.");
    return;
  }

  if(!phone){
    alert("Escribe tu teléfono.");
    return;
  }

  if(deliveryType === "delivery" && !address){
    alert("Escribe la dirección de entrega.");
    return;
  }

  const whatsapp =
    String(settings.whatsapp || "").replace(/\D/g,"");

  if(!whatsapp){
    alert("El número de WhatsApp todavía no está configurado en el administrador.");
    return;
  }

  let total = 0;

  let message =
    "*NUEVO PEDIDO PASTEHOT*%0A%0A";

  message +=
    "*Cliente:* " +
    encodeURIComponent(name) +
    "%0A";

  message +=
    "*Teléfono:* " +
    encodeURIComponent(phone) +
    "%0A";

  message +=
    "*Modalidad:* " +
    encodeURIComponent(
      deliveryType === "delivery"
      ? "Entrega a domicilio"
      : "Recoger"
    ) +
    "%0A";

  if(deliveryType === "delivery"){

    message +=
      "*Dirección:* " +
      encodeURIComponent(address) +
      "%0A";
  }

  message += "%0A*PRODUCTOS*%0A";

  items.forEach(item=>{

    const subtotal =
      Number(item.product.price) *
      item.quantity;

    total += subtotal;

    message +=
      encodeURIComponent(
        item.quantity +
        " x " +
        item.product.name +
        " — $" +
        subtotal.toFixed(2)
      ) +
      "%0A";
  });

  message +=
    "%0A*TOTAL: $" +
    total.toFixed(2) +
    "*%0A";

  message +=
    "*Pago:* " +
    encodeURIComponent(
      payment === "transfer"
      ? "Transferencia"
      : "Efectivo"
    ) +
    "%0A";

  if(notes){

    message +=
      "*Notas:* " +
      encodeURIComponent(notes) +
      "%0A";
  }

  const url =
    "https://wa.me/" +
    whatsapp +
    "?text=" +
    message;

  window.open(url,"_blank");
}

/* =========================
   UTILIDADES
========================= */

function slug(text){

  return String(text)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"");
}

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PasteHot</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
font-family:Arial,Helvetica,sans-serif;
color:#171717;
background:#f4f4f4;
}

body{
background-repeat:no-repeat;
background-attachment:fixed;
}

.hero{
height:300px;
position:relative;
overflow:hidden;
background:#222;
}

.hero-image{
position:absolute;
left:50%;
top:50%;
width:100%;
height:100%;
object-fit:cover;
transform:
translate(
-50%,
-50%
)
scale(1);
transform-origin:center center;
}

.profile{
position:absolute;
left:50%;
top:50%;
width:150px;
height:150px;
border-radius:50%;
background:white;
border:6px solid white;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,.3);
z-index:5;

transform:
translate(-50%,-50%)
scale(1.3);

transform-origin:center center;
}

.profile img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.main{
max-width:1150px;
margin:auto;
padding:35px 18px 120px;
}

.categories{
display:flex;
gap:10px;
overflow-x:auto;
padding-bottom:18px;
}

.category{
border:0;
background:white;
padding:12px 18px;
border-radius:30px;
font-weight:bold;
white-space:nowrap;
box-shadow:0 2px 10px rgba(0,0,0,.08);
cursor:pointer;
}

.category.active{
background:#e51b23;
color:white;
}

.products{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.product{
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.product-image{
width:100%;
height:230px;
object-fit:cover;
display:block;
}

.product-body{
padding:18px;
}

.product-name{
font-size:21px;
font-weight:800;
margin:0 0 7px;
}

.product-description{
color:#666;
line-height:1.4;
min-height:42px;
}

.product-bottom{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-top:15px;
}

.price{
font-size:21px;
font-weight:900;
}

.add{
background:#e51b23;
color:white;
border:0;
border-radius:9px;
padding:11px 14px;
font-weight:bold;
cursor:pointer;
}

.product.soldout{
position:relative;
}

.product.soldout > .product-image,
.product.soldout > .product-body{
opacity:.42;
filter:grayscale(.45);
}

.soldout-label{
background:#d71920;
color:white;
font-weight:900;
text-align:center;
padding:9px;
font-size:14px;
letter-spacing:1px;
opacity:1 !important;
filter:none !important;

}

.product-image{
transition:none;
}



.cart-button{
position:fixed;
right:20px;
bottom:20px;
width:65px;
height:65px;
border:0;
border-radius:50%;
background:#e51b23;
color:white;
font-size:27px;
cursor:pointer;
box-shadow:0 8px 25px rgba(0,0,0,.3);
z-index:100;
}

.cart-count{
position:absolute;
right:-3px;
top:-3px;
width:24px;
height:24px;
border-radius:50%;
background:#111;
color:white;
font-size:12px;
display:flex;
align-items:center;
justify-content:center;
}

.cart-panel{
position:fixed;
right:20px;
bottom:100px;
width:380px;
max-width:calc(100% - 40px);
background:white;
border-radius:18px;
box-shadow:0 10px 40px rgba(0,0,0,.25);
z-index:99;
padding:20px;
display:none;
max-height:75vh;
overflow:auto;
}

.cart-panel.open{
display:block;
}

.cart-item{
display:flex;
justify-content:space-between;
gap:10px;
padding:10px 0;
border-bottom:1px solid #eee;
}

.cart-total{
font-size:22px;
font-weight:900;
margin:15px 0;
}

.whatsapp{
width:100%;
background:#25d366;
border:0;
color:white;
font-size:16px;
font-weight:bold;
padding:14px;
border-radius:9px;
cursor:pointer;
}

.maps-button{
display:block;
width:100%;
background:#4285f4;
color:white;
text-align:center;
padding:13px;
border-radius:9px;
font-weight:bold;
text-decoration:none;
margin-bottom:15px;
}

.transfer-box{
background:#f3f3f3;
padding:15px;
border-radius:10px;
margin-bottom:15px;
white-space:pre-wrap;
display:none;
}

input,
textarea,
select{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
margin:5px 0 12px;
font-size:15px;
}

@media(max-width:850px){

.products{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:600px){

.hero{
height:230px;
}

.profile{
width:120px;
height:120px;
}

.products{
grid-template-columns:1fr;
}

.product-image{
height:250px;
}

}

</style>

</head>

<body>

<div class="hero">

<img
id="coverImage"
class="hero-image"
style="display:none"
>

<div
id="profileContainer"
class="profile"
>

<img
id="profileImage"
style="display:none"
>

</div>

</div>


<main class="main">

<div
id="categories"
class="categories">
</div>

<div
id="products"
class="products">
</div>

</main>


<button
class="cart-button"
onclick="toggleCart()">

🛒

<span
id="cartCount"
class="cart-count">
0
</span>

</button>


<div
id="cartPanel"
class="cart-panel">

<h2>Tu pedido</h2>

<div id="cartItems"></div>

<div
id="cartTotal"
class="cart-total">
Total: $0.00
</div>

<label>Nombre</label>

<input
id="customerName"
placeholder="Tu nombre"
>

<label>Teléfono</label>

<input
id="customerPhone"
placeholder="Tu teléfono"
>

<label>Tipo de pedido</label>

<select
id="deliveryType"
onchange="deliveryChanged()">

<option value="delivery">
Entrega a domicilio — costo extra
</option>

<option value="pickup">
Recoger pedido
</option>

</select>

<div id="addressBox">

<label>Dirección</label>

<textarea
id="address"
placeholder="Dirección completa"
></textarea>

</div>

<div
id="pickupMapBox"
style="display:none"
>

<a
id="pickupMapButton"
class="maps-button"
target="_blank"
rel="noopener"
>
📍 Abrir ubicación de PasteHot en Google Maps
</a>

</div>

<label>Forma de pago</label>

<select
id="paymentMethod"
onchange="paymentChanged()">

<option value="cash">
Efectivo
</option>

<option value="transfer">
Transferencia
</option>

</select>

<div
id="transferBox"
class="transfer-box">
</div>

<label>Notas</label>

<textarea
id="notes"
placeholder="Notas para tu pedido">
</textarea>

<button
class="whatsapp"
onclick="sendOrder()">

🟢 Pedir por WhatsApp

</button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://cqlywpemisknrxswlmea.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wDu6p-CtnQtYu7KWH1YS1A_h7LeL0SX";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let products=[];

let cart=[];

let settings={};

let activeCategory="";


async function init(){

await loadSettings();

await loadProducts();

renderCategories();

renderProducts();

}


async function loadSettings(){

const result =
await db
.from("settings")
.select("key,value");

if(result.error){

console.error(result.error);

return;

}

settings={};

(result.data || []).forEach(row=>{

settings[row.key]=row.value;

});

applyDesign();

}


function numberSetting(key,defaultValue){

const value=
parseFloat(settings[key]);

return Number.isFinite(value)
?value
:defaultValue;

}


function applyDesign(){

/* =========================
   PORTADA
========================= */

const cover =
document.getElementById("coverImage");

if(settings.cover_image){

cover.src=
settings.cover_image;

cover.style.display="block";

const scale =
numberSetting(
"cover_scale",
100
)/100;

const x =
numberSetting(
"cover_x",
0
);

const y =
numberSetting(
"cover_y",
0
);

cover.style.width =
"100%";

cover.style.height =
"100%";

cover.style.left =
`calc(50% + ${x}px)`;

cover.style.top =
`calc(50% + ${y}px)`;

cover.style.transform =
`translate(-50%, -50%) scale(${scale})`;

}else{

cover.style.display="none";

}


/* =========================
   FOTO DE PERFIL / LOGO
========================= */

const profileContainer =
document.getElementById(
"profileContainer"
);

const profile =
document.getElementById(
"profileImage"
);

if(settings.profile_image){

profile.src =
settings.profile_image;

profile.style.display="block";


const scale =
numberSetting(
"profile_scale",
130
)/100;

const x =
numberSetting(
"profile_x",
0
);

const y =
numberSetting(
"profile_y",
0
);


profileContainer.style.left =
`calc(50% + ${x}px)`;

profileContainer.style.top =
`calc(50% + ${y}px)`;

profileContainer.style.transform =
`translate(-50%, -50%) scale(${scale})`;

}else{

profile.style.display="none";

}


/* =========================
   FONDO
========================= */

const backgroundType =
settings.background_type ||
"color";


if(
backgroundType==="image" &&
settings.background_image
){

document.body.style.backgroundImage =
`url("${settings.background_image}")`;

const bgScale =
numberSetting(
"background_scale",
100
);

const bgX =
numberSetting(
"background_x",
0
);

const bgY =
numberSetting(
"background_y",
0
);


document.body.style.backgroundSize =
`${bgScale}%`;

document.body.style.backgroundPosition =
`calc(50% + ${bgX}px) calc(50% + ${bgY}px)`;

document.body.style.backgroundRepeat =
"no-repeat";

document.body.style.backgroundAttachment =
"fixed";

}else{

document.body.style.backgroundImage =
"none";

document.body.style.backgroundColor =
settings.background_color ||
"#f4f4f4";

}

}


/* =========================
   PRODUCTOS
========================= */

async function loadProducts(){

const result =
await db
.from("products")
.select("*")
.order("sort_order",{ascending:true})
.order("created_at",{ascending:true});

if(result.error){

console.error(result.error);

return;

}

products =
result.data || [];

}


function getCategories(){

if(settings.categories){

try{

const saved =
JSON.parse(settings.categories);

if(
Array.isArray(saved) &&
saved.length
){

return saved;

}

}catch(e){}

}

return [
"Pastes salados",
"Pastes dulces",
"Pastes de temporada",
"Bebidas",
"Promociones"
];

}


function renderCategories(){

const box =
document.getElementById(
"categories"
);

const cats =
getCategories();

if(
!activeCategory ||
!cats.includes(activeCategory)
){

activeCategory =
cats[0];

}

box.innerHTML="";


cats.forEach(category=>{

const button =
document.createElement("button");

button.className =
"category " +
(
category===activeCategory
?"active"
:""
);

button.innerText =
category;

button.onclick =
function(){

activeCategory =
category;

renderCategories();

renderProducts();

};

box.appendChild(button);

});

}


function renderProducts(){

const box =
document.getElementById(
"products"
);

const list =
products.filter(
p =>
p.category ===
activeCategory
);

box.innerHTML="";


if(!list.length){

box.innerHTML =
"<p>No hay productos en esta categoría.</p>";

return;

}


list.forEach(product=>{

const card =
document.createElement(
"article"
);

card.className =
"product " +
(
product.available === true
?""
:"soldout"
);


const image =
document.createElement(
"img"
);

image.className =
"product-image";

if(product.image_url){

image.src =
product.image_url;

}else{

image.src =
"https://via.placeholder.com/600x400";

}

image.onerror =
function(){

this.src =
"https://via.placeholder.com/600x400";

};


const body =
document.createElement(
"div"
);

body.className =
"product-body";


const title =
document.createElement(
"h3"
);

title.className =
"product-name";

title.innerText =
product.name || "";


const description =
document.createElement(
"div"
);

description.className =
"product-description";

description.innerText =
product.description || "";


const bottom =
document.createElement(
"div"
);

bottom.className =
"product-bottom";


const price =
document.createElement(
"div"
);

price.className =
"price";

price.innerText =
"$"+
Number(product.price || 0)
.toFixed(2);


const button =
document.createElement(
"button"
);

button.className =
"add";


if(product.available === true){

button.innerText =
"AGREGAR";

button.onclick =
function(){

addToCart(product.id);

};

}else{

button.innerText =
"AGOTADO";

button.disabled=true;

}


bottom.appendChild(price);

bottom.appendChild(button);

body.appendChild(title);

body.appendChild(description);

body.appendChild(bottom);


card.appendChild(image);


if(product.available !== true){

const sold =
document.createElement(
"div"
);

sold.className =
"soldout-label";

sold.innerText =
"AGOTADO";

card.appendChild(sold);

}


card.appendChild(body);

box.appendChild(card);

});

}


/* =========================
   CARRITO
========================= */

function addToCart(id){

const product =
products.find(
p =>
String(p.id) ===
String(id)
);

if(
!product ||
product.available !== true
){

return;

}

const existing =
cart.find(
item =>
String(item.product.id) ===
String(id)
);

if(existing){

existing.quantity++;

}else{

cart.push({
product:product,
quantity:1
});

}

renderCart();

}


function removeFromCart(id){

const item =
cart.find(
x =>
String(x.product.id) ===
String(id)
);

if(!item)return;

item.quantity--;

if(item.quantity<=0){

cart =
cart.filter(
x =>
String(x.product.id)!==
String(id)
);

}

renderCart();

}


function renderCart(){

const box =
document.getElementById(
"cartItems"
);

let subtotal=0;

let count=0;


if(!cart.length){

box.innerHTML =
"<p>Tu carrito está vacío.</p>";

}else{

box.innerHTML="";


cart.forEach(item=>{

const amount =
Number(item.product.price) *
item.quantity;

subtotal += amount;

count += item.quantity;


const row =
document.createElement(
"div"
);

row.className =
"cart-item";


row.innerHTML =
`
<div>
<strong>
${escapeHtml(item.product.name)}
</strong>
<br>
$${Number(item.product.price).toFixed(2)}
× ${item.quantity}
</div>

<div>

<button
onclick="removeFromCart('${String(item.product.id)}')"
>
−
</button>

<button
onclick="addToCart('${String(item.product.id)}')"
>
+
</button>

</div>
`;

box.appendChild(row);

});

}


const delivery =
document.getElementById(
"deliveryType"
).value;


const deliveryCost =
delivery==="delivery"
?
Number(settings.delivery_cost || 0)
:
0;


const total =
subtotal +
deliveryCost;


document.getElementById(
"cartCount"
).innerText =
count;


document.getElementById(
"cartTotal"
).innerText =
"Total: $"+
total.toFixed(2);

}


function toggleCart(){

document
.getElementById("cartPanel")
.classList.toggle("open");

}


function deliveryChanged(){

const type =
document.getElementById(
"deliveryType"
).value;


document.getElementById(
"addressBox"
).style.display =
type==="delivery"
?"block"
:"none";


document.getElementById(
"pickupMapBox"
).style.display =
type==="pickup"
?"block"
:"none";


if(type==="pickup"){

document.getElementById(
"pickupMapButton"
).href =
settings.pickup_maps_url ||
"#";

}

renderCart();

}


function paymentChanged(){

const method =
document.getElementById(
"paymentMethod"
).value;

const box =
document.getElementById(
"transferBox"
);

if(method==="transfer"){

box.style.display =
"block";

box.innerText =
settings.bank_details ||
"Los datos de transferencia aparecerán aquí.";

}else{

box.style.display =
"none";

}

}


function sendOrder(){

if(!cart.length){

alert(
"Agrega al menos un producto."
);

return;

}

const name =
document.getElementById(
"customerName"
).value.trim();

const phone =
document.getElementById(
"customerPhone"
).value.trim();

const delivery =
document.getElementById(
"deliveryType"
).value;

const address =
document.getElementById(
"address"
).value.trim();

const payment =
document.getElementById(
"paymentMethod"
).value;

const notes =
document.getElementById(
"notes"
).value.trim();


if(!name || !phone){

alert(
"Escribe tu nombre y teléfono."
);

return;

}


if(
delivery==="delivery" &&
!address
){

alert(
"Escribe tu dirección."
);

return;

}


let subtotal=0;

let items="";


cart.forEach(item=>{

const amount =
Number(item.product.price) *
item.quantity;

subtotal += amount;

items +=
item.quantity+
" x "+
item.product.name+
" - $"+
amount.toFixed(2)+
"\n";

});


const deliveryCost =
delivery==="delivery"
?
Number(settings.delivery_cost || 0)
:
0;


const total =
subtotal +
deliveryCost;


const message =
`Hola, quiero hacer un pedido.

${items}

Subtotal: $${subtotal.toFixed(2)}
Entrega: $${deliveryCost.toFixed(2)}
Total: $${total.toFixed(2)}

Nombre: ${name}
Teléfono: ${phone}

Tipo:
${
delivery==="pickup"
?
"Recoger pedido"
:
"Entrega a domicilio"
}

${
delivery==="delivery"
?
"Dirección: "+address
:
"Recoger en PasteHot"
}

Forma de pago:
${
payment==="transfer"
?
"Transferencia"
:
"Efectivo"
}

Notas:
${notes}`;


const whatsapp =
settings.whatsapp ||
"529902317606";


window.open(
"https://wa.me/"+
whatsapp+
"?text="+
encodeURIComponent(message),
"_blank"
);

}


function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


init();

</script>

</body>
</html>

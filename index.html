<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Menú</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
:root{
  --accent:#d71920;
  --ink:#171717;
  --muted:#6b6f76;
  --surface:rgba(255,255,255,.92);
  --surface-solid:#fff;
  --border:rgba(20,20,20,.09);
  --shadow:0 12px 35px rgba(0,0,0,.10);
  --category-color:#171717;
  --category-size:28px;
  --category-font:Arial,Helvetica,sans-serif;
  --category-weight:800;
}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:transparent}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
.hidden{display:none!important}

/* Fondo independiente de la portada */
#pageBackground{position:fixed;inset:0;z-index:0;background:#f4f4f4 center/cover no-repeat}
#backgroundOverlay{position:fixed;inset:0;z-index:1;background:rgba(0,0,0,0);pointer-events:none}
.hero,.page{position:relative;z-index:2}

.hero{width:100%;aspect-ratio:32/9;max-height:520px;overflow:hidden;background:#151515;position:relative}
.hero-cover{position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:cover;transform:translate(-50%,-50%);transform-origin:center;display:none;user-select:none;pointer-events:none}
.hero-profile{position:absolute;left:50%;top:50%;width:150px;height:150px;border-radius:50%;object-fit:cover;transform:translate(-50%,-50%);display:none;user-select:none;pointer-events:none}

.page{width:min(1180px,94%);margin:0 auto;padding:26px 0 100px}
.brand-card{max-width:760px;margin:0 auto 24px;padding:18px 22px;text-align:center;border:1px solid var(--border);background:var(--surface);backdrop-filter:blur(8px);border-radius:20px;box-shadow:0 8px 26px rgba(0,0,0,.06)}
.brand-card h1{margin:0;font-size:clamp(25px,4vw,34px);font-weight:900;letter-spacing:-.02em}
.brand-card p{margin:7px 0 0;color:var(--muted);line-height:1.45}
.business-meta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;font-size:13px;color:#555}
.business-meta span{background:rgba(255,255,255,.7);padding:6px 10px;border-radius:999px;border:1px solid var(--border)}
.brand-head{display:grid;grid-template-columns:minmax(180px,1fr) auto minmax(180px,1fr);align-items:center;gap:16px}
.brand-title-wrap{text-align:center}
.batch-public{justify-self:start;display:none;align-items:center;gap:10px;min-width:178px;padding:10px 13px;border-radius:16px;background:linear-gradient(135deg,#b80e16,#e32931);color:#fff;box-shadow:0 8px 22px rgba(183,14,22,.24);text-align:left}
.batch-public.show{display:flex}
.batch-public.fresh{background:linear-gradient(135deg,#0f7f43,#18a85a);box-shadow:0 8px 22px rgba(15,127,67,.22)}
.batch-fire{width:35px;height:35px;flex:0 0 auto;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:20px}
.batch-copy{min-width:0}
.batch-copy small{display:block;font-size:10px;line-height:1.15;font-weight:900;text-transform:uppercase;letter-spacing:.055em;color:rgba(255,255,255,.83)}
.batch-countdown{display:block;margin-top:2px;font-size:24px;line-height:1;font-weight:900;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.brand-balance{min-width:178px}
@media(max-width:760px){.brand-head{grid-template-columns:1fr}.batch-public{justify-self:center;order:2;min-width:min(100%,270px);margin-top:10px}.brand-title-wrap{order:1}.brand-balance{display:none}}

.categories-shell{position:sticky;top:0;z-index:30;margin:0 -1px 10px;padding:8px 0;background:linear-gradient(to bottom,rgba(255,255,255,.94),rgba(255,255,255,.76),transparent);backdrop-filter:blur(6px)}
.categories{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.category-btn{flex:0 0 auto;border:1px solid var(--border);border-radius:999px;padding:11px 18px;background:rgba(255,255,255,.94);color:#333;font-weight:800;box-shadow:0 3px 12px rgba(0,0,0,.07);transition:.18s}
.category-btn:hover{transform:translateY(-1px)}
.category-btn.active{background:#111;color:#fff;border-color:#111}

.category-section{margin-top:32px;scroll-margin-top:82px}
.category-title{font-family:var(--category-font);font-size:var(--category-size);font-weight:var(--category-weight);color:var(--category-color);margin:0 0 16px;line-height:1.1;text-shadow:0 1px 2px rgba(255,255,255,.18)}
.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.product{position:relative;overflow:hidden;border-radius:20px;background:var(--surface);backdrop-filter:blur(8px);border:1px solid var(--border);box-shadow:var(--shadow);transition:.2s}
.product:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(0,0,0,.14)}
.product-image-wrap{position:relative;width:100%;aspect-ratio:1/1;background:#eee;overflow:hidden}
.product-image{width:100%;height:100%;object-fit:cover;display:block;transition:.2s}
.product.soldout .product-image{opacity:.42;filter:grayscale(.55)}
.soldout-label{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:10;background:#d40000;color:#fff;font-size:13px;font-weight:900;letter-spacing:.7px;padding:7px 13px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.25);white-space:nowrap}
.product-body{padding:16px}
.product.soldout .product-body{opacity:.5}
.product-name{font-size:18px;font-weight:900;margin:0 0 7px;line-height:1.2}
.product-description{font-size:14px;color:#666;line-height:1.4;min-height:40px}
.product-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:15px}
.product-price{font-size:20px;font-weight:900}
.add-controls{display:flex;align-items:center;justify-content:flex-end;gap:7px;min-width:42px}
.add-controls button{border:none;width:38px;height:38px;border-radius:50%;background:#111;color:#fff;font-size:23px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.add-controls button:active{transform:scale(.94)}
.add-controls button:disabled{opacity:.35}
.add-controls .quantity{min-width:22px;text-align:center;font-size:17px;font-weight:900}

.cart-button{position:fixed;right:22px;bottom:22px;z-index:100;width:64px;height:64px;border:0;border-radius:50%;background:#111;color:#fff;box-shadow:0 10px 34px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.cart-button svg{width:29px;height:29px}.cart-count{position:absolute;right:-2px;top:-3px;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
.cart-panel{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:200;display:none;align-items:flex-end;justify-content:center;padding-top:25px}
.cart-panel.open{display:flex}.cart-box{width:min(600px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:24px;box-shadow:0 -20px 60px rgba(0,0,0,.18)}
.cart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.cart-header h2{margin:0}.close-cart{border:0;background:#eee;width:38px;height:38px;border-radius:50%;font-size:20px}
.cart-empty{padding:25px 4px;color:#777;text-align:center}
.cart-item{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:13px 0;border-bottom:1px solid #eee}.cart-item-info{flex:1;min-width:0}.cart-item-name{font-weight:900}.cart-item-price{color:#666;margin-top:4px;font-size:14px}.qty-controls{display:flex;align-items:center;gap:8px;flex-shrink:0}.qty-controls button{width:30px;height:30px;border:0;border-radius:50%;background:#eee;font-weight:bold;font-size:18px;display:flex;align-items:center;justify-content:center}.qty-controls strong{min-width:20px;text-align:center}
.cart-summary{padding:15px 0 5px;border-top:1px solid #eee}.cart-summary-line{display:flex;justify-content:space-between;gap:15px;padding:5px 0;font-size:15px;color:#555}.cart-total{display:flex;justify-content:space-between;font-size:22px;font-weight:900;padding:14px 0 18px}
.order-form{display:grid;gap:12px}.order-form input,.order-form textarea,.order-form select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;outline:none;background:#fff}.order-form input:focus,.order-form textarea:focus,.order-form select:focus{border-color:#111;box-shadow:0 0 0 3px rgba(0,0,0,.06)}.order-form textarea{min-height:80px;resize:vertical}
.delivery-option{display:grid;gap:9px}.delivery-row{position:relative;display:grid;grid-template-columns:42px 1fr 24px;align-items:center;gap:12px;padding:14px 15px;border:1.5px solid #ddd;border-radius:15px;background:#fff;cursor:pointer}.delivery-row:has(input:checked){border-color:#111;background:#f7f7f7}.delivery-row input{position:absolute;opacity:0;pointer-events:none}.delivery-icon{width:42px;height:42px;border-radius:12px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:23px}.delivery-text{display:flex;flex-direction:column;gap:3px}.delivery-text strong{font-size:15px}.delivery-text small{color:#777;font-size:12px}.delivery-check{width:20px;height:20px;border:2px solid #bbb;border-radius:50%;position:relative}.delivery-row:has(input:checked) .delivery-check{border-color:#111;background:#111}.delivery-row:has(input:checked) .delivery-check::after{content:"";position:absolute;width:6px;height:6px;background:#fff;border-radius:50%;left:5px;top:5px}
.maps-button{display:none;text-decoration:none;background:#eee;color:#111;padding:11px 13px;border-radius:11px;font-weight:800;text-align:center}
.transfer-panel{display:none;background:#f7f7f7;border:1px solid #e5e5e5;border-radius:16px;padding:16px;font-size:14px;line-height:1.5}
.transfer-panel.show{display:block}
.transfer-title{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:900;margin-bottom:5px}
.transfer-intro{color:#666;margin:0 0 13px}
.bank-data{display:grid;gap:8px}
.bank-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid #e7e7e7;border-radius:12px;padding:10px 11px}
.bank-label{display:block;color:#777;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.bank-value{display:block;margin-top:2px;font-weight:900;word-break:break-all}
.copy-bank{border:0;background:#111;color:#fff;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:900}
.transfer-steps{margin-top:14px;background:#fff;border-radius:12px;padding:12px 13px;border:1px solid #e7e7e7}
.transfer-steps ol{margin:7px 0 0;padding-left:20px;color:#555}
.transfer-steps li{margin:5px 0}
.transfer-safety{margin-top:12px;padding:10px 11px;border-radius:10px;background:#eef8f1;color:#225c34;font-size:12px;font-weight:700}
.transfer-proof{margin-top:13px}
.transfer-whatsapp{display:flex;align-items:center;justify-content:center;width:100%;padding:12px 14px;border-radius:11px;background:#20b957;color:#fff;text-decoration:none;font-weight:900;border:0}
.transfer-whatsapp.secondary{background:#eef0f2;color:#1d1d1d}
.payment-label{font-size:13px;font-weight:900;margin-bottom:-4px}

.whatsapp-button{width:100%;border:0;border-radius:14px;padding:15px;background:#20b957;color:#fff;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:9px}.whatsapp-button:disabled{opacity:.6}.order-status-message{display:none;padding:11px 12px;border-radius:10px;font-size:13px}.order-status-message.show{display:block}.order-status-message.ok{background:#e8f8ee;color:#0c6f34}.order-status-message.warn{background:#fff5dd;color:#805d00}

@media(max-width:900px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){.hero-profile{width:110px;height:110px}.page{width:94%;padding-top:18px}.brand-card{padding:15px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{border-radius:16px}.product-body{padding:12px}.product-name{font-size:16px}.product-description{font-size:13px;min-height:36px}.product-price{font-size:17px}.add-controls button{width:36px;height:36px;font-size:21px}.cart-button{width:58px;height:58px;right:16px;bottom:16px}.cart-box{padding:19px}.category-section{scroll-margin-top:75px}}
@media(max-width:390px){.products{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="pageBackground"></div>
<div id="backgroundOverlay"></div>
<header class="hero" id="hero">
  <img id="heroCover" class="hero-cover" alt="">
  <img id="heroProfile" class="hero-profile" alt="">
</header>
<main class="page">
  <section class="brand-card">
    <div class="brand-head">
      <div id="batchPublic" class="batch-public" aria-live="polite">
        <div class="batch-fire">🔥</div>
        <div class="batch-copy">
          <small id="batchPublicLabel">Próxima hornada estimada</small>
          <strong id="batchPublicTime" class="batch-countdown">30:00</strong>
        </div>
      </div>
      <div class="brand-title-wrap">
        <h1 id="menuTitle"></h1>
        <p id="menuSlogan"></p>
      </div>
      <div class="brand-balance" aria-hidden="true"></div>
    </div>
    <div class="business-meta" id="businessMeta"></div>
  </section>
  <div class="categories-shell"><div class="categories" id="categories"></div></div>
  <div id="menu"></div>
</main>
<button class="cart-button" id="cartButton" type="button" aria-label="Abrir carrito">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle><path d="M3 4h2l2.4 11.3a2 2 0 0 0 2 1.7h7.9a2 2 0 0 0 1.9-1.4L21 8H6"></path></svg>
  <span class="cart-count" id="cartCount">0</span>
</button>
<div class="cart-panel" id="cartPanel">
  <div class="cart-box">
    <div class="cart-header"><h2>Tu pedido</h2><button class="close-cart" id="closeCartButton" type="button">×</button></div>
    <div id="cartItems"></div>
    <div class="cart-summary">
      <div class="cart-summary-line"><span>Productos</span><span id="cartProductsTotal">$0.00</span></div>
      <div class="cart-summary-line" id="cartDeliveryLine"><span>Envío</span><span id="cartDeliveryFee">$0.00</span></div>
    </div>
    <div class="cart-total"><span>Total</span><span id="cartTotal">$0.00</span></div>
    <div class="order-form">
      <input id="customerName" type="text" autocomplete="name" placeholder="Nombre">
      <input id="customerPhone" type="tel" autocomplete="tel" placeholder="Teléfono">
      <div class="delivery-option">
        <label class="delivery-row"><input type="radio" name="deliveryType" value="delivery" checked><span class="delivery-icon">🛵</span><span class="delivery-text"><strong>Envío a domicilio</strong><small id="deliverySubtitle"></small></span><span class="delivery-check"></span></label>
        <label class="delivery-row"><input type="radio" name="deliveryType" value="pickup"><span class="delivery-icon">🛍️</span><span class="delivery-text"><strong>Pasar a recoger</strong><small>Recoge tu pedido en nuestro punto de venta</small></span><span class="delivery-check"></span></label>
      </div>
      <input id="address" type="text" autocomplete="street-address" placeholder="Dirección de entrega">
      <a id="mapsButton" class="maps-button" href="#" target="_blank" rel="noopener">📍 Ver ubicación para recoger</a>
      <div class="payment-label">Forma de pago</div><select id="paymentMethod"><option value="cash">Efectivo al recibir/recoger</option><option value="transfer">Transferencia bancaria</option></select>
      <div id="transferPanel" class="transfer-panel"></div>
      <textarea id="orderNotes" placeholder="Notas del pedido (opcional)"></textarea>
      <div id="orderStatusMessage" class="order-status-message"></div>
      <button class="whatsapp-button" id="whatsappButton" type="button">📲 Enviar pedido por WhatsApp</button>
    </div>
  </div>
</div>
<script>
const SUPABASE_URL="https://cqlywpemisknrxswlmea.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_wDu6p-CtnQtYu7KWH1YS1A_h7LeL0SX";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let products=[];
let settings={};
let cart={};
const DEFAULT_DELIVERY_FEE=30;
const FALLBACK_CATEGORIES=["Pastes salados","Pastes dulces","Pastes de temporada","Bebidas","Promociones"];
let batchPublicInterval=null;
const FONT_MAP={
  "Arial":"Arial,Helvetica,sans-serif",
  "Georgia":"Georgia,'Times New Roman',serif",
  "Trebuchet":"'Trebuchet MS',Arial,sans-serif",
  "Verdana":"Verdana,Geneva,sans-serif",
  "Times":"'Times New Roman',Times,serif",
  "Courier":"'Courier New',Courier,monospace"
};
function normalizeId(id){return String(id??"")}
function normalizePhone(v){return String(v??"").replace(/\D/g,"")}
function findProductById(id){const k=normalizeId(id);return products.find(p=>normalizeId(p.id)===k)}
function isAvailable(p){if(!p)return false;return [true,1,"1","true","TRUE"].includes(p.available)}
function formatMoney(n){return "$"+Number(n||0).toFixed(2)}
function getDeliveryFee(){const n=Number(settings.delivery_cost);return Number.isFinite(n)&&n>=0?n:DEFAULT_DELIVERY_FEE}
function getDeliveryType(){return document.querySelector('input[name="deliveryType"]:checked')?.value||"delivery"}
function getAppliedDeliveryFee(){return getDeliveryType()==="delivery"?getDeliveryFee():0}
function safeJson(value,fallback){try{return typeof value==="string"?JSON.parse(value):value??fallback}catch{return fallback}}

const SESSION_KEY="pastehot_checkout_v2";
function saveCheckoutState(){
  try{
    const quantities={};
    Object.entries(cart).forEach(([id,item])=>quantities[id]=Number(item.quantity)||0);
    const state={
      quantities,
      name:document.getElementById("customerName")?.value||"",
      phone:document.getElementById("customerPhone")?.value||"",
      address:document.getElementById("address")?.value||"",
      notes:document.getElementById("orderNotes")?.value||"",
      payment:document.getElementById("paymentMethod")?.value||"cash",
      delivery:getDeliveryType()
    };
    localStorage.setItem(SESSION_KEY,JSON.stringify(state));
  }catch(e){console.warn("No se pudo guardar temporalmente el carrito.",e)}
}
function restoreCheckoutState(){
  try{
    const state=safeJson(localStorage.getItem(SESSION_KEY),{});
    if(state?.quantities){
      Object.entries(state.quantities).forEach(([id,q])=>{
        const product=findProductById(id);
        const quantity=Math.max(0,Number(q)||0);
        if(product&&quantity>0&&isAvailable(product))cart[normalizeId(id)]={product,quantity};
      });
    }
    if(state?.name)customerName.value=state.name;
    if(state?.phone)customerPhone.value=state.phone;
    if(state?.address)address.value=state.address;
    if(state?.notes)orderNotes.value=state.notes;
    if(["cash","transfer"].includes(state?.payment))paymentMethod.value=state.payment;
    if(["delivery","pickup"].includes(state?.delivery)){
      const radio=document.querySelector(`input[name="deliveryType"][value="${state.delivery}"]`);
      if(radio)radio.checked=true;
    }
  }catch(e){console.warn("No se pudo restaurar el carrito.",e)}
}
function clearCheckoutState(){try{localStorage.removeItem(SESSION_KEY)}catch{}}

async function init(){
  const [pr,sr]=await Promise.all([
    db.from("products").select("*").order("sort_order",{ascending:true}).order("created_at",{ascending:true}),
    db.from("settings").select("key,value")
  ]);
  if(pr.error){console.error(pr.error);document.getElementById("menu").textContent="No se pudo cargar el menú.";return}
  if(sr.error){console.error(sr.error);return}
  products=pr.data||[]; settings={}; (sr.data||[]).forEach(r=>settings[r.key]=r.value);
  applyDesign(); renderMenu(); restoreCheckoutState(); updateDeliverySubtitle(); updateDeliveryUI(); updatePaymentUI(); updateCart(); startPublicBatchClock();
}
function applyDesign(){
  const cover=document.getElementById("heroCover"),profile=document.getElementById("heroProfile"),bg=document.getElementById("pageBackground"),overlay=document.getElementById("backgroundOverlay");
  if(settings.cover_image){cover.src=settings.cover_image;cover.style.display="block";cover.style.left=`calc(50% + ${Number(settings.cover_x)||0}%)`;cover.style.top=`calc(50% + ${Number(settings.cover_y)||0}%)`;cover.style.transform=`translate(-50%,-50%) scale(${Number(settings.cover_scale)||1})`}else cover.style.display="none";
  if(settings.profile_image){profile.src=settings.profile_image;profile.style.display="block";profile.style.left=`calc(50% + ${Number(settings.profile_x)||0}%)`;profile.style.top=`calc(50% + ${Number(settings.profile_y)||0}%)`;profile.style.transform=`translate(-50%,-50%) scale(${Number(settings.profile_scale)||1})`}else profile.style.display="none";
  if(settings.background_type==="image"&&settings.background_image)bg.style.backgroundImage=`url(${JSON.stringify(settings.background_image)})`;else bg.style.backgroundImage="none";
  bg.style.backgroundColor=settings.background_color||"#f4f4f4";
  const opacity=Math.max(0,Math.min(.75,Number(settings.background_overlay)||0)); overlay.style.background=`rgba(0,0,0,${opacity})`;
  const fontKey=settings.category_title_font||"Arial";
  document.documentElement.style.setProperty("--category-font",FONT_MAP[fontKey]||FONT_MAP.Arial);
  document.documentElement.style.setProperty("--category-size",`${Math.max(18,Math.min(52,Number(settings.category_title_size)||28))}px`);
  document.documentElement.style.setProperty("--category-color",settings.category_title_color||"#171717");
  document.getElementById("menuTitle").textContent=settings.business_name||settings.menu_title||"Menú";
  document.getElementById("menuSlogan").textContent=settings.slogan||"";
  const meta=document.getElementById("businessMeta"); meta.innerHTML="";
  if(settings.opening_time&&settings.closing_time){const s=document.createElement("span");s.textContent=`Horario ${settings.opening_time}–${settings.closing_time}`;meta.appendChild(s)}
  if(settings.business_address){const s=document.createElement("span");s.textContent=settings.business_address;meta.appendChild(s)}
}

function publicBatchState(){
  const enabled=String(settings.batch_timer_enabled||"false")==="true";
  if(!enabled||!settings.batch_end_time)return{visible:false};

  const endMs=new Date(settings.batch_end_time).getTime();
  if(!Number.isFinite(endMs))return{visible:false};

  const now=Date.now();
  const remaining=endMs-now;
  const label=settings.batch_label||"Próxima hornada estimada";
  const finished=settings.batch_finished_message||"¡Recién horneados!";
  const freshMinutes=Math.max(1,Math.min(60,Number(settings.batch_fresh_minutes)||5));

  if(remaining>0){
    const totalSeconds=Math.ceil(remaining/1000);
    const min=Math.floor(totalSeconds/60);
    const sec=totalSeconds%60;
    return{
      visible:true,
      fresh:false,
      label,
      time:`${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`
    };
  }

  if(now<endMs+freshMinutes*60000){
    return{
      visible:true,
      fresh:true,
      label:finished,
      time:"LISTOS"
    };
  }

  return{visible:false};
}

function renderPublicBatchClock(){
  const box=document.getElementById("batchPublic");
  if(!box)return;
  const state=publicBatchState();

  if(!state.visible){
    box.classList.remove("show","fresh");
    return;
  }

  box.classList.add("show");
  box.classList.toggle("fresh",Boolean(state.fresh));
  document.getElementById("batchPublicLabel").textContent=state.label;
  document.getElementById("batchPublicTime").textContent=state.time;
}

function startPublicBatchClock(){
  if(batchPublicInterval)clearInterval(batchPublicInterval);
  renderPublicBatchClock();
  batchPublicInterval=setInterval(renderPublicBatchClock,1000);
}


function configuredCategories(){const parsed=safeJson(settings.categories,[]);return Array.isArray(parsed)&&parsed.length?parsed:FALLBACK_CATEGORIES}
function getCategories(){const found=new Set(products.map(p=>p.category).filter(Boolean));const result=[];configuredCategories().forEach(c=>{if(found.has(c))result.push(c)});found.forEach(c=>{if(!result.includes(c))result.push(c)});return result}
function slug(text){return String(text).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function renderCategories(){const c=document.getElementById("categories");c.innerHTML="";getCategories().forEach((cat,i)=>{const b=document.createElement("button");b.type="button";b.className="category-btn"+(i===0?" active":"");b.textContent=cat;b.onclick=()=>{document.querySelectorAll(".category-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById("category-"+slug(cat))?.scrollIntoView({behavior:"smooth",block:"start"})};c.appendChild(b)})}
function renderMenu(){renderCategories();const menu=document.getElementById("menu");menu.innerHTML="";getCategories().forEach(cat=>{const sec=document.createElement("section");sec.className="category-section";sec.id="category-"+slug(cat);const h=document.createElement("h2");h.className="category-title";h.textContent=cat;const grid=document.createElement("div");grid.className="products";products.filter(p=>p.category===cat).forEach(p=>grid.appendChild(createProduct(p)));sec.append(h,grid);menu.appendChild(sec)})}
function createProduct(product){const card=document.createElement("article");card.className="product"+(isAvailable(product)?"":" soldout");card.dataset.productId=normalizeId(product.id);const wrap=document.createElement("div");wrap.className="product-image-wrap";const img=document.createElement("img");img.className="product-image";img.src=product.image_url||"";img.alt=product.name||"Producto";img.loading="lazy";img.onerror=()=>{img.style.display="none"};wrap.appendChild(img);if(!isAvailable(product)){const s=document.createElement("div");s.className="soldout-label";s.textContent="AGOTADO";wrap.appendChild(s)}const body=document.createElement("div");body.className="product-body";const n=document.createElement("h3");n.className="product-name";n.textContent=product.name||"";const d=document.createElement("div");d.className="product-description";d.textContent=product.description||"";const bottom=document.createElement("div");bottom.className="product-bottom";const price=document.createElement("div");price.className="product-price";price.textContent=formatMoney(product.price);const controls=document.createElement("div");controls.className="add-controls";controls.dataset.productId=normalizeId(product.id);renderProductControls(controls,product);bottom.append(price,controls);body.append(n,d,bottom);card.append(wrap,body);return card}
function renderProductControls(controls,product){controls.innerHTML="";const key=normalizeId(product.id),q=cart[key]?.quantity||0;const make=(txt,action,disabled=false)=>{const b=document.createElement("button");b.type="button";b.textContent=txt;b.disabled=disabled;if(action){b.dataset.cartAction=action;b.dataset.productId=key}return b};if(!isAvailable(product)){controls.appendChild(make("+",null,true));return}if(q<=0){controls.appendChild(make("+","add"));return}const qty=document.createElement("span");qty.className="quantity";qty.textContent=q;controls.append(make("−","minus"),qty,make("+","add"))}
function addToCart(id){const k=normalizeId(id),p=findProductById(k);if(!p||!isAvailable(p))return;if(!cart[k])cart[k]={product:p,quantity:1};else cart[k].quantity++;updateCart();saveCheckoutState()}
function changeQuantity(id,amount){const k=normalizeId(id),p=findProductById(k);if(!p)return;const next=(cart[k]?.quantity||0)+Number(amount);if(next<=0)delete cart[k];else cart[k]={product:p,quantity:next};updateCart();saveCheckoutState()}
document.getElementById("menu").addEventListener("click",e=>{const b=e.target.closest("[data-cart-action]");if(!b)return;b.dataset.cartAction==="add"?addToCart(b.dataset.productId):changeQuantity(b.dataset.productId,-1)});
document.getElementById("cartItems").addEventListener("click",e=>{const b=e.target.closest("[data-cart-action]");if(!b)return;b.dataset.cartAction==="add"?addToCart(b.dataset.productId):changeQuantity(b.dataset.productId,-1)});
function updateProductCard(id){const card=[...document.querySelectorAll(".product[data-product-id]")].find(x=>x.dataset.productId===normalizeId(id));if(!card)return;const p=findProductById(id),controls=card.querySelector(".add-controls");if(p&&controls)renderProductControls(controls,p)}
function updateCart(){const items=Object.values(cart),container=document.getElementById("cartItems");container.innerHTML="";let productsTotal=0,count=0;if(!items.length){const e=document.createElement("div");e.className="cart-empty";e.textContent="Tu carrito está vacío.";container.appendChild(e)}items.forEach(item=>{const price=Number(item.product.price||0),subtotal=price*item.quantity;productsTotal+=subtotal;count+=item.quantity;const row=document.createElement("div");row.className="cart-item";const info=document.createElement("div");info.className="cart-item-info";const n=document.createElement("div");n.className="cart-item-name";n.textContent=item.product.name||"";const p=document.createElement("div");p.className="cart-item-price";p.textContent=`${item.quantity} × ${formatMoney(price)} = ${formatMoney(subtotal)}`;info.append(n,p);const ctr=document.createElement("div");ctr.className="qty-controls";const minus=document.createElement("button"),plus=document.createElement("button"),qty=document.createElement("strong");minus.type=plus.type="button";minus.textContent="−";plus.textContent="+";qty.textContent=item.quantity;minus.dataset.cartAction="minus";plus.dataset.cartAction="add";minus.dataset.productId=plus.dataset.productId=normalizeId(item.product.id);ctr.append(minus,qty,plus);row.append(info,ctr);container.appendChild(row)});const delivery=getAppliedDeliveryFee(),total=productsTotal+delivery;document.getElementById("cartProductsTotal").textContent=formatMoney(productsTotal);document.getElementById("cartDeliveryFee").textContent=formatMoney(delivery);document.getElementById("cartTotal").textContent=formatMoney(total);document.getElementById("cartCount").textContent=count;products.forEach(p=>updateProductCard(p.id))}
function updateDeliverySubtitle(){document.getElementById("deliverySubtitle").textContent=`+${formatMoney(getDeliveryFee())} de envío`}
function updateDeliveryUI(){const pickup=getDeliveryType()==="pickup",address=document.getElementById("address"),maps=document.getElementById("mapsButton");address.style.display=pickup?"none":"block";if(pickup)address.value="";if(pickup&&settings.pickup_maps_url){maps.style.display="block";maps.href=settings.pickup_maps_url}else maps.style.display="none";updateCart();saveCheckoutState()}
document.querySelectorAll('input[name="deliveryType"]').forEach(r=>r.addEventListener("change",updateDeliveryUI));
function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function copyBankValue(value,button){
  if(!value)return;
  navigator.clipboard?.writeText(String(value)).then(()=>{
    const old=button.textContent;button.textContent="Copiado ✓";setTimeout(()=>button.textContent=old,1400);
  }).catch(()=>prompt("Copia este dato:",value));
}
function bankRow(label,value){
  if(!value)return "";
  const safe=escapeHtml(value);
  return `<div class="bank-row"><div><span class="bank-label">${escapeHtml(label)}</span><span class="bank-value">${safe}</span></div><button class="copy-bank" type="button" data-copy-value="${escapeHtml(value)}">Copiar</button></div>`;
}
function openProofWhatsApp(){
  saveCheckoutState();
  const whatsapp=normalizePhone(settings.whatsapp);
  if(!whatsapp){alert("El WhatsApp del negocio todavía no está configurado.");return}
  const name=customerName.value.trim();
  const text=`Hola, soy ${name||"cliente de PasteHot"}. Te envío mi comprobante de transferencia${name?", a nombre de "+name:""}.`;
  window.open(`https://wa.me/${whatsapp}?text=${encodeURIComponent(text)}`,"_blank");
}
function updatePaymentUI(){
  const panel=document.getElementById("transferPanel");
  const transfer=document.getElementById("paymentMethod").value==="transfer";
  if(!transfer){panel.classList.remove("show");panel.innerHTML="";saveCheckoutState();return}
  const bankRows=[
    bankRow("Banco",settings.bank_name||""),
    bankRow("Titular",settings.bank_holder||""),
    bankRow("Número de tarjeta",settings.bank_card||""),
    bankRow("CLABE",settings.bank_clabe||"")
  ].filter(Boolean).join("");
  panel.innerHTML=`
    <div class="transfer-title">🏦 Transferencia bancaria</div>
    <p class="transfer-intro">Copia los datos, realiza la transferencia en tu aplicación bancaria y vuelve a este menú para finalizar el pedido.</p>
    <div class="bank-data">${bankRows||'<div style="color:#777">Los datos bancarios todavía no están configurados.</div>'}</div>
    <div class="transfer-steps"><strong>Orden recomendado</strong><ol><li>Deja tu carrito preparado.</li><li>Copia la CLABE o tarjeta y realiza la transferencia.</li><li>Regresa a esta pestaña: tu carrito y tus datos permanecerán guardados.</li><li>Presiona <strong>Enviar pedido por WhatsApp</strong> para enviar el pedido.</li><li>Después, envía la captura o comprobante por WhatsApp.</li></ol></div>
    <div class="transfer-safety">Tu carrito y los datos escritos se guardan temporalmente en este dispositivo para que no se pierdan al cambiar a tu app bancaria.</div>
    <div class="transfer-proof"><button class="transfer-whatsapp secondary" id="proofWhatsappButton" type="button">📎 Enviar comprobante por WhatsApp</button></div>`;
  panel.classList.add("show");
  panel.querySelectorAll("[data-copy-value]").forEach(btn=>btn.addEventListener("click",()=>copyBankValue(btn.dataset.copyValue,btn)));
  document.getElementById("proofWhatsappButton")?.addEventListener("click",openProofWhatsApp);
  saveCheckoutState();
}
document.getElementById("paymentMethod").addEventListener("change",updatePaymentUI);
document.getElementById("cartButton").onclick=()=>{document.getElementById("cartPanel").classList.add("open");updateCart()};
document.getElementById("closeCartButton").onclick=()=>document.getElementById("cartPanel").classList.remove("open");
document.getElementById("cartPanel").addEventListener("click",e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove("open")});
["customerName","customerPhone","address","orderNotes"].forEach(id=>{
  document.getElementById(id)?.addEventListener("input",saveCheckoutState);
});
window.addEventListener("pagehide",saveCheckoutState);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")saveCheckoutState()});

function showOrderMessage(text,type){const el=document.getElementById("orderStatusMessage");el.className=`order-status-message show ${type}`;el.textContent=text}
function orderItemsPayload(){return Object.values(cart).map(i=>({product_id:i.product.id,name:i.product.name,price:Number(i.product.price||0),quantity:i.quantity,subtotal:Number(i.product.price||0)*i.quantity}))}
function generateOrderCode(){const now=new Date(),stamp=now.toISOString().replace(/\D/g,"").slice(2,12);return `PJ-${stamp}-${Math.random().toString(36).slice(2,6).toUpperCase()}`}
async function sendOrder(){
  const items=Object.values(cart);
  if(!items.length){alert("Agrega al menos un producto.");return}

  const name=document.getElementById("customerName").value.trim();
  const phone=document.getElementById("customerPhone").value.trim();
  const deliveryType=getDeliveryType();
  const address=document.getElementById("address").value.trim();
  const payment=document.getElementById("paymentMethod").value;
  const notes=document.getElementById("orderNotes").value.trim();

  if(!name){alert("Escribe tu nombre.");return}
  if(!phone){alert("Escribe tu teléfono.");return}
  if(deliveryType==="delivery"&&!address){alert("Escribe la dirección de entrega.");return}

  const whatsapp=normalizePhone(settings.whatsapp);
  if(!whatsapp){alert("El número de WhatsApp todavía no está configurado.");return}

  const itemPayload=orderItemsPayload();
  const subtotal=itemPayload.reduce((a,i)=>a+i.subtotal,0);
  const deliveryFee=deliveryType==="delivery"?getDeliveryFee():0;
  const total=subtotal+deliveryFee;
  const orderCode=generateOrderCode();
  const business=settings.business_name||"PasteHot";

  const payload={
    order_code:orderCode,
    customer_name:name,
    customer_phone:normalizePhone(phone),
    delivery_type:deliveryType,
    address:deliveryType==="delivery"?address:"",
    payment_method:payment,
    notes,
    items:itemPayload,
    subtotal,
    delivery_fee:deliveryFee,
    total,
    order_status:"nuevo"
  };

  const button=document.getElementById("whatsappButton");
  button.disabled=true;
  button.textContent="Registrando pedido…";

  try{
    const {error}=await db.from("orders").insert(payload);
    if(error){
      console.error("No se pudo registrar el pedido:",error);
      showOrderMessage("El pedido no pudo guardarse en el historial, pero puedes enviarlo por WhatsApp.","warn");
    }else{
      showOrderMessage(`Pedido ${orderCode} registrado. Abriendo WhatsApp…`,"ok");
      localStorage.setItem("pastehot_last_order",orderCode);
    }
  }catch(error){
    console.error("Error inesperado al registrar pedido:",error);
    showOrderMessage("Hubo un problema registrando el pedido. Se enviará por WhatsApp.","warn");
  }

  let message=`*NUEVO PEDIDO ${business.toUpperCase()}*\n*Pedido:* ${orderCode}\n\n*Cliente:* ${name}\n*Teléfono:* ${phone}\n*Modalidad:* ${deliveryType==="delivery"?"Envío a domicilio":"Pasar a recoger"}\n`;
  if(deliveryType==="delivery")message+=`*Dirección:* ${address}\n`;
  message+="\n*PRODUCTOS*\n";
  itemPayload.forEach(i=>message+=`${i.quantity} x ${i.name} — ${formatMoney(i.subtotal)}\n`);
  message+=`\n*Subtotal:* ${formatMoney(subtotal)}\n*Envío:* ${formatMoney(deliveryFee)}\n*TOTAL:* ${formatMoney(total)}\n*Pago:* ${payment==="transfer"?"Transferencia":"Efectivo"}\n`;
  if(notes)message+=`*Notas:* ${notes}\n`;

  button.disabled=false;
  button.textContent="📲 Enviar pedido por WhatsApp";
  saveCheckoutState();

  const url=`https://wa.me/${whatsapp}?text=${encodeURIComponent(message)}`;
  window.location.href=url;
}

document.getElementById("whatsappButton").addEventListener("click",sendOrder);
init();
</script>

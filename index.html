<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Menú</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f4f4f4;
color:#161616;
}

.hero{
height:300px;
position:relative;
overflow:hidden;
background:#222;
}

.hero-image{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
}

.profile{
position:absolute;
left:50%;
bottom:20px;
transform:translateX(-50%);
width:150px;
height:150px;
border-radius:50%;
overflow:hidden;
background:white;
border:6px solid white;
box-shadow:0 5px 20px rgba(0,0,0,.3);
z-index:3;
}

.profile img{
width:100%;
height:100%;
object-fit:cover;
}

.main{
max-width:1150px;
margin:auto;
padding:35px 18px 120px;
}

.categories{
display:flex;
gap:10px;
overflow-x:auto;
padding-bottom:15px;
margin-bottom:20px;
}

.category{
border:0;
background:white;
padding:12px 18px;
border-radius:30px;
font-weight:bold;
cursor:pointer;
white-space:nowrap;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.category.active{
background:#e51b23;
color:white;
}

.products{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.product{
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,.08);
position:relative;
transition:.2s;
}

.product-image{
width:100%;
height:230px;
object-fit:cover;
display:block;
}

.product-body{
padding:18px;
}

.product-name{
font-size:21px;
font-weight:800;
margin:0 0 7px;
}

.product-description{
color:#666;
line-height:1.4;
min-height:42px;
}

.product-bottom{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-top:15px;
}

.price{
font-size:21px;
font-weight:900;
}

.add{
background:#e51b23;
color:white;
border:0;
border-radius:9px;
padding:11px 14px;
font-weight:bold;
cursor:pointer;
}

.product.soldout{
opacity:.43;
filter:grayscale(.55);
}

.product.soldout .product-image{
filter:grayscale(1);
}

.soldout-label{
background:#d71920;
color:white;
font-weight:900;
text-align:center;
padding:9px;
font-size:14px;
letter-spacing:1px;
}

.product.soldout .add{
background:#777;
cursor:not-allowed;
}

.cart-button{
position:fixed;
right:20px;
bottom:20px;
width:65px;
height:65px;
border:0;
border-radius:50%;
background:#e51b23;
color:white;
font-size:27px;
cursor:pointer;
box-shadow:0 8px 25px rgba(0,0,0,.3);
z-index:100;
}

.cart-count{
position:absolute;
right:-3px;
top:-3px;
width:24px;
height:24px;
border-radius:50%;
background:#111;
color:white;
font-size:12px;
display:flex;
align-items:center;
justify-content:center;
}

.cart-panel{
position:fixed;
right:20px;
bottom:100px;
width:380px;
max-width:calc(100% - 40px);
background:white;
border-radius:18px;
box-shadow:0 10px 40px rgba(0,0,0,.25);
z-index:99;
padding:20px;
display:none;
max-height:75vh;
overflow:auto;
}

.cart-panel.open{
display:block;
}

.cart-item{
display:flex;
justify-content:space-between;
gap:10px;
padding:10px 0;
border-bottom:1px solid #eee;
}

.cart-total{
font-size:22px;
font-weight:900;
margin:15px 0;
}

.whatsapp{
width:100%;
background:#25d366;
border:0;
color:white;
font-size:16px;
font-weight:bold;
padding:14px;
border-radius:9px;
cursor:pointer;
}

.form-section{
margin-top:25px;
border-top:1px solid #ddd;
padding-top:20px;
}

input,
textarea,
select{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
margin:5px 0 12px;
font-size:15px;
}

.transfer-box{
background:#f4f4f4;
padding:15px;
border-radius:10px;
margin-bottom:15px;
white-space:pre-wrap;
display:none;
}

@media(max-width:850px){

.products{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:600px){

.hero{
height:230px;
}

.profile{
width:120px;
height:120px;
}

.products{
grid-template-columns:1fr;
}

.product-image{
height:250px;
}

}

</style>

</head>

<body>


<div class="hero">

<img
id="coverImage"
class="hero-image"
style="display:none"
>

<div class="profile">

<img
id="profileImage"
style="display:none"
>

</div>

</div>


<main class="main">


<div
id="categories"
class="categories">
</div>


<div
id="products"
class="products">
</div>


</main>


<button
class="cart-button"
onclick="toggleCart()">

🛒

<span
id="cartCount"
class="cart-count">
0
</span>

</button>


<div
id="cartPanel"
class="cart-panel">

<h2>Tu pedido</h2>

<div id="cartItems"></div>

<div
id="cartTotal"
class="cart-total">
Total: $0.00
</div>


<div class="form-section">

<label>Nombre</label>

<input
id="customerName"
placeholder="Tu nombre"
>


<label>Teléfono</label>

<input
id="customerPhone"
placeholder="Tu teléfono"
>


<label>Tipo de entrega</label>

<select
id="deliveryType"
onchange="updateDelivery()">

<option value="delivery">
Entrega a domicilio — costo extra
</option>

<option value="pickup">
Recoger
</option>

</select>


<div id="addressBox">

<label>Dirección</label>

<textarea
id="address"
placeholder="Dirección completa"
></textarea>

</div>


<label>Forma de pago</label>

<select
id="paymentMethod"
onchange="paymentChanged()">

<option value="cash">
Efectivo
</option>

<option value="transfer">
Transferencia
</option>

</select>


<div
id="transferBox"
class="transfer-box">
</div>


<label>Notas</label>

<textarea
id="notes"
placeholder="Notas para tu pedido">
</textarea>


<button
class="whatsapp"
onclick="sendOrder()">

<span style="font-size:20px">◉</span>
Pedir por WhatsApp

</button>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://cqlywpemisknrxswlmea.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wDu6p-CtnQtYu7KWH1YS1A_h7LeL0SX";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let allProducts=[];

let cart=[];

let activeCategory="Pastes salados";

let settings={};


async function init(){

await loadSettings();

await loadProducts();

renderCategories();

renderProducts();

}


async function loadSettings(){

const {data,error} =
await supabaseClient
.from("settings")
.select("key,value");

if(error){

console.error(error);

return;

}

(data || []).forEach(row=>{

settings[row.key]=row.value;

});


applyDesign();

}


function applyDesign(){

const cover =
settings.cover_image;

const profile =
settings.profile_image;


if(cover){

const el=
document.getElementById("coverImage");

el.src=cover;

el.style.display="block";

el.style.transform=
`translate(
${Number(settings.cover_x || 0)}px,
${Number(settings.cover_y || 0)}px
)
scale(
${Number(settings.cover_scale || 100)/100}
)`;

}


if(profile){

const el=
document.getElementById("profileImage");

el.src=profile;

el.style.display="block";

el.style.transform=
`scale(
${Number(settings.profile_scale || 200)/100}
)
translate(
${Number(settings.profile_x || 0)}px,
${Number(settings.profile_y || 0)}px
)`;

}


const type =
settings.background_type || "color";


if(type==="image" && settings.background_image){

document.body.style.backgroundImage=
`url("${settings.background_image}")`;

document.body.style.backgroundSize=
`${settings.background_scale || 100}%`;

document.body.style.backgroundPosition=
`${Number(settings.background_x || 0)+50}% ${Number(settings.background_y || 0)+50}%`;

document.body.style.backgroundAttachment="fixed";

}else{

document.body.style.backgroundImage="none";

document.body.style.backgroundColor=
settings.background_color || "#f4f4f4";

}

}


async function loadProducts(){

const {data,error} =
await supabaseClient
.from("products")
.select("*")
.order("sort_order",{ascending:true})
.order("created_at",{ascending:true});


if(error){

console.error(error);

return;

}


allProducts=data || [];

}


function getCategories(){

let result=[
"Pastes salados",
"Pastes dulces",
"Pastes de temporada",
"Bebidas",
"Promociones"
];


if(settings.categories){

try{

const parsed=
JSON.parse(settings.categories);

if(Array.isArray(parsed) && parsed.length){

result=parsed;

}

}catch(e){}

}


return result;

}


function renderCategories(){

const box=
document.getElementById("categories");

const cats=
getCategories();


if(
!cats.includes(activeCategory)
){

activeCategory=cats[0];

}


box.innerHTML=
cats.map(category=>`

<button
class="category ${category===activeCategory?"active":""}"
onclick='selectCategory(${JSON.stringify(category)})'
>

${escapeHtml(category)}

</button>

`).join("");

}


function selectCategory(category){

activeCategory=category;

renderCategories();

renderProducts();

}


function renderProducts(){

const box=
document.getElementById("products");

const list=
allProducts.filter(
product =>
product.category===activeCategory
);


if(!list.length){

box.innerHTML=
"<p>No hay productos en esta categoría.</p>";

return;

}


box.innerHTML=
list.map(product=>{

const available=
product.available===true;

const image=
product.image_url ||
"https://via.placeholder.com/600x400";


return `

<article
class="product ${available?"":"soldout"}"
>

<img
class="product-image"
src="${escapeHtml(image)}"
alt=""
>


${
available
? ""
: `
<div class="soldout-label">
AGOTADO
</div>
`
}


<div class="product-body">

<h3 class="product-name">
${escapeHtml(product.name)}
</h3>

<div class="product-description">
${escapeHtml(product.description || "")}
</div>


<div class="product-bottom">

<div class="price">
$${Number(product.price).toFixed(2)}
</div>


<button
class="add"
${available ? "" : "disabled"}
onclick='addToCart(${JSON.stringify(String(product.id))})'
>

${available ? "AGREGAR" : "AGOTADO"}

</button>

</div>

</div>

</article>

`;

}).join("");

}


function addToCart(id){

id=String(id);

const product=
allProducts.find(
p=>String(p.id)===id
);


if(!product || product.available!==true){

return;

}


const existing=
cart.find(
item=>String(item.product.id)===id
);


if(existing){

existing.quantity++;

}else{

cart.push({
product:product,
quantity:1
});

}


renderCart();

}


function removeFromCart(id){

id=String(id);

const item=
cart.find(
x=>String(x.product.id)===id
);


if(!item) return;


item.quantity--;


if(item.quantity<=0){

cart=
cart.filter(
x=>String(x.product.id)!==id
);

}


renderCart();

}


function renderCart(){

const box=
document.getElementById("cartItems");

let total=0;

let count=0;


if(!cart.length){

box.innerHTML=
"<p>Tu carrito está vacío.</p>";

}else{

box.innerHTML=
cart.map(item=>{

const subtotal=
Number(item.product.price) *
item.quantity;

total+=subtotal;

count+=item.quantity;


return `

<div class="cart-item">

<div>

<strong>
${escapeHtml(item.product.name)}
</strong>

<br>

$${Number(item.product.price).toFixed(2)}
× ${item.quantity}

</div>


<div>

<button
onclick='removeFromCart(${JSON.stringify(String(item.product.id))})'
>
−
</button>

<button
onclick='addToCart(${JSON.stringify(String(item.product.id))})'
>
+
</button>

</div>

</div>

`;

}).join("");

}


const delivery=
document.getElementById("deliveryType").value;

if(delivery==="delivery"){

total+=Number(
settings.delivery_cost || 0
);

}


document.getElementById("cartCount").innerText=
count;


document.getElementById("cartTotal").innerText=
"Total: $" + total.toFixed(2);

}


function toggleCart(){

document
.getElementById("cartPanel")
.classList.toggle("open");

}


function updateDelivery(){

const type=
document.getElementById("deliveryType").value;

document.getElementById("addressBox").style.display=
type==="delivery"
? "block"
: "none";

renderCart();

}


function paymentChanged(){

const method=
document.getElementById("paymentMethod").value;

const box=
document.getElementById("transferBox");


if(method==="transfer"){

box.style.display="block";

box.innerText=
settings.bank_details ||
"Los datos de transferencia aparecerán aquí.";

}else{

box.style.display="none";

}

}


async function sendOrder(){

if(!cart.length){

alert("Agrega al menos un producto.");

return;

}


const name=
document.getElementById("customerName").value.trim();

const phone=
document.getElementById("customerPhone").value.trim();

const deliveryType=
document.getElementById("deliveryType").value;

const address=
document.getElementById("address").value.trim();

const paymentMethod=
document.getElementById("paymentMethod").value;

const notes=
document.getElementById("notes").value.trim();


if(!name || !phone){

alert("Escribe tu nombre y teléfono.");

return;

}


if(
deliveryType==="delivery" &&
!address
){

alert("Escribe tu dirección.");

return;

}


let subtotal=0;


cart.forEach(item=>{

subtotal +=
Number(item.product.price) *
item.quantity;

});


const deliveryCost=
deliveryType==="delivery"
? Number(settings.delivery_cost || 0)
: 0;


const total=
subtotal+deliveryCost;


const lines=
cart.map(item=>
`${item.quantity} x ${item.product.name} - $${(
Number(item.product.price)*item.quantity
).toFixed(2)}`
).join("\n");


const whatsapp=
settings.whatsapp ||
"529902317606";


const message=
`Hola, quiero hacer un pedido en PasteHot.

${lines}

Subtotal: $${subtotal.toFixed(2)}
Entrega: $${deliveryCost.toFixed(2)}
Total: $${total.toFixed(2)}

Nombre: ${name}
Teléfono: ${phone}
Entrega: ${deliveryType==="delivery"?"A domicilio":"Recoger"}
${deliveryType==="delivery"?`Dirección: ${address}`:""}
Pago: ${paymentMethod==="transfer"?"Transferencia":"Efectivo"}
Notas: ${notes}`;


window.open(
"https://wa.me/"+whatsapp+
"?text="+
encodeURIComponent(message),
"_blank"
);


}


function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


init();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Menú</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
  color:#171717;
  background:transparent;
}

body{
  min-height:100vh;
}

#pageBackground{
  position:fixed;
  inset:0;
  z-index:0;
  background:#f4f4f4;
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
}

#backgroundOverlay{
  position:fixed;
  inset:0;
  z-index:1;
  background:rgba(255,255,255,.08);
  pointer-events:none;
}

.hero,
.page{
  position:relative;
  z-index:2;
}

button,
input,
select,
textarea{
  font-family:inherit;
}

/* =========================
   PORTADA
========================= */

.hero{
  position:relative;
  width:100%;
  aspect-ratio:32 / 9;
  min-height:0;
  max-height:500px;
  overflow:hidden;
  background:#111;
}

.hero-cover{
  position:absolute;
  left:50%;
  top:50%;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  transform:translate(-50%,-50%);
  transform-origin:center center;
  display:none;
  user-select:none;
  pointer-events:none;
}

.hero-profile{
  position:absolute;
  left:50%;
  top:50%;
  width:150px;
  height:150px;
  border-radius:50%;
  object-fit:cover;
  object-position:center;
  transform:translate(-50%,-50%);
  border:0;
  box-shadow:none;
  display:none;
  user-select:none;
  pointer-events:none;
}

/* =========================
   CONTENEDOR
========================= */

.page{
  width:min(1180px,94%);
  margin:0 auto;
  padding:25px 0 50px;
  background:transparent;
}

.menu-title{
  text-align:center;
  margin:0 0 24px;
}

.menu-title h1{
  margin:0;
  font-size:30px;
  font-weight:800;
}

.menu-title p{
  margin:8px 0 0;
}

/* =========================
   CATEGORÍAS
========================= */

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:4px 2px 15px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category-btn{
  flex:0 0 auto;
  border:none;
  border-radius:999px;
  padding:12px 20px;
  background:white;
  color:#333;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  transition:.2s;
}

.category-btn:hover{
  transform:translateY(-1px);
}

.category-btn.active{
  background:#111;
  color:white;
}

/* =========================
   PRODUCTOS
========================= */

.category-section{
  margin-top:28px;
}

.category-title{
  margin:0 0 16px;
  font-weight:800;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:20px;
}

.product{
  position:relative;
  overflow:hidden;
  border-radius:20px;
  background:white;
  box-shadow:0 7px 25px rgba(0,0,0,.09);
  transition:.2s;
}

.product:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 30px rgba(0,0,0,.13);
}

.product-image-wrap{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  background:#eee;
  overflow:hidden;
}

.product-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:.2s;
}

.product.soldout .product-image{
  opacity:.40;
  filter:grayscale(.55);
}

.soldout-label{
  position:absolute;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  z-index:10;
  background:#d40000;
  color:white;
  font-size:14px;
  font-weight:900;
  letter-spacing:.8px;
  padding:7px 13px;
  border-radius:999px;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
  opacity:1 !important;
  filter:none !important;
  white-space:nowrap;
}

.product-body{
  padding:17px;
}

.product.soldout .product-body{
  opacity:.45;
}

.product-name{
  font-size:18px;
  font-weight:800;
  margin:0 0 7px;
}

.product-description{
  font-size:14px;
  color:#666;
  line-height:1.4;
  min-height:40px;
}

.product-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:15px;
}

.product-price{
  font-size:20px;
  font-weight:900;
}

/* =========================
   CONTROLES
========================= */

.add-controls{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:7px;
  min-width:42px;
}

.add-controls button{
  border:none;
  width:38px;
  height:38px;
  border-radius:50%;
  background:#111;
  color:white;
  font-size:23px;
  font-weight:700;
  line-height:1;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  flex-shrink:0;
}

.add-controls button:active{
  transform:scale(.94);
}

.add-controls .quantity{
  min-width:22px;
  text-align:center;
  font-size:17px;
  font-weight:900;
}

@media(max-width:650px){

  .add-controls{
    gap:5px;
  }

  .add-controls button{
    width:36px;
    height:36px;
    font-size:21px;
  }

  .add-controls .quantity{
    font-size:16px;
    min-width:20px;
  }
}

/* =========================
   CARRITO
========================= */

.cart-button{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:100;
  width:62px;
  height:62px;
  border:0;
  border-radius:50%;
  background:#111;
  color:white;
  cursor:pointer;
  box-shadow:0 8px 30px rgba(0,0,0,.28);
  display:flex;
  align-items:center;
  justify-content:center;
}

.cart-button svg{
  width:29px;
  height:29px;
}

.cart-count{
  position:absolute;
  right:-2px;
  top:-3px;
  min-width:23px;
  height:23px;
  padding:0 6px;
  border-radius:999px;
  background:#e00000;
  color:white;
  font-size:12px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
}

.cart-panel{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:200;
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.cart-panel.open{
  display:flex;
}

.cart-box{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:25px 25px 0 0;
  padding:25px;
}

.cart-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.cart-header h2{
  margin:0;
}

.close-cart{
  border:0;
  background:#eee;
  width:38px;
  height:38px;
  border-radius:50%;
  cursor:pointer;
  font-size:20px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:13px 0;
  border-bottom:1px solid #eee;
}

.cart-item-info{
  flex:1;
  min-width:0;
}

.cart-item-name{
  font-weight:800;
}

.cart-item-price{
  color:#666;
  margin-top:4px;
  font-size:14px;
}

.qty-controls{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}

.qty-controls button{
  width:30px;
  height:30px;
  border:0;
  border-radius:50%;
  background:#eee;
  cursor:pointer;
  font-weight:bold;
  font-size:18px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.qty-controls button:active{
  transform:scale(.94);
}

.qty-controls strong{
  min-width:20px;
  text-align:center;
}

/* =========================
   RESUMEN
========================= */

.cart-summary{
  padding:15px 0 5px;
  border-top:1px solid #eee;
}

.cart-summary-line{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:5px 0;
  font-size:15px;
  color:#555;
}

.cart-summary-line.delivery-line{
  color:#555;
}

.cart-total{
  display:flex;
  justify-content:space-between;
  font-size:21px;
  font-weight:900;
  padding:15px 0 20px;
}

.order-form{
  display:grid;
  gap:12px;
}

.order-form input,
.order-form textarea,
.order-form select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
}

.order-form textarea{
  min-height:80px;
  resize:vertical;
}

/* =========================
   ENTREGA
========================= */

.delivery-option{
  display:grid;
  gap:10px;
}

.delivery-row{
  position:relative;
  display:grid;
  grid-template-columns:42px 1fr 24px;
  align-items:center;
  gap:12px;
  padding:15px 16px;
  border:1.5px solid #ddd;
  border-radius:16px;
  background:#fff;
  cursor:pointer;
  transition:.18s ease;
  min-height:70px;
}

.delivery-row:hover{
  border-color:#aaa;
  background:#fafafa;
}

.delivery-row:has(input:checked){
  border-color:#111;
  background:#f7f7f7;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.delivery-row input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.delivery-icon{
  width:42px;
  height:42px;
  border-radius:12px;
  background:#f0f0f0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.delivery-row:has(input:checked) .delivery-icon{
  background:#111;
}

.delivery-text{
  display:flex;
  flex-direction:column;
  gap:3px;
  min-width:0;
}

.delivery-text strong{
  font-size:15px;
  line-height:1.2;
}

.delivery-text small{
  color:#777;
  font-size:12px;
  font-weight:400;
  line-height:1.3;
}

.delivery-check{
  width:20px;
  height:20px;
  border:2px solid #bbb;
  border-radius:50%;
  position:relative;
}

.delivery-row:has(input:checked) .delivery-check{
  border-color:#111;
  background:#111;
}

.delivery-row:has(input:checked) .delivery-check::after{
  content:"";
  position:absolute;
  width:6px;
  height:6px;
  background:white;
  border-radius:50%;
  left:5px;
  top:5px;
}

.maps-button{
  display:none;
  text-decoration:none;
  background:#eee;
  color:#111;
  padding:11px 13px;
  border-radius:11px;
  font-weight:700;
  text-align:center;
}

/* =========================
   TRANSFERENCIA
========================= */

.transfer-panel{
  display:none;
  background:#f4f4f4;
  border-radius:14px;
  padding:15px;
  margin-top:3px;
  font-size:14px;
  line-height:1.6;
}

.transfer-panel.show{
  display:block;
}

.transfer-proof{
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid #ddd;
}

.transfer-proof strong{
  display:block;
  margin-bottom:5px;
}

.transfer-proof-text{
  display:block;
  color:#555;
  margin-bottom:10px;
}

.transfer-whatsapp{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  padding:11px 14px;
  border-radius:11px;
  background:#20b957;
  color:white;
  text-decoration:none;
  font-weight:800;
}

.transfer-whatsapp:hover{
  background:#189d49;
}

/* =========================
   WHATSAPP
========================= */

.whatsapp-button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  background:#20b957;
  color:white;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
}

.whatsapp-button svg{
  width:22px;
  height:22px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

  .products{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(max-width:650px){

  .hero{
    min-height:0;
    max-height:none;
    aspect-ratio:32 / 9;
  }

  .hero-profile{
    width:120px;
    height:120px;
    border:0;
    box-shadow:none;
  }

  .page{
    width:94%;
    padding-top:20px;
  }

  .menu-title h1{
    font-size:25px;
  }

  .products{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:13px;
  }

  .product{
    border-radius:16px;
  }

  .product-body{
    padding:12px;
  }

  .product-name{
    font-size:16px;
  }

  .product-description{
    font-size:13px;
  }

  .product-price{
    font-size:17px;
  }

  .cart-button{
    width:58px;
    height:58px;
    right:16px;
    bottom:16px;
  }

  .cart-box{
    padding:20px;
  }

  .delivery-row{
    grid-template-columns:40px 1fr 22px;
    padding:14px;
  }

  .delivery-icon{
    width:40px;
    height:40px;
  }
}

@media(max-width:390px){

  .products{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div id="pageBackground"></div>
<div id="backgroundOverlay"></div>

<header class="hero" id="hero">

  <img
    id="heroCover"
    class="hero-cover"
    alt="">

  <img
    id="heroProfile"
    class="hero-profile"
    alt="">

</header>

<main class="page">

  <div class="menu-title">

    <h1 id="menuTitle"></h1>

    <p id="menuSlogan"></p>

  </div>

  <div
    class="categories"
    id="categories">
  </div>

  <div id="menu"></div>

</main>

<button
  class="cart-button"
  id="cartButton"
  type="button"
  aria-label="Carrito">

  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2">

    <circle
      cx="9"
      cy="20"
      r="1">
    </circle>

    <circle
      cx="18"
      cy="20"
      r="1">
    </circle>

    <path
      d="M3 4h2l2.4 11.3a2 2 0 0 0 2 1.7h7.9a2 2 0 0 0 1.9-1.4L21 8H6">
    </path>

  </svg>

  <span
    class="cart-count"
    id="cartCount">
    0
  </span>

</button>

<div
  class="cart-panel"
  id="cartPanel">

  <div class="cart-box">

    <div class="cart-header">

      <h2>Tu pedido</h2>

      <button
        class="close-cart"
        id="closeCartButton"
        type="button">
        ×
      </button>

    <div id="cartItems"></div>

    <div class="cart-summary">

      <div class="cart-summary-line">

        <span>Productos</span>

        </span>

      </div>

      <div
        class="cart-summary-line delivery-line"
        id="cartDeliveryLine">

        <span>Envío</span>

        <span id="cartDeliveryFee">

        </span>

      </div>

    </div>

    <div class="cart-total">

      <span>Total</span>

      <span id="cartTotal">
        $0.00
      </span>

    </div>

    <div class="order-form">

      <input
        id="customerName"
        type="text"
        placeholder="Nombre">

      <input
        id="customerPhone"
        type="tel"
        placeholder="Teléfono">

      <div class="delivery-option">

        <label class="delivery-row">

          <input
            type="radio"
            name="deliveryType"
            value="delivery"
            checked>

          <span class="delivery-icon">
            🛵
          </span>

          <span class="delivery-text">

            <strong>
              Envío a domicilio
            </strong>

            <small id="deliverySubtitle">
              +$30 de envío
            </small>

          </span>

          <span class="delivery-check">
          </span>

        </label>

        <label class="delivery-row">

          <input
            type="radio"
            name="deliveryType"

          <span class="delivery-icon">

          </span>

          <span class="delivery-text">

            <strong>

            </strong>

      <input
        id="address"

      <a

      <select id="paymentMethod">

        <option value="cash">
          Efectivo
        </option>

        <option value="transfer">

        </option>

      </select>

      <div

      </div>

      <textarea
        id="orderNotes"
        placeholder="Notas del pedido"></textarea>

      <button
        class="whatsapp-button"
        id="whatsappButton"
        type="button">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"

          <path
            d="M20 11.5a8.4 8.4 0 0 1-12.7 7.3L3 20l1.3-4.1A8.5 8.5 0 1 1 20 11.5Z">
          </path>

          <path
            d="M8.5 8.5c.2-.5.4-.5.7-.5h.5c.2 0 .4.1.5.4l.7 1.6c.1.3.1.5-.1.7l-.5.6c.6 1.1 1.5 1.9 2.6 2.4l.5-.6c.2-.2.4-.2.7-.1l1.5.7c.3.1.4.3.4.5v.5c0 .3-.1.5-.4.7-.4.2-.9.3-1.3.2-2.3-.5-4.6-2.8-5.1-5.1-.1-.4 0-.9.2-1.3Z">
          </path>

        </svg>

        Hacer pedido

      </button>

    </div>

  </div>

</div>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://cqlywpemisknrxswlmea.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_wDu6p-CtnQtYu7KWH1YS1A_h7LeL0SX";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

let products = [];
let settings = {};
let cart = {};

const DEFAULT_DELIVERY_FEE = 30;

const DEFAULT_SLOGAN_TYPOGRAPHY = {

  font:
    "Arial,Helvetica,sans-serif",

  size:16,

  color:"#666666",

  weight:400,

  style:"normal",

  align:"center",

  letterSpacing:0

};

const DEFAULT_CATEGORY_TYPOGRAPHY = {

  font:
    "Arial,Helvetica,sans-serif",

  size:25,

  color:"#171717",

  weight:800,

  style:"normal",

  align:"left",

  letterSpacing:0

};

/* =========================
   CARGAR
========================= */

async function init(){

  const [
    productsResult,
    settingsResult
  ] = await Promise.all([

    db
      .from("products")
      .select("*")
      .order(
        "sort_order",
        {ascending:true}
      )
      .order(
        "id",
        {ascending:true}
      ),

    db
      .from("settings")
      .select("*")

  ]);

  if(productsResult.error){

    console.error(
      "Error cargando productos:",
      productsResult.error
    );

    return;

  }

  if(settingsResult.error){

    console.error(
      "Error cargando configuración:",
      settingsResult.error
    );

    return;

  }

  products =
    productsResult.data || [];

  settings = {};

  for(
    const row
    of settingsResult.data || []
  ){

    settings[
      row.key
    ] =
      row.value;

  }

  applyDesign();

  renderMenu();

  updateDeliverySubtitle();

  updateCart();

  updatePaymentUI();

  updateDeliveryUI();

}

/* =========================
   DISEÑO
========================= */

function applyDesign(){

  const cover =
    document.getElementById(
      "heroCover"
    );

  const profile =
    document.getElementById(
      "heroProfile"
    );

  const background =
    document.getElementById(
      "pageBackground"
    );

  if(settings.cover_image){

    cover.src =
      settings.cover_image;

    cover.style.display =
      "block";

    const scale =
      Number(
        settings.cover_scale
      ) || 1;

    const x =
      Number(
        settings.cover_x
      ) || 0;

    const y =
      Number(
        settings.cover_y
      ) || 0;

    cover.style.left =
      `calc(50% + ${x}%)`;

    cover.style.top =
      `calc(50% + ${y}%)`;

    cover.style.transform =
      `translate(-50%,-50%) scale(${scale})`;

  }else{

    cover.style.display =
      "none";

  }

  if(settings.profile_image){

    profile.src =
      settings.profile_image;

    profile.style.display =
      "block";

    const scale =
      Number(
        settings.profile_scale
      ) || 1.3;

    const x =
      Number(
        settings.profile_x
      ) || 0;

    const y =
      Number(
        settings.profile_y
      ) || 0;

    profile.style.left =
      `calc(50% + ${x}%)`;

    profile.style.top =
      `calc(50% + ${y}%)`;

    profile.style.transform =
      `translate(-50%,-50%) scale(${scale})`;

  }else{

    profile.style.display =
      "none";

  }

  if(
    settings.background_type ===
      "image" &&
    settings.background_image
  ){

    background.style.backgroundImage =
      `url("${settings.background_image}")`;

  }else{

    background.style.backgroundImage =
      "none";

  }

  background.style.backgroundColor =
    settings.background_color ||
    "#f4f4f4";

  document.getElementById(
    "menuTitle"
  ).textContent =
    settings.menu_title ||
    settings.business_name ||
    "";

  document.getElementById(
    "menuSlogan"
  ).textContent =
    settings.slogan ||
    "";

  applyTypography();

}

/* =========================
   TIPOGRAFÍA
========================= */

function parseTypography(){

  const fallback = {

    slogan:{
      ...DEFAULT_SLOGAN_TYPOGRAPHY
    },

    categories:{}

  };

  if(!settings.typography){

    return fallback;

  }

  try{

    const parsed =
      typeof settings.typography ===
      "string"
        ? JSON.parse(
            settings.typography
          )
        : settings.typography;

    if(
      !parsed ||
      typeof parsed !== "object"
    ){

      return fallback;

    }

    return {

      slogan:{
        ...DEFAULT_SLOGAN_TYPOGRAPHY,
        ...(parsed.slogan || {})
      },

      categories:{
        ...(parsed.categories || {})
      }

    };

  }catch(error){

    console.error(
      "Error leyendo tipografía:",
      error
    );

    return fallback;

  }

}

function applyTypography(){

  const typography =
    parseTypography();

  const slogan =
    document.getElementById(
      "menuSlogan"
    );

  applyTypographyStyle(
    slogan,
    typography.slogan
  );

}

function applyTypographyStyle(
  element,
  config
){

  if(
    !element ||
    !config
  ){

    return;

  }

  element.style.fontFamily =
    config.font ||
    "Arial,Helvetica,sans-serif";

  element.style.fontSize =
    Number(
      config.size ?? 16
    ) +
    "px";

  element.style.color =
    config.color ||
    "#171717";

  element.style.fontWeight =
    String(
      config.weight ?? 400
    );

  element.style.fontStyle =
    config.style ||
    "normal";

  element.style.textAlign =
    config.align ||
    "left";

  element.style.letterSpacing =
    Number(
      config.letterSpacing ?? 0
    ) +
    "px";

}

function getCategoryConfig(
  category
){

  const typography =
    parseTypography();

  return {

    ...DEFAULT_CATEGORY_TYPOGRAPHY,

    ...(
      typography.categories?.[
        category
      ] || {}
    )

  };

}

/* =========================
   CATEGORÍAS
========================= */

function getCategories(){

  const configured =
    parseJSON(
      settings.categories,
      []
    );

  const productCategories =
    [
      ...new Set(
        products
          .map(
            product =>
              product.category
          )
          .filter(Boolean)
      )
    ];

  if(
    Array.isArray(configured) &&
    configured.length
  ){

    /*
      Mantiene el orden definido
      desde el administrador.
    */

    return configured.filter(
      category =>
        productCategories.includes(
          category
        )
    );

  }

  return productCategories;

}

function getCategoryDisplayText(
  category
){

  const config =
    getCategoryConfig(
      category
    );

  return (
    config.displayText ||
    category
  );

}

function renderCategories(){

  const container =
    document.getElementById(
      "categories"
    );

  container.innerHTML =
    "";

  const categories =
    getCategories();

  categories.forEach(
    (
      category,
      index
    ) => {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "category-btn" +
        (
          index === 0
            ? " active"
            : ""
        );

      button.textContent =
        getCategoryDisplayText(
          category
        );

      button.addEventListener(
        "click",
        () => {

            .querySelectorAll(
              ".category-btn"
            )

              btn =>
                btn.classList.remove(
                  "active"
                )
            );

          button.classList.add(

          );

            document.getElementById(
              "category-" +
              slug(category)
            );

          if(section){

            section.scrollIntoView({
              behavior:"smooth",
              block:"start"
            });

        }
      );

      container.appendChild(
        button
      );

    }
  );

}

function renderProductControls(
  controls,
  product
){

  controls.innerHTML =
    "";

  const key =
    normalizeId(
      product.id
    );

  const quantity =
    cart[key]?.quantity ||
    0;

  if(!isAvailable(product)){

    const plus =
      document.createElement(
        "button"
      );

    plus.type =
      "button";

    plus.textContent =
      "+";

    plus.disabled =
      true;

    plus.style.cursor =
      "not-allowed";

    controls.appendChild(
      plus
    );

    return;

  }

  if(quantity <= 0){

    const plus =
      document.createElement(
        "button"
      );

    plus.type =
      "button";

    plus.dataset.cartAction =
      "add";

    plus.dataset.productId =
      key;

    plus.textContent =
      "+";

    plus.setAttribute(
      "aria-label",
      "Agregar " +
      (
        product.name ||
        "producto"
      )
    );

    controls.appendChild(
      plus
    );

    return;

  }

  const minus =
    document.createElement(
      "button"
    );

  minus.type =
    "button";

  minus.dataset.cartAction =
    "minus";

  minus.dataset.productId =
    key;

  minus.textContent =
    "−";

  const quantityElement =
    document.createElement(
      "span"
    );

  quantityElement.className =
    "quantity";

  quantityElement.textContent =
    quantity;

  const plus =
    document.createElement(
      "button"
    );

  plus.type =
    "button";

  plus.dataset.cartAction =
    "add";

  plus.dataset.productId =
    key;

  plus.textContent =
    "+";

  controls.appendChild(
    minus
  );

  controls.appendChild(
    quantityElement
  );

  controls.appendChild(
    plus
  );

}

/* =========================
   CARRITO
========================= */

function addToCart(id){

  const key =
    normalizeId(id);

  const product =
    findProductById(
      key
    );

  if(
    !product ||
    !isAvailable(product)
  ){

    return;

  }

  if(!cart[key]){

    cart[key] = {

      product,
      quantity:1

    };

  }else{

    cart[key].quantity += 1;

  }

  updateCart();

}

function changeQuantity(
  id,
  amount
){

  const key =
    normalizeId(id);

  const product =
    findProductById(
      key
    );

  if(
    !product ||
    !isAvailable(product)
  ){

    return;

  }

  const current =
    cart[key]?.quantity ||
    0;

  const next =
    current +
    Number(amount);

  if(next <= 0){

    delete cart[key];

  }else{

    cart[key] = {

      product,
      quantity:next

    };

  }

  updateCart();

}

function updateProductCard(id){

  const key =
    normalizeId(id);

  const card =
    document.querySelector(
      `.product[data-product-id="${CSS.escape(key)}"]`
    );

  if(!card){
    return;
  }

  const product =
    findProductById(
      key
    );

  if(!product){
    return;
  }

  const controls =
    card.querySelector(
      ".add-controls"
    );

  if(controls){

    renderProductControls(
      controls,
      product
    );

  }

}

        );

      minus.dataset.cartAction =

          item.product.id
        );

      minus.textContent =
        "−";

      const quantity =
        document.createElement(
          "strong"
        );

      quantity.textContent =
        item.quantity;

      const plus =

        );

      plus.type =

      plus.dataset.cartAction =

      plus.dataset.productId =

      controls.appendChild(

      controls.appendChild(

        plus

      row.appendChild(
        info

      row.appendChild(
        controls

    "cartTotal"

    );

  document.getElementById(
    "cartCount"

    count;

  products.forEach(
    product =>
      updateProductCard(
        product.id
      )
  );

        item.quantity;

      productsTotal +=
        subtotal;

      message +=
        item.quantity +
        " x " +
        item.product.name +
        " — $" +
        subtotal.toFixed(2) +
        "\n";

    }
  );

  const deliveryFee =
    deliveryType ===
    "delivery"
      ? getDeliveryFee()
      : 0;

  const total =
    productsTotal +
    deliveryFee;

  message +=
    "\n*Subtotal productos: $" +
    productsTotal.toFixed(2) +
    "*\n";

  message +=
    "*Envío: $" +
    deliveryFee.toFixed(2) +
    "*\n";

  message +=
    "*TOTAL: $" +
    total.toFixed(2) +
    "*\n";

  message +=
    "*Pago:* " +
    (
      payment ===
      "transfer"
        ? "Transferencia"
        : "Efectivo"
    ) +
    "\n";

  if(notes){

    message +=
      "*Notas:* " +
      notes +
      "\n";

  }

  const url =
    "https://wa.me/" +
    whatsapp +
    "?text=" +
    encodeURIComponent(
      message
    );

  window.open(
    url,
    "_blank"
  );

}

/* =========================
   UTILIDADES
========================= */

function normalizeId(id){

  return String(
    id ?? ""
  );

}

function findProductById(id){

  const key =
    normalizeId(id);

  return products.find(
    product =>
      normalizeId(
        product.id
      ) === key
  );

}

function isAvailable(product){

  if(!product){
    return false;
  }

  const value =
    product.available;

  return (
    value === true ||
    value === 1 ||
    value === "1" ||
    value === "true" ||
    value === "TRUE"
  );

}

function formatMoney(amount){

  return "$" +
    Number(
      amount || 0
    ).toFixed(2);

}

function slug(text){

  return String(text)

    .normalize("NFD")

    .replace(
      /[\u0300-\u036f]/g,
      ""
    )

    .toLowerCase()

    .replace(
      /[^a-z0-9]+/g,
      "-"
    )

    .replace(
      /^-|-$/g,
      ""
    );

}

function parseJSON(
  value,
  fallback
){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return fallback;

  }

  if(
    typeof value === "object"
  ){

    return value;

  }

  try{

    return JSON.parse(
      value
    );

  }catch{

    return fallback;

  }

}

function escapeHtml(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}

/* =========================
   INICIAR
========================= */

init();

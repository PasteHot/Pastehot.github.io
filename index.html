<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Menú</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
:root{
  --accent:#d71920;
  --ink:#171717;
  --muted:#6b6f76;
  --surface:rgba(255,255,255,.92);
  --surface-solid:#fff;
  --border:rgba(20,20,20,.09);
  --shadow:0 12px 35px rgba(0,0,0,.10);
  --category-color:#171717;
  --category-size:28px;
  --category-font:Arial,Helvetica,sans-serif;
  --category-weight:800;
}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:transparent}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
.hidden{display:none!important}

/* Fondo independiente de la portada */
#pageBackground{position:fixed;inset:0;z-index:0;background:#f4f4f4 center/cover no-repeat}
#backgroundOverlay{position:fixed;inset:0;z-index:1;background:rgba(0,0,0,0);pointer-events:none}
.hero,.page{position:relative;z-index:2}

.hero{width:100%;aspect-ratio:32/9;max-height:520px;overflow:hidden;background:#151515;position:relative}
.hero-cover{position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:cover;transform:translate(-50%,-50%);transform-origin:center;display:none;user-select:none;pointer-events:none}
.hero-profile{position:absolute;left:50%;top:50%;width:150px;height:150px;border-radius:50%;object-fit:cover;transform:translate(-50%,-50%);display:none;user-select:none;pointer-events:none}

.page{width:min(1180px,94%);margin:0 auto;padding:26px 0 100px}
.brand-card{max-width:980px;margin:0 auto 24px;padding:20px 22px;text-align:center;border:1px solid var(--border);background:var(--surface);backdrop-filter:blur(10px);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.07)}
.brand-card h1{margin:0;font-size:clamp(26px,4vw,36px);font-weight:900;letter-spacing:-.02em}
.brand-card p{margin:7px 0 0;color:var(--muted);line-height:1.45}
.brand-dashboard{display:grid;grid-template-columns:minmax(210px,1fr) minmax(180px,1.15fr) minmax(210px,1fr);grid-template-areas:"left center right";align-items:center;gap:16px}
.brand-left{grid-area:left;display:flex;justify-content:flex-start}
.brand-center{grid-area:center;text-align:center}
.brand-right{grid-area:right;display:flex;justify-content:flex-end}
.batch-public{display:none;align-items:center;gap:10px;min-width:190px;padding:11px 14px;border-radius:16px;background:linear-gradient(135deg,#b80e16,#e32931);color:#fff;box-shadow:0 8px 22px rgba(183,14,22,.24);text-align:left}
.batch-public.show{display:flex}
.batch-public.fresh{background:linear-gradient(135deg,#0f7f43,#18a85a);box-shadow:0 8px 22px rgba(15,127,67,.22)}
.batch-fire{width:36px;height:36px;flex:0 0 auto;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:20px}
.batch-copy{min-width:0}.batch-copy small{display:block;font-size:10px;line-height:1.15;font-weight:900;text-transform:uppercase;letter-spacing:.055em;color:rgba(255,255,255,.86)}.batch-countdown{display:block;margin-top:2px;font-size:24px;line-height:1;font-weight:900;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.store-state{display:inline-flex;align-items:center;gap:7px;margin-top:8px;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900}
.store-state.open{background:#e4f8eb;color:#0b7b3d}.store-state.closed{background:#ffe6e8;color:#b3111a}
.store-state-dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.delivery-public{display:none;align-items:center;gap:9px;max-width:230px;padding:11px 14px;border-radius:16px;background:#eef8f1;color:#126a39;font-weight:900;text-align:left;box-shadow:0 6px 18px rgba(18,106,57,.08)}
.delivery-public.show{display:flex}.delivery-public-icon{font-size:21px}.delivery-public-text{font-size:13px;line-height:1.25}
.business-meta{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:13px;font-size:13px;color:#555}
.business-meta span{background:rgba(255,255,255,.72);padding:6px 10px;border-radius:999px;border:1px solid var(--border)}
.social-proof{display:none;margin:13px auto 0;align-items:center;justify-content:center;gap:6px;width:max-content;max-width:100%;padding:8px 13px;border-radius:999px;background:#eaf8ef;color:#108044;border:1px solid #cbead6;font-weight:900;font-size:13px}
.social-proof.show{display:flex}.social-proof strong{font-size:18px}
.closed-reason{display:none;margin:13px auto 0;max-width:680px;padding:10px 13px;border-radius:12px;background:#fff0f1;color:#95131a;border:1px solid #ffd3d6;font-size:13px;font-weight:800}
.closed-reason.show{display:block}
@media(max-width:760px){.brand-dashboard{grid-template-columns:1fr;grid-template-areas:"center" "left" "right";gap:10px}.brand-left,.brand-right{justify-content:center}.batch-public,.delivery-public{width:min(100%,310px);justify-content:center}.brand-card{padding:17px 14px}}

.categories-shell{position:sticky;top:0;z-index:30;margin:0 -1px 10px;padding:8px 0;background:linear-gradient(to bottom,rgba(255,255,255,.94),rgba(255,255,255,.76),transparent);backdrop-filter:blur(6px)}
.categories{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.category-btn{flex:0 0 auto;border:1px solid var(--border);border-radius:999px;padding:11px 18px;background:rgba(255,255,255,.94);color:#333;font-weight:800;box-shadow:0 3px 12px rgba(0,0,0,.07);transition:.18s}
.category-btn:hover{transform:translateY(-1px)}
.category-btn.active{background:#111;color:#fff;border-color:#111}

.category-section{margin-top:32px;scroll-margin-top:82px}
.category-title{font-family:var(--category-font);font-size:var(--category-size);font-weight:var(--category-weight);color:var(--category-color);margin:0 0 16px;line-height:1.1;text-shadow:0 1px 2px rgba(255,255,255,.18)}
.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.product{position:relative;overflow:hidden;border-radius:20px;background:var(--surface);backdrop-filter:blur(8px);border:1px solid var(--border);box-shadow:var(--shadow);transition:.2s}
.product:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(0,0,0,.14)}
.product-image-wrap{position:relative;width:100%;aspect-ratio:1/1;background:#eee;overflow:hidden;cursor:zoom-in}
.product-image{width:100%;height:100%;object-fit:cover;display:block;transition:.2s}
.product.soldout .product-image{opacity:.42;filter:grayscale(.55)}
.soldout-label{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:10;background:#d40000;color:#fff;font-size:13px;font-weight:900;letter-spacing:.7px;padding:7px 13px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.25);white-space:nowrap}
.low-stock-label{position:absolute;left:12px;top:12px;z-index:10;background:#fff4d6;color:#805d00;border:1px solid #f0d38a;font-size:12px;font-weight:900;padding:6px 9px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.12);white-space:nowrap}
.stock-inline-note{margin-top:8px;font-size:11px;font-weight:900;color:#805d00;text-align:center;min-height:14px}
.cart-stock-note{margin-top:5px;font-size:12px;font-weight:900;color:#805d00}
.product-body{padding:16px}
.product.soldout .product-body{opacity:.5}
.product-name{font-size:18px;font-weight:900;margin:0 0 7px;line-height:1.2}
.product-description{font-size:14px;color:#666;line-height:1.65;min-height:40px;text-align:center;text-wrap:pretty}
.product-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:15px}
.product-price{font-size:20px;font-weight:900}
.add-controls{display:flex;align-items:center;justify-content:flex-end;gap:7px;min-width:42px}
.add-controls button{border:none;width:38px;height:38px;border-radius:50%;background:#111;color:#fff;font-size:23px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.add-controls button:active{transform:scale(.94)}
.add-controls button:disabled{opacity:.35}
.add-controls .quantity{min-width:22px;text-align:center;font-size:17px;font-weight:900}

.cart-button{position:fixed;right:22px;bottom:22px;z-index:100;width:64px;height:64px;border:0;border-radius:50%;background:#111;color:#fff;box-shadow:0 10px 34px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.cart-button svg{width:29px;height:29px}.cart-count{position:absolute;right:-2px;top:-3px;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
.cart-panel{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:200;display:none;align-items:flex-end;justify-content:center;padding-top:25px}
.cart-panel.open{display:flex}.cart-box{width:min(600px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:24px;box-shadow:0 -20px 60px rgba(0,0,0,.18)}
.cart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.cart-header h2{margin:0}.close-cart{border:0;background:#eee;width:38px;height:38px;border-radius:50%;font-size:20px}
.cart-empty{padding:25px 4px;color:#777;text-align:center}
.cart-item{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:13px 0;border-bottom:1px solid #eee}.cart-item-info{flex:1;min-width:0}.cart-item-name{font-weight:900}.cart-item-price{color:#666;margin-top:4px;font-size:14px}.qty-controls{display:flex;align-items:center;gap:8px;flex-shrink:0}.qty-controls button{width:30px;height:30px;border:0;border-radius:50%;background:#eee;font-weight:bold;font-size:18px;display:flex;align-items:center;justify-content:center}.qty-controls strong{min-width:20px;text-align:center}
.cart-summary{padding:15px 0 5px;border-top:1px solid #eee}.cart-summary-line{display:flex;justify-content:space-between;gap:15px;padding:5px 0;font-size:15px;color:#555}.cart-total{display:flex;justify-content:space-between;font-size:22px;font-weight:900;padding:14px 0 18px}
.order-form{display:grid;gap:12px}.order-form input,.order-form textarea,.order-form select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;outline:none;background:#fff}.order-form input:focus,.order-form textarea:focus,.order-form select:focus{border-color:#111;box-shadow:0 0 0 3px rgba(0,0,0,.06)}.order-form textarea{min-height:80px;resize:vertical}
.delivery-option{display:grid;gap:9px}.delivery-row{position:relative;display:grid;grid-template-columns:42px 1fr 24px;align-items:center;gap:12px;padding:14px 15px;border:1.5px solid #ddd;border-radius:15px;background:#fff;cursor:pointer}.delivery-row:has(input:checked){border-color:#111;background:#f7f7f7}.delivery-row input{position:absolute;opacity:0;pointer-events:none}.delivery-icon{width:42px;height:42px;border-radius:12px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:23px}.delivery-text{display:flex;flex-direction:column;gap:3px}.delivery-text strong{font-size:15px}.delivery-text small{color:#777;font-size:12px}.delivery-check{width:20px;height:20px;border:2px solid #bbb;border-radius:50%;position:relative}.delivery-row:has(input:checked) .delivery-check{border-color:#111;background:#111}.delivery-row:has(input:checked) .delivery-check::after{content:"";position:absolute;width:6px;height:6px;background:#fff;border-radius:50%;left:5px;top:5px}
.maps-button{display:none;text-decoration:none;background:#eee;color:#111;padding:11px 13px;border-radius:11px;font-weight:800;text-align:center}
.transfer-panel{display:none;background:#f7f7f7;border:1px solid #e5e5e5;border-radius:16px;padding:16px;font-size:14px;line-height:1.5}
.transfer-panel.show{display:block}
.transfer-title{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:900;margin-bottom:5px}
.transfer-intro{color:#666;margin:0 0 13px}
.bank-data{display:grid;gap:8px}
.bank-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid #e7e7e7;border-radius:12px;padding:10px 11px}
.bank-label{display:block;color:#777;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.bank-value{display:block;margin-top:2px;font-weight:900;word-break:break-all}
.copy-bank{border:0;background:#111;color:#fff;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:900}
.transfer-steps{margin-top:14px;background:#fff;border-radius:12px;padding:12px 13px;border:1px solid #e7e7e7}
.transfer-steps ol{margin:7px 0 0;padding-left:20px;color:#555}
.transfer-steps li{margin:5px 0}
.transfer-safety{margin-top:12px;padding:10px 11px;border-radius:10px;background:#eef8f1;color:#225c34;font-size:12px;font-weight:700}
.transfer-proof{margin-top:13px}
.transfer-whatsapp{display:flex;align-items:center;justify-content:center;width:100%;padding:12px 14px;border-radius:11px;background:#20b957;color:#fff;text-decoration:none;font-weight:900;border:0}
.transfer-whatsapp.secondary{background:#eef0f2;color:#1d1d1d}
.payment-label{font-size:13px;font-weight:900;margin-bottom:-4px}

.whatsapp-button{width:100%;border:0;border-radius:14px;padding:15px;background:#20b957;color:#fff;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:9px}.whatsapp-button:disabled{opacity:.6}.order-status-message{display:none;padding:11px 12px;border-radius:10px;font-size:13px}.order-status-message.show{display:block}.order-status-message.ok{background:#e8f8ee;color:#0c6f34}.order-status-message.warn{background:#fff5dd;color:#805d00}


.product.store-closed .add-controls button{opacity:.28;cursor:not-allowed}
.store-closed-note{display:none;margin-top:8px;font-size:11px;font-weight:900;color:#a51118;text-align:center}
.product.store-closed .store-closed-note{display:block}
.image-lightbox{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:28px;background:rgba(0,0,0,.88);backdrop-filter:blur(5px)}
.image-lightbox.open{display:flex}
.image-lightbox-content{position:relative;max-width:min(92vw,1000px);max-height:90vh}
.image-lightbox img{display:block;max-width:92vw;max-height:88vh;object-fit:contain;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.45);background:#fff}
.image-lightbox-close{position:absolute;right:-14px;top:-14px;width:46px;height:46px;border:0;border-radius:50%;background:#fff;color:#111;font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:2}
.image-lightbox-caption{position:absolute;left:12px;right:12px;bottom:10px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.65);color:#fff;font-weight:800;text-align:center;font-size:13px}
.cart-closed-warning{display:none;margin-bottom:12px;padding:11px 12px;border-radius:11px;background:#fff0f1;color:#97151c;font-size:13px;font-weight:800}
.cart-closed-warning.show{display:block}

@media(max-width:900px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){.hero-profile{width:110px;height:110px}.page{width:94%;padding-top:18px}.brand-card{padding:15px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{border-radius:16px}.product-body{padding:12px}.product-name{font-size:16px}.product-description{font-size:13px;min-height:36px}.product-price{font-size:17px}.add-controls button{width:36px;height:36px;font-size:21px}.cart-button{width:58px;height:58px;right:16px;bottom:16px}.cart-box{padding:19px}.category-section{scroll-margin-top:75px}}
@media(max-width:390px){.products{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="pageBackground"></div>
<div id="backgroundOverlay"></div>
<header class="hero" id="hero">
  <img id="heroCover" class="hero-cover" alt="">
  <img id="heroProfile" class="hero-profile" alt="">
</header>
<main class="page">
  <section class="brand-card">
    <div class="brand-dashboard">
      <div class="brand-left">
        <div id="batchPublic" class="batch-public" aria-live="polite">
          <div class="batch-fire">🔥</div>
          <div class="batch-copy">
            <small id="batchPublicLabel">Salen del horno en</small>
            <strong id="batchPublicTime" class="batch-countdown">30:00</strong>
          </div>
        </div>
      </div>

      <div class="brand-center">
        <h1 id="menuTitle"></h1>
        <p id="menuSlogan"></p>
        <div id="storeState" class="store-state open"><span class="store-state-dot"></span><span id="storeStateText">ABIERTO</span></div>
      </div>

      <div class="brand-right">
        <div id="deliveryPublic" class="delivery-public">
          <span class="delivery-public-icon">🚚</span>
          <span id="deliveryPublicText" class="delivery-public-text">Envío en menos de 20 min</span>
        </div>
      </div>
    </div>
    <div class="business-meta" id="businessMeta"></div>
    <div id="socialProof" class="social-proof"><strong id="socialProofCount">0+</strong><span id="socialProofSuffix">pedidos esta semana</span></div>
    <div id="closedReason" class="closed-reason"></div>
  </section>
  <div class="categories-shell"><div class="categories" id="categories"></div></div>
  <div id="menu"></div>
</main>
<button class="cart-button" id="cartButton" type="button" aria-label="Abrir carrito">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle><path d="M3 4h2l2.4 11.3a2 2 0 0 0 2 1.7h7.9a2 2 0 0 0 1.9-1.4L21 8H6"></path></svg>
  <span class="cart-count" id="cartCount">0</span>
</button>
<div class="cart-panel" id="cartPanel">
  <div class="cart-box">
    <div class="cart-header"><h2>Tu pedido</h2><button class="close-cart" id="closeCartButton" type="button">×</button></div><div id="cartClosedWarning" class="cart-closed-warning">La tienda está cerrada. Tu carrito se conservará para cuando volvamos a abrir.</div>
    <div id="cartItems"></div>
    <div class="cart-summary">
      <div class="cart-summary-line"><span>Productos</span><span id="cartProductsTotal">$0.00</span></div>
      <div class="cart-summary-line" id="cartDeliveryLine"><span>Envío</span><span id="cartDeliveryFee">$0.00</span></div>
    </div>
    <div class="cart-total"><span>Total</span><span id="cartTotal">$0.00</span></div>
    <div class="order-form">
      <input id="customerName" type="text" autocomplete="name" placeholder="Nombre">
      <input id="customerPhone" type="tel" autocomplete="tel" placeholder="Teléfono">
      <div class="delivery-option">
        <label class="delivery-row"><input type="radio" name="deliveryType" value="delivery" checked><span class="delivery-icon">🛵</span><span class="delivery-text"><strong>Envío a domicilio</strong><small id="deliverySubtitle"></small></span><span class="delivery-check"></span></label>
        <label class="delivery-row"><input type="radio" name="deliveryType" value="pickup"><span class="delivery-icon">🛍️</span><span class="delivery-text"><strong>Pasar a recoger</strong><small>Recoge tu pedido en nuestro punto de venta</small></span><span class="delivery-check"></span></label>
      </div>
      <input id="address" type="text" autocomplete="street-address" placeholder="Dirección de entrega">
      <a id="mapsButton" class="maps-button" href="#" target="_blank" rel="noopener">📍 Ver ubicación para recoger</a>
      <div class="payment-label">Forma de pago</div><select id="paymentMethod"><option value="cash">Efectivo al recibir/recoger</option><option value="transfer">Transferencia bancaria</option></select>
      <div id="transferPanel" class="transfer-panel"></div>
      <textarea id="orderNotes" placeholder="Notas del pedido (opcional)"></textarea>
      <div id="orderStatusMessage" class="order-status-message"></div>
      <button class="whatsapp-button" id="whatsappButton" type="button">📲 Enviar pedido por WhatsApp</button>
    </div>
  </div>
</div>

<div id="imageLightbox" class="image-lightbox" role="dialog" aria-modal="true" aria-label="Vista ampliada del producto">
  <div class="image-lightbox-content">
    <button id="imageLightboxClose" class="image-lightbox-close" type="button" aria-label="Cerrar imagen">×</button>
    <img id="imageLightboxImg" src="" alt="">
    <div id="imageLightboxCaption" class="image-lightbox-caption"></div>
  </div>
</div>
<script>
const SUPABASE_URL="https://cqlywpemisknrxswlmea.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_wDu6p-CtnQtYu7KWH1YS1A_h7LeL0SX";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let products=[];
let settings={};
let cart={};
const DEFAULT_DELIVERY_FEE=30;
const FALLBACK_CATEGORIES=["Pastes salados","Pastes dulces","Pastes de temporada","Bebidas","Promociones"];
let batchPublicInterval=null;
const FONT_MAP={
  "Arial":"Arial,Helvetica,sans-serif",
  "Georgia":"Georgia,'Times New Roman',serif",
  "Trebuchet":"'Trebuchet MS',Arial,sans-serif",
  "Verdana":"Verdana,Geneva,sans-serif",
  "Times":"'Times New Roman',Times,serif",
  "Courier":"'Courier New',Courier,monospace"
};
function normalizeId(id){return String(id??"")}
function normalizePhone(v){return String(v??"").replace(/\D/g,"")}
function findProductById(id){const k=normalizeId(id);return products.find(p=>normalizeId(p.id)===k)}
function boolValue(v){return [true,1,"1","true","TRUE"].includes(v)}
function isStockTracked(p){return !!p&&boolValue(p.track_stock)}
function stockCount(p){return Math.max(0,Math.floor(Number(p?.stock)||0))}
function lowStockThreshold(p){return Math.max(0,Math.floor(Number(p?.low_stock_threshold)||0))}
function maxPurchasable(p){return isStockTracked(p)?stockCount(p):Infinity}
function isAvailable(p){if(!p)return false;return boolValue(p.available)&&(!isStockTracked(p)||stockCount(p)>0)}
function stockLimitMessage(p){const n=stockCount(p);return n===1?"Solo queda 1 disponible.":`Solo quedan ${n} disponibles.`}
function shouldShowStockLimit(p,q=0){
  if(!isStockTracked(p)||!isAvailable(p))return false;
  const stock=stockCount(p);
  return stock<=lowStockThreshold(p)||Number(q)>=stock;
}
function formatMoney(n){return "$"+Number(n||0).toFixed(2)}
function getDeliveryFee(){const n=Number(settings.delivery_cost);return Number.isFinite(n)&&n>=0?n:DEFAULT_DELIVERY_FEE}
function getDeliveryType(){return document.querySelector('input[name="deliveryType"]:checked')?.value||"delivery"}
function getAppliedDeliveryFee(){return getDeliveryType()==="delivery"?getDeliveryFee():0}
function safeJson(value,fallback){try{return typeof value==="string"?JSON.parse(value):value??fallback}catch{return fallback}}

const STORE_TIME_ZONE="America/Merida";
const WEEK_DAYS=["sun","mon","tue","wed","thu","fri","sat"];
const WEEK_LABELS={sun:"domingo",mon:"lunes",tue:"martes",wed:"miércoles",thu:"jueves",fri:"viernes",sat:"sábado"};
let storeClockInterval=null;

function boolSetting(value,defaultValue=false){
  if(value===undefined||value===null||value==="")return defaultValue;
  return String(value)==="true";
}

function defaultPublicSchedule(){
  const open=settings.opening_time||"12:00";
  const close=settings.closing_time||"21:00";
  return Object.fromEntries(WEEK_DAYS.map(k=>[k,{enabled:true,open,close}]));
}

function getWeeklySchedule(){
  const parsed=safeJson(settings.weekly_schedule,null);
  if(parsed&&typeof parsed==="object")return parsed;
  return defaultPublicSchedule();
}

function meridaNowParts(){
  const parts=new Intl.DateTimeFormat("en-US",{
    timeZone:STORE_TIME_ZONE,weekday:"short",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"
  }).formatToParts(new Date());
  const map={};parts.forEach(p=>map[p.type]=p.value);
  const dayMap={Sun:"sun",Mon:"mon",Tue:"tue",Wed:"wed",Thu:"thu",Fri:"fri",Sat:"sat"};
  return {day:dayMap[map.weekday],hour:Number(map.hour),minute:Number(map.minute),second:Number(map.second)};
}

function timeToMinutes(t){
  const [h,m]=String(t||"00:00").split(":").map(Number);
  return (Number.isFinite(h)?h:0)*60+(Number.isFinite(m)?m:0);
}

function isMinuteInsideSchedule(nowMin,openMin,closeMin){
  if(openMin===closeMin)return true;
  if(closeMin>openMin)return nowMin>=openMin&&nowMin<closeMin;
  return nowMin>=openMin||nowMin<closeMin;
}

function currentStoreState(){
  if(boolSetting(settings.store_manual_closed,false)){
    return {open:false,manual:true,reason:settings.store_manual_close_reason||"Cerrado temporalmente."};
  }
  const now=meridaNowParts();
  const schedule=getWeeklySchedule();
  const today=schedule[now.day]||{enabled:false};
  const nowMin=now.hour*60+now.minute;
  if(today.enabled&&isMinuteInsideSchedule(nowMin,timeToMinutes(today.open),timeToMinutes(today.close))){
    return {open:true,day:now.day,today};
  }
  return {open:false,manual:false,day:now.day,today,next:findNextOpening(now,schedule)};
}

function findNextOpening(now,schedule){
  const currentIndex=WEEK_DAYS.indexOf(now.day);
  const nowMin=now.hour*60+now.minute;
  for(let offset=0;offset<8;offset++){
    const key=WEEK_DAYS[(currentIndex+offset)%7];
    const d=schedule[key];
    if(!d?.enabled)continue;
    const openMin=timeToMinutes(d.open);
    if(offset===0 && nowMin<openMin)return{offset,key,time:d.open};
    if(offset>0)return{offset,key,time:d.open};
  }
  return null;
}

function nextOpeningText(next){
  if(!next)return"";
  if(next.offset===0)return`Abrimos hoy a las ${next.time}`;
  if(next.offset===1)return`Abrimos mañana a las ${next.time}`;
  return`Abrimos el ${WEEK_LABELS[next.key]} a las ${next.time}`;
}

function isStoreOpen(){return currentStoreState().open}

function renderStoreState(){
  const state=currentStoreState();
  const stateBox=document.getElementById("storeState");
  const stateText=document.getElementById("storeStateText");
  if(stateBox&&stateText){
    stateBox.className=`store-state ${state.open?"open":"closed"}`;
    stateText.textContent=state.open?"ABIERTO":"CERRADO";
  }

  const reason=document.getElementById("closedReason");
  if(reason){
    if(state.open){reason.classList.remove("show");reason.textContent=""}
    else{
      const detail=state.manual?(state.reason||"Cerrado temporalmente."):(nextOpeningText(state.next)||"Cerrado por horario.");
      reason.textContent=detail;
      reason.classList.add("show");
    }
  }

  const warning=document.getElementById("cartClosedWarning");
  if(warning)warning.classList.toggle("show",!state.open);

  const send=document.getElementById("whatsappButton");
  if(send){
    send.disabled=!state.open;
    if(!state.open)send.textContent="🔒 Tienda cerrada";
    else if(send.textContent==="🔒 Tienda cerrada")send.textContent="📲 Enviar pedido por WhatsApp";
  }

  products.forEach(p=>updateProductCard(p.id));
  updateCartControlsOnly();
  renderBusinessMeta(state);
}

function renderBusinessMeta(state=currentStoreState()){
  const meta=document.getElementById("businessMeta");
  if(!meta)return;
  meta.innerHTML="";
  const schedule=getWeeklySchedule();
  const today=schedule[state.day||meridaNowParts().day];
  if(today?.enabled){
    const s=document.createElement("span");
    s.textContent=`Hoy ${today.open}–${today.close}`;
    meta.appendChild(s);
  }else{
    const s=document.createElement("span");s.textContent="Hoy cerrado";meta.appendChild(s);
  }
  if(settings.business_address){const s=document.createElement("span");s.textContent=settings.business_address;meta.appendChild(s)}
}

    document.getElementById("deliveryPublicText").textContent=settings.delivery_badge_text||"Envío en menos de 20 min";

function startStoreClock(){

  renderStoreState();

}

function blockClosedAction(){
  if(isStoreOpen())return false;
  const state=currentStoreState();
  alert(state.manual?(state.reason||"La tienda está cerrada temporalmente."):(nextOpeningText(state.next)||"La tienda está cerrada en este momento."));
  return true;
}

function updateCartControlsOnly(){
  const open=isStoreOpen();
  document.querySelectorAll("#cartItems .qty-controls button").forEach(b=>b.disabled=!open);
}



const SESSION_KEY="pastehot_checkout_v2";
function saveCheckoutState(){
  try{
    const quantities={};
    Object.entries(cart).forEach(([id,item])=>quantities[id]=Number(item.quantity)||0);
    const state={
      quantities,
      name:document.getElementById("customerName")?.value||"",
      phone:document.getElementById("customerPhone")?.value||"",
      address:document.getElementById("address")?.value||"",
      notes:document.getElementById("orderNotes")?.value||"",
      payment:document.getElementById("paymentMethod")?.value||"cash",
      delivery:getDeliveryType()
    };
    localStorage.setItem(SESSION_KEY,JSON.stringify(state));
  }catch(e){console.warn("No se pudo guardar temporalmente el carrito.",e)}
}
function restoreCheckoutState(){
  try{
    const state=safeJson(localStorage.getItem(SESSION_KEY),{});
    if(state?.quantities){
      Object.entries(state.quantities).forEach(([id,q])=>{
        const product=findProductById(id);
        const requested=Math.max(0,Math.floor(Number(q)||0));
        const quantity=product?Math.min(requested,maxPurchasable(product)):0;
        if(product&&quantity>0&&isAvailable(product))cart[normalizeId(id)]={product,quantity};
      });
    }
    if(state?.name)customerName.value=state.name;
    if(state?.phone)customerPhone.value=state.phone;
    if(state?.address)address.value=state.address;
    if(state?.notes)orderNotes.value=state.notes;
    if(["cash","transfer"].includes(state?.payment))paymentMethod.value=state.payment;
    if(["delivery","pickup"].includes(state?.delivery)){
      const radio=document.querySelector(`input[name="deliveryType"][value="${state.delivery}"]`);
      if(radio)radio.checked=true;
    }
  }catch(e){console.warn("No se pudo restaurar el carrito.",e)}
}
function clearCheckoutState(){try{localStorage.removeItem(SESSION_KEY)}catch{}}
function reconcileCartWithProducts(){
  const next={};
  Object.entries(cart).forEach(([id,item])=>{
    const product=findProductById(id);
    if(!product||!isAvailable(product))return;
    const quantity=Math.min(Math.max(0,Math.floor(Number(item.quantity)||0)),maxPurchasable(product));
    if(quantity>0)next[normalizeId(id)]={product,quantity};
  });
  cart=next;
}
async function reloadProducts(){
  const {data,error}=await db.from("products").select("*").order("sort_order",{ascending:true}).order("created_at",{ascending:true});

  products=data||[];

}

function publicBatchState(){
  const enabled=String(settings.batch_timer_enabled||"false")==="true";
  if(!enabled||!settings.batch_end_time)return{visible:false};

  const endMs=new Date(settings.batch_end_time).getTime();
  if(!Number.isFinite(endMs))return{visible:false};

  const now=Date.now();
  const remaining=endMs-now;
  const label=settings.batch_label||"Salen del horno en";
  const finished=settings.batch_finished_message||"¡Recién horneados!";
  const freshMinutes=Math.max(1,Math.min(60,Number(settings.batch_fresh_minutes)||5));

  if(remaining>0){
    const totalSeconds=Math.ceil(remaining/1000);
    const min=Math.floor(totalSeconds/60);
    const sec=totalSeconds%60;
    return{
      visible:true,
      fresh:false,
      label,
      time:`${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`
    };
  }

  if(now<endMs+freshMinutes*60000){
    return{
      visible:true,
      fresh:true,
      label:finished,
      time:"LISTOS"
    };
  }

  return{visible:false};
}

function renderPublicBatchClock(){
  const box=document.getElementById("batchPublic");
  if(!box)return;
  const state=publicBatchState();

  if(!state.visible){
    box.classList.remove("show","fresh");
    return;
  }

  box.classList.add("show");
  box.classList.toggle("fresh",Boolean(state.fresh));
  document.getElementById("batchPublicLabel").textContent=state.label;
  document.getElementById("batchPublicTime").textContent=state.time;
}

function startPublicBatchClock(){
  if(batchPublicInterval)clearInterval(batchPublicInterval);
  renderPublicBatchClock();
  batchPublicInterval=setInterval(renderPublicBatchClock,1000);
}


function configuredCategories(){const parsed=safeJson(settings.categories,[]);return Array.isArray(parsed)&&parsed.length?parsed:FALLBACK_CATEGORIES}
function getCategories(){const found=new Set(products.map(p=>p.category).filter(Boolean));const result=[];configuredCategories().forEach(c=>{if(found.has(c))result.push(c)});found.forEach(c=>{if(!result.includes(c))result.push(c)});return result}
function slug(text){return String(text).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function renderCategories(){const c=document.getElementById("categories");c.innerHTML="";getCategories().forEach((cat,i)=>{const b=document.createElement("button");b.type="button";b.className="category-btn"+(i===0?" active":"");b.textContent=cat;b.onclick=()=>{document.querySelectorAll(".category-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById("category-"+slug(cat))?.scrollIntoView({behavior:"smooth",block:"start"})};c.appendChild(b)})}
function renderMenu(){renderCategories();const menu=document.getElementById("menu");menu.innerHTML="";getCategories().forEach(cat=>{const sec=document.createElement("section");sec.className="category-section";sec.id="category-"+slug(cat);const h=document.createElement("h2");h.className="category-title";h.textContent=cat;const grid=document.createElement("div");grid.className="products";products.filter(p=>p.category===cat).forEach(p=>grid.appendChild(createProduct(p)));sec.append(h,grid);menu.appendChild(sec)})}
function createProduct(product){
  const card=document.createElement("article");
  card.className="product"+(isAvailable(product)?"":" soldout")+(!isStoreOpen()?" store-closed":"");
  card.dataset.productId=normalizeId(product.id);

  const wrap=document.createElement("div");
  wrap.className="product-image-wrap";
  wrap.title="Toca para ampliar";

  const img=document.createElement("img");
  img.className="product-image";
  img.src=product.image_url||"";
  img.alt=product.name||"Producto";
  img.loading="lazy";
  img.onerror=()=>{img.style.display="none"};
  img.addEventListener("click",()=>openImageLightbox(product.image_url||"",product.name||"Producto"));
  wrap.appendChild(img);

  if(!isAvailable(product)){
    const s=document.createElement("div");s.className="soldout-label";s.textContent="AGOTADO";wrap.appendChild(s);
  }else if(isStockTracked(product)&&stockCount(product)<=lowStockThreshold(product)){
    const low=document.createElement("div");
    low.className="low-stock-label";
    low.textContent=stockCount(product)===1?"Última pieza":`Últimos ${stockCount(product)}`;
    wrap.appendChild(low);
  }

  const body=document.createElement("div");body.className="product-body";
  const n=document.createElement("h3");n.className="product-name";n.textContent=product.name||"";
  const d=document.createElement("div");d.className="product-description";d.textContent=product.description||"";
  const closed=document.createElement("div");closed.className="store-closed-note";closed.textContent="Disponible cuando la tienda abra";
  const stockNote=document.createElement("div");
  stockNote.className="stock-inline-note";
  stockNote.dataset.stockNote=normalizeId(product.id);
  const currentQty=cart[normalizeId(product.id)]?.quantity||0;
  if(shouldShowStockLimit(product,currentQty))stockNote.textContent=stockLimitMessage(product);
  const bottom=document.createElement("div");bottom.className="product-bottom";
  const price=document.createElement("div");price.className="product-price";price.textContent=formatMoney(product.price);
  const controls=document.createElement("div");controls.className="add-controls";controls.dataset.productId=normalizeId(product.id);
  renderProductControls(controls,product);
  bottom.append(price,controls);
  body.append(n,d,closed,stockNote,bottom);
  card.append(wrap,body);
  return card;
}

function renderProductControls(controls,product){
  controls.innerHTML="";
  const key=normalizeId(product.id),q=cart[key]?.quantity||0;
  const storeOpen=isStoreOpen();
  const atStockLimit=isStockTracked(product)&&q>=stockCount(product);
  const make=(txt,action,disabled=false)=>{
    const b=document.createElement("button");b.type="button";b.textContent=txt;b.disabled=disabled;
    if(action){b.dataset.cartAction=action;b.dataset.productId=key}
    return b;
  };
  if(!isAvailable(product)||!storeOpen){controls.appendChild(make("+",null,true));return}
  if(q<=0){controls.appendChild(make("+","add"));return}
  const qty=document.createElement("span");qty.className="quantity";qty.textContent=q;
  controls.append(make("−","minus"),qty,make("+","add",atStockLimit));
}

function addToCart(id){
  if(blockClosedAction())return;
  const k=normalizeId(id),p=findProductById(k);
  if(!p||!isAvailable(p))return;
  const current=cart[k]?.quantity||0;
  if(isStockTracked(p)&&current>=stockCount(p)){alert(stockLimitMessage(p));return}
  cart[k]={product:p,quantity:current+1};
  updateCart();saveCheckoutState();
}
function changeQuantity(id,amount){
  if(blockClosedAction())return;
  const k=normalizeId(id),p=findProductById(k);
  if(!p)return;
  const next=(cart[k]?.quantity||0)+Number(amount);
  if(next<=0)delete cart[k];
  else{
    if(isStockTracked(p)&&next>stockCount(p)){alert(stockLimitMessage(p));return}
    cart[k]={product:p,quantity:next};
  }
  updateCart();saveCheckoutState();
}
document.getElementById("menu").addEventListener("click",e=>{const b=e.target.closest("[data-cart-action]");if(!b)return;b.dataset.cartAction==="add"?addToCart(b.dataset.productId):changeQuantity(b.dataset.productId,-1)});
document.getElementById("cartItems").addEventListener("click",e=>{const b=e.target.closest("[data-cart-action]");if(!b)return;b.dataset.cartAction==="add"?addToCart(b.dataset.productId):changeQuantity(b.dataset.productId,-1)});
function updateProductCard(id){
  const card=[...document.querySelectorAll(".product[data-product-id]")].find(x=>x.dataset.productId===normalizeId(id));
  if(!card)return;
  const p=findProductById(id),controls=card.querySelector(".add-controls"),stockNote=card.querySelector(".stock-inline-note");
  card.classList.toggle("store-closed",!isStoreOpen());
  if(p&&controls)renderProductControls(controls,p);
  if(p&&stockNote){
    const q=cart[normalizeId(id)]?.quantity||0;
    stockNote.textContent=shouldShowStockLimit(p,q)?stockLimitMessage(p):"";
  }
}
function updateCart(){
  const items=Object.values(cart),container=document.getElementById("cartItems");
  container.innerHTML="";
  let productsTotal=0,count=0;
  if(!items.length){const e=document.createElement("div");e.className="cart-empty";e.textContent="Tu carrito está vacío.";container.appendChild(e)}
  items.forEach(item=>{
    const price=Number(item.product.price||0),subtotal=price*item.quantity;
    productsTotal+=subtotal;count+=item.quantity;
    const row=document.createElement("div");row.className="cart-item";
    const info=document.createElement("div");info.className="cart-item-info";
    const n=document.createElement("div");n.className="cart-item-name";n.textContent=item.product.name||"";
    const p=document.createElement("div");p.className="cart-item-price";p.textContent=`${item.quantity} × ${formatMoney(price)} = ${formatMoney(subtotal)}`;
    info.append(n,p);
    if(shouldShowStockLimit(item.product,item.quantity)){
      const stockInfo=document.createElement("div");
      stockInfo.className="cart-stock-note";
      stockInfo.textContent=stockLimitMessage(item.product);
      info.appendChild(stockInfo);
    }
    const ctr=document.createElement("div");ctr.className="qty-controls";
    const minus=document.createElement("button"),plus=document.createElement("button"),qty=document.createElement("strong");
    minus.type=plus.type="button";minus.textContent="−";plus.textContent="+";qty.textContent=item.quantity;
    minus.dataset.cartAction="minus";plus.dataset.cartAction="add";
    minus.dataset.productId=plus.dataset.productId=normalizeId(item.product.id);
    minus.disabled=!isStoreOpen();
    plus.disabled=!isStoreOpen()||!isAvailable(item.product)||(isStockTracked(item.product)&&item.quantity>=stockCount(item.product));
    if(isStockTracked(item.product)&&item.quantity>=stockCount(item.product))plus.title=stockLimitMessage(item.product);
    ctr.append(minus,qty,plus);row.append(info,ctr);container.appendChild(row);
  });
  const delivery=getAppliedDeliveryFee(),total=productsTotal+delivery;
  document.getElementById("cartProductsTotal").textContent=formatMoney(productsTotal);
  document.getElementById("cartDeliveryFee").textContent=formatMoney(delivery);
  document.getElementById("cartTotal").textContent=formatMoney(total);
  document.getElementById("cartCount").textContent=count;
  products.forEach(p=>updateProductCard(p.id));
}

function openProofWhatsApp(){
  if(blockClosedAction())return;
  saveCheckoutState();
  const whatsapp=normalizePhone(settings.whatsapp);
  if(!whatsapp){alert("El WhatsApp del negocio todavía no está configurado.");return}
  const name=customerName.value.trim();
  const text=`Hola, soy ${name||"cliente de PasteHot"}. Te envío mi comprobante de transferencia${name?", a nombre de "+name:""}.`;
  window.open(`https://wa.me/${whatsapp}?text=${encodeURIComponent(text)}`,"_blank");
}
function updatePaymentUI(){
  const panel=document.getElementById("transferPanel");
  const transfer=document.getElementById("paymentMethod").value==="transfer";
  if(!transfer){panel.classList.remove("show");panel.innerHTML="";saveCheckoutState();return}
  const bankRows=[
    bankRow("Banco",settings.bank_name||""),
    bankRow("Titular",settings.bank_holder||""),
    bankRow("Número de tarjeta",settings.bank_card||""),
    bankRow("CLABE",settings.bank_clabe||"")
  ].filter(Boolean).join("");
  panel.innerHTML=`
    <div class="transfer-title">🏦 Transferencia bancaria</div>
    <p class="transfer-intro">Copia los datos, realiza la transferencia en tu aplicación bancaria y vuelve a este menú para finalizar el pedido.</p>
    <div class="bank-data">${bankRows||'<div style="color:#777">Los datos bancarios todavía no están configurados.</div>'}</div>
    <div class="transfer-steps"><strong>Orden recomendado</strong><ol><li>Deja tu carrito preparado.</li><li>Copia la CLABE o tarjeta y realiza la transferencia.</li><li>Regresa a esta pestaña: tu carrito y tus datos permanecerán guardados.</li><li>Presiona <strong>Enviar pedido por WhatsApp</strong> para enviar el pedido.</li><li>Después, envía la captura o comprobante por WhatsApp.</li></ol></div>
    <div class="transfer-safety">Tu carrito y los datos escritos se guardan temporalmente en este dispositivo para que no se pierdan al cambiar a tu app bancaria.</div>
    <div class="transfer-proof"><button class="transfer-whatsapp secondary" id="proofWhatsappButton" type="button">📎 Enviar comprobante por WhatsApp</button></div>`;
  panel.classList.add("show");
  panel.querySelectorAll("[data-copy-value]").forEach(btn=>btn.addEventListener("click",()=>copyBankValue(btn.dataset.copyValue,btn)));
  document.getElementById("proofWhatsappButton")?.addEventListener("click",openProofWhatsApp);
  saveCheckoutState();
}
document.getElementById("paymentMethod").addEventListener("change",updatePaymentUI);
document.getElementById("cartButton").onclick=()=>{document.getElementById("cartPanel").classList.add("open");updateCart()};
document.getElementById("closeCartButton").onclick=()=>document.getElementById("cartPanel").classList.remove("open");
document.getElementById("cartPanel").addEventListener("click",e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove("open")});
["customerName","customerPhone","address","orderNotes"].forEach(id=>{
  document.getElementById(id)?.addEventListener("input",saveCheckoutState);
});
window.addEventListener("pagehide",saveCheckoutState);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")saveCheckoutState()});


function openImageLightbox(src,name){
  if(!src)return;
  imageLightboxImg.src=src;
  imageLightboxImg.alt=name||"Producto";
  imageLightboxCaption.textContent=name||"";
  imageLightbox.classList.add("open");
  document.body.style.overflow="hidden";
}
function closeImageLightbox(){
  imageLightbox.classList.remove("open");
  imageLightboxImg.src="";
  document.body.style.overflow="";
}
imageLightboxClose.addEventListener("click",closeImageLightbox);
imageLightbox.addEventListener("click",e=>{if(e.target===imageLightbox)closeImageLightbox()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&imageLightbox.classList.contains("open"))closeImageLightbox()});


function showOrderMessage(text,type){const el=document.getElementById("orderStatusMessage");el.className=`order-status-message show ${type}`;el.textContent=text}
function orderItemsPayload(){return Object.values(cart).map(i=>({product_id:i.product.id,quantity:i.quantity}))}
function generateOrderCode(){const now=new Date(),stamp=now.toISOString().replace(/\D/g,"").slice(2,12);return `PJ-${stamp}-${Math.random().toString(36).slice(2,6).toUpperCase()}`}
async function sendOrder(){
  if(blockClosedAction())return;
  const items=Object.values(cart);
  if(!items.length){alert("Agrega al menos un producto.");return}

  const name=document.getElementById("customerName").value.trim();
  const phone=document.getElementById("customerPhone").value.trim();
  const deliveryType=getDeliveryType();
  const address=document.getElementById("address").value.trim();
  const payment=document.getElementById("paymentMethod").value;
  const notes=document.getElementById("orderNotes").value.trim();

  if(!name){alert("Escribe tu nombre.");return}
  if(!phone){alert("Escribe tu teléfono.");return}
  if(deliveryType==="delivery"&&!address){alert("Escribe la dirección de entrega.");return}

  const whatsapp=normalizePhone(settings.whatsapp);
  if(!whatsapp){alert("El número de WhatsApp todavía no está configurado.");return}

  const itemPayload=orderItemsPayload();
  const orderCode=generateOrderCode();
  const business=settings.business_name||"PasteHot";
  const button=document.getElementById("whatsappButton");
  button.disabled=true;
  button.textContent="Verificando existencias…";
  showOrderMessage("Comprobando disponibilidad antes de registrar tu pedido…","warn");

  let confirmed;
  try{
    const {data,error}=await db.rpc("create_order_with_inventory",{
      p_order_code:orderCode,
      p_customer_name:name,
      p_customer_phone:normalizePhone(phone),
      p_delivery_type:deliveryType,
      p_address:deliveryType==="delivery"?address:"",
      p_payment_method:payment,
      p_notes:notes,
      p_items:itemPayload
    });

    if(error){
      console.error("No se pudo registrar el pedido:",error);
      const raw=String(error.message||"");
      const marker=raw.indexOf("STOCK_INSUFICIENTE|");
      if(marker>=0){
        const parts=raw.slice(marker).split("|");
        const productName=parts[1]||"Ese producto";
        const available=Number(parts[2]);
        const requested=Number(parts[3]);
        const msg=Number.isFinite(available)
          ? `${productName}: ${available===1?"solo queda 1 disponible":`solo quedan ${available} disponibles`}${Number.isFinite(requested)?` y pediste ${requested}`:""}. Ajusta tu carrito.`
          : "Ya no hay suficientes existencias para completar el pedido. Ajusta tu carrito.";
        showOrderMessage(msg,"warn");
        alert(msg);
      }else{
        const msg=raw.includes("no está disponible")?raw:"No pudimos registrar el pedido. No se descontó inventario. Intenta de nuevo.";
        showOrderMessage(msg,"warn");
        alert(msg);
      }
      await reloadProducts();
      return;
    }

    confirmed=data||{};
    localStorage.setItem("pastehot_last_order",confirmed.order_code||orderCode);
    showOrderMessage(`Pedido ${confirmed.order_code||orderCode} registrado. Abriendo WhatsApp…`,"ok");
  }catch(error){
    console.error("Error inesperado al registrar pedido:",error);
    showOrderMessage("Hubo un problema registrando el pedido. No se descontó inventario. Intenta de nuevo.","warn");
    alert("Hubo un problema registrando el pedido. No se enviará por WhatsApp hasta que quede registrado.");
    return;
  }finally{
    button.disabled=false;
    button.textContent="📲 Enviar pedido por WhatsApp";
  }

  const confirmedItems=Array.isArray(confirmed?.items)?confirmed.items:[];
  const subtotal=Number(confirmed?.subtotal||0);
  const deliveryFee=Number(confirmed?.delivery_fee||0);
  const total=Number(confirmed?.total||0);
  const finalCode=confirmed?.order_code||orderCode;

  let message=`*NUEVO PEDIDO ${business.toUpperCase()}*\n*Pedido:* ${finalCode}\n\n*Cliente:* ${name}\n*Teléfono:* ${phone}\n*Modalidad:* ${deliveryType==="delivery"?"Envío a domicilio":"Pasar a recoger"}\n`;
  if(deliveryType==="delivery")message+=`*Dirección:* ${address}\n`;
  message+="\n*PRODUCTOS*\n";
  confirmedItems.forEach(i=>message+=`${i.quantity} x ${i.name} — ${formatMoney(i.subtotal)}\n`);
  message+=`\n*Subtotal:* ${formatMoney(subtotal)}\n*Envío:* ${formatMoney(deliveryFee)}\n*TOTAL:* ${formatMoney(total)}\n*Pago:* ${payment==="transfer"?"Transferencia":"Efectivo"}\n`;
  if(notes)message+=`*Notas:* ${notes}\n`;

  cart={};
  saveCheckoutState();
  await reloadProducts();

  const url=`https://wa.me/${whatsapp}?text=${encodeURIComponent(message)}`;
  window.location.href=url;
}
document.getElementById("whatsappButton").addEventListener("click",sendOrder);
init();
</script>

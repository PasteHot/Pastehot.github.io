<!DOCTYPE html>
<html lang="es-MX">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Menú</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

:root{
  --red:#d71920;
  --red-dark:#ad1117;
  --text:#171717;
  --muted:#70757a;
  --bg:#f5f5f5;
  --card:#fff;
  --border:#e5e5e5;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

/* =====================================================
   HEADER
===================================================== */

.hero{
  width:100%;
  aspect-ratio:16 / 9;
  min-height:210px;
  position:relative;
  overflow:hidden;
  background:#e8e8e8;
}

.hero-cover{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

.hero-profile{
  position:absolute;
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:50%;
  border:6px solid white;
  box-shadow:
    0 12px 35px rgba(0,0,0,.28);

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);
}

.hero-empty{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#777;
  font-weight:700;
}

/* =====================================================
   CATEGORY BAR
===================================================== */

.category-bar{
  position:sticky;
  top:0;
  z-index:50;

  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);

  border-bottom:1px solid var(--border);

  overflow-x:auto;

  display:flex;
  gap:7px;

  padding:12px 16px;

  scrollbar-width:none;
}

.category-bar::-webkit-scrollbar{
  display:none;
}

.category-button{
  flex:none;

  border:0;

  padding:10px 16px;

  border-radius:999px;

  background:#f0f1f2;

  color:#333;

  font-weight:800;

  cursor:pointer;

  transition:.18s;
}

.category-button:hover{
  background:#e6e7e8;
}

.category-button.active{
  background:#111;
  color:white;
}

/* =====================================================
   MAIN
===================================================== */

main{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:25px 18px 110px;
}

.category-section{
  margin-bottom:45px;
}

.category-title{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.category-title h2{
  margin:0;
  font-size:25px;
}

.category-title-line{
  height:3px;
  width:35px;
  background:var(--red);
  border-radius:20px;
}

/* =====================================================
   PRODUCTS
===================================================== */

.products-grid{
  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:18px;
}

.product{
  background:var(--card);

  border-radius:18px;

  overflow:hidden;

  border:1px solid var(--border);

  box-shadow:
    0 7px 25px rgba(0,0,0,.06);

  transition:
    transform .2s,
    box-shadow .2s;

  position:relative;
}

.product:hover{
  transform:translateY(-3px);

  box-shadow:
    0 14px 35px rgba(0,0,0,.10);
}

.product-image-wrap{
  position:relative;
  aspect-ratio:1 / 1;
  overflow:hidden;
  background:#eee;
}

.product-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.product-body{
  padding:16px;
}

.product-name{
  font-size:18px;
  font-weight:900;
  margin-bottom:6px;
}

.product-description{
  color:var(--muted);
  font-size:14px;
  line-height:1.4;
  min-height:39px;
}

.product-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:14px;
}

.product-price{
  font-size:20px;
  font-weight:900;
}

.add-button{
  border:0;

  background:var(--red);

  color:white;

  width:43px;
  height:43px;

  border-radius:50%;

  font-size:25px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}

.add-button:hover{
  background:var(--red-dark);
}

/* =====================================================
   AGOTADO
   IMPORTANTE:
   NO se aplica opacity al elemento padre.
   Así AGOTADO permanece completamente visible.
===================================================== */

.product.soldout .product-image{
  opacity:.38;
  filter:grayscale(.6);
}

.product.soldout .product-body{
  opacity:.42;
}

.product.soldout .add-button{
  opacity:.35;
}

.soldout-label{
  position:absolute;

  left:12px;
  right:12px;
  bottom:12px;

  background:#d71920;

  color:white;

  text-align:center;

  font-weight:900;

  font-size:14px;

  letter-spacing:.7px;

  padding:9px 10px;

  border-radius:8px;

  z-index:5;

  opacity:1 !important;

  filter:none !important;

  box-shadow:
    0 5px 15px rgba(0,0,0,.25);
}

/* =====================================================
   EMPTY
===================================================== */

.empty-category{
  background:white;
  border:1px dashed #ccc;
  border-radius:14px;
  padding:25px;
  color:#777;
}

/* =====================================================
   CART
===================================================== */

.cart-button{
  position:fixed;

  right:20px;
  bottom:20px;

  width:64px;
  height:64px;

  border:0;

  border-radius:50%;

  background:#111;

  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:29px;

  box-shadow:
    0 12px 35px rgba(0,0,0,.25);

  z-index:100;
}

.cart-count{
  position:absolute;

  right:-2px;
  top:-2px;

  width:24px;
  height:24px;

  border-radius:50%;

  background:var(--red);

  color:white;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:12px;
  font-weight:900;
}

/* =====================================================
   CART PANEL
===================================================== */

.cart-overlay{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.45);

  z-index:200;

  display:none;
}

.cart-overlay.show{
  display:block;
}

.cart-panel{
  position:absolute;

  right:0;
  top:0;

  height:100%;

  width:min(460px,100%);

  background:white;

  box-shadow:
    -15px 0 45px rgba(0,0,0,.18);

  display:flex;
  flex-direction:column;
}

.cart-head{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:20px;

  border-bottom:1px solid var(--border);
}

.cart-head h2{
  margin:0;
}

.cart-close{
  width:38px;
  height:38px;

  border:0;

  border-radius:50%;

  background:#eee;

  font-size:20px;
}

.cart-items{
  flex:1;
  overflow:auto;
  padding:18px;
}

.cart-item{
  display:grid;
  grid-template-columns:65px 1fr auto;
  gap:12px;

  padding:12px 0;

  border-bottom:1px solid #eee;
}

.cart-item-image{
  width:65px;
  height:65px;
  border-radius:10px;
  object-fit:cover;
}

.cart-item-name{
  font-weight:800;
}

.cart-item-price{
  color:#666;
  font-size:14px;
  margin-top:5px;
}

.qty{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:8px;
}

.qty button{
  border:0;
  background:#eee;
  width:28px;
  height:28px;
  border-radius:7px;
}

.cart-summary{
  border-top:1px solid var(--border);
  padding:18px;
}

.summary-line{
  display:flex;
  justify-content:space-between;
  margin-bottom:9px;
}

.summary-total{
  font-size:22px;
  font-weight:900;
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #ddd;
}

.checkout-button{
  width:100%;

  border:0;

  border-radius:11px;

  padding:15px;

  background:#25d366;

  color:white;

  font-weight:900;

  font-size:16px;

  margin-top:15px;
}

/* =====================================================
   CHECKOUT
===================================================== */

.checkout{
  margin-top:20px;
  display:none;
}

.checkout.show{
  display:block;
}

.checkout h3{
  margin:0 0 15px;
}

.checkout-group{
  margin-bottom:12px;
}

.checkout-group label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:5px;
}

.checkout input,
.checkout textarea,
.checkout select{
  width:100%;
  border:1px solid #ddd;
  border-radius:9px;
  padding:11px;
  font:inherit;
}

.checkout textarea{
  min-height:70px;
  resize:vertical;
}

.delivery-option{
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  margin-bottom:8px;
  cursor:pointer;
}

.delivery-option.active{
  border-color:#111;
  background:#f5f5f5;
}

.extra-cost{
  color:#777;
  font-size:12px;
  margin-left:4px;
}

/* =====================================================
   PAYMENT
===================================================== */

.payment-panel{
  margin-top:12px;

  background:#f6f6f6;

  border-radius:10px;

  padding:13px;

  display:none;
}

.payment-panel.show{
  display:block;
}

.payment-row{
  margin-bottom:6px;
  font-size:14px;
}

.payment-row strong{
  display:inline-block;
  min-width:105px;
}

/* =====================================================
   WHATSAPP
===================================================== */

.whatsapp-icon{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  width:22px;
  height:22px;

  border-radius:50%;

  background:white;

  color:#25d366;

  margin-right:7px;

  font-size:14px;
  font-weight:900;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1000px){

  .products-grid{
    grid-template-columns:
      repeat(3,minmax(0,1fr));
  }

}

@media(max-width:700px){

  .hero{
    min-height:200px;
  }

  .hero-profile{
    width:105px;
    height:105px;
    border-width:4px;
  }

  main{
    padding:
      20px
      12px
      100px;
  }

  .products-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:12px;
  }

  .product{
    border-radius:14px;
  }

  .product-body{
    padding:12px;
  }

  .product-name{
    font-size:16px;
  }

  .product-description{
    font-size:13px;
    min-height:36px;
  }

  .product-price{
    font-size:18px;
  }

  .add-button{
    width:38px;
    height:38px;
    font-size:22px;
  }

  .category-title h2{
    font-size:21px;
  }

  .cart-button{
    right:15px;
    bottom:15px;
  }

}

@media(max-width:390px){

  .products-grid{
    gap:9px;
  }

  .product-body{
    padding:10px;
  }

  .product-name{
    font-size:15px;
  }

  .product-description{
    font-size:12px;
  }

}

</style>

</head>

<body>


<!-- =====================================================
     HERO
===================================================== -->

<header class="hero" id="hero">

  <img
    id="heroCover"
    class="hero-cover hidden"
  >

  <div
    id="heroEmpty"
    class="hero-empty">
  </div>

  <img
    id="heroProfile"
    class="hero-profile hidden"
  >

</header>


<!-- =====================================================
     CATEGORIES
===================================================== -->

<nav
  id="categoryBar"
  class="category-bar">
</nav>


<!-- =====================================================
     PRODUCTS
===================================================== -->

<main id="menu"></main>


<!-- =====================================================
     CART BUTTON
===================================================== -->

<button
  class="cart-button"
  onclick="openCart()"
  aria-label="Carrito">

  🛒

  <span
    id="cartCount"
    class="cart-count">
    0
  </span>

</button>


<!-- =====================================================
     CART
===================================================== -->

<div
  id="cartOverlay"
  class="cart-overlay"
  onclick="closeCartOutside(event)">

  <aside class="cart-panel">

    <div class="cart-head">

      <h2>Tu pedido</h2>

      <button
        class="cart-close"
        onclick="closeCart()">
        ×
      </button>

    </div>


    <div
      id="cartItems"
      class="cart-items">
    </div>


    <div class="cart-summary">

      <div class="summary-line">
        <span>Subtotal</span>
        <strong id="cartSubtotal">$0.00</strong>
      </div>

      <div class="summary-line">
        <span>Entrega</span>
        <strong id="cartDelivery">$0.00</strong>
      </div>

      <div class="summary-total">
        <div class="summary-line">
          <span>Total</span>
          <strong id="cartTotal">$0.00</strong>
        </div>
      </div>


      <button
        class="checkout-button"
        onclick="showCheckout()">

        <span class="whatsapp-icon">✓</span>
        Pedir por WhatsApp

      </button>


      <div
        id="checkout"
        class="checkout">

        <h3>Datos del pedido</h3>

        <div class="checkout-group">
          <label>Nombre</label>
          <input id="customerName">
        </div>

        <div class="checkout-group">
          <label>Teléfono</label>
          <input id="customerPhone">
        </div>


        <div class="checkout-group">

          <label>Entrega</label>

          <div
            id="deliveryOption"
            class="delivery-option active"
            onclick="setDeliveryType('delivery')">

            🚚 Entrega a domicilio
            <span class="extra-cost">
              costo extra
            </span>

          </div>

          <div
            id="pickupOption"
            class="delivery-option"
            onclick="setDeliveryType('pickup')">

            📍 Recoger en PasteHot

          </div>

        </div>


        <div
          id="addressGroup"
          class="checkout-group">

          <label>Dirección</label>

          <textarea
            id="customerAddress"
            placeholder="Calle, número, fraccionamiento y referencias">
          </textarea>

        </div>


        <div
          id="pickupMap"
          class="checkout-group"
          style="display:none">

          <a
            id="pickupMapLink"
            href="#"
            target="_blank"
            style="
              display:block;
              background:#111;
              color:white;
              padding:12px;
              border-radius:9px;
              text-align:center;
              text-decoration:none;
              font-weight:800;
            ">
            📍 Ver ubicación en Google Maps
          </a>

        </div>


        <div class="checkout-group">

          <label>Método de pago</label>

          <select
            id="paymentMethod"
            onchange="updatePaymentPanel()">

            <option value="efectivo">
              Efectivo
            </option>

            <option value="transferencia">
              Transferencia
            </option>

          </select>

        </div>


        <div
          id="transferPanel"
          class="payment-panel">

          <div class="payment-row">
            <strong>Banco:</strong>
            <span id="bankName"></span>
          </div>

          <div class="payment-row">
            <strong>Beneficiario:</strong>
            <span id="bankHolder"></span>
          </div>

          <div class="payment-row">
            <strong>CLABE:</strong>
            <span id="bankClabe"></span>
          </div>

          <div class="payment-row">
            <strong>Tarjeta:</strong>
            <span id="bankCard"></span>
          </div>

        </div>


        <div class="checkout-group">

          <label>Notas</label>

          <textarea
            id="orderNotes"
            placeholder="Alguna indicación para tu pedido">
          </textarea>

        </div>


        <button
          class="checkout-button"
          onclick="sendWhatsAppOrder()">

          <span class="whatsapp-icon">✓</span>
          Confirmar pedido por WhatsApp

        </button>

      </div>

    </div>

  </aside>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://cqlywpemisknrxswlmea.supabase.co";

/*
  EL ANON KEY ES EL MISMO DE TU PROYECTO SUPABASE.
*/
const SUPABASE_ANON_KEY =
  "PEGA_AQUI_TU_ANON_KEY";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   VARIABLES
===================================================== */

let products=[];
let settings={};

let cart=[];

let deliveryType="delivery";


/* =====================================================
   INIT
===================================================== */

async function init(){

  await Promise.all([
    loadSettings(),
    loadProducts()
  ]);

  renderCategories();
  renderMenu();
  applyDesign();
  updatePaymentData();
}


/* =====================================================
   SETTINGS
===================================================== */

async function loadSettings(){

  const {data,error} =
    await db
      .from("settings")
      .select("key,value");

  if(error){

    console.error(error);
    return;
  }

  settings={};

  (data||[]).forEach(row=>{
    settings[row.key]=row.value;
  });
}


/* =====================================================
   PRODUCTS
===================================================== */

async function loadProducts(){

  const {data,error} =
    await db
      .from("products")
      .select("*")
      .order("sort_order",{ascending:true})
      .order("created_at",{ascending:true});

  if(error){

    console.error(error);

    return;
  }

  products=data||[];
}


/* =====================================================
   DESIGN
===================================================== */

function applyDesign(){

  const hero =
    document.getElementById("hero");

  const cover =
    document.getElementById("heroCover");

  const empty =
    document.getElementById("heroEmpty");

  const profile =
    document.getElementById("heroProfile");


  /* BACKGROUND */

  const bgType =
    settings.background_type || "color";

  if(
    bgType==="image" &&
    settings.background_image
  ){

    document.body.style.backgroundImage =
      `url("${settings.background_image}")`;

    document.body.style.backgroundSize =
      "cover";

    document.body.style.backgroundAttachment =
      "fixed";

  }else{

    document.body.style.backgroundImage =
      "none";

    document.body.style.backgroundColor =
      settings.background_color ||
      "#f5f5f5";
  }


  /* COVER */

  if(settings.cover_image){

    cover.src =
      settings.cover_image;

    cover.classList.remove("hidden");

    empty.classList.add("hidden");

    const x =
      Number(settings.cover_x || 0);

    const y =
      Number(settings.cover_y || 0);

    const scale =
      Number(settings.cover_scale || 1);

    cover.style.left =
      `calc(50% + ${x}%)`;

    cover.style.top =
      `calc(50% + ${y}%)`;

    cover.style.transform =
      `translate(-50%,-50%) scale(${scale})`;

  }else{

    cover.classList.add("hidden");
    empty.classList.remove("hidden");
  }


  /* PROFILE */

  if(settings.profile_image){

    profile.src =
      settings.profile_image;

    profile.classList.remove("hidden");

    const x =
      Number(settings.profile_x || 0);

    const y =
      Number(settings.profile_y || 0);

    const scale =
      Number(settings.profile_scale || 1);

    profile.style.left =
      `calc(50% + ${x}%)`;

    profile.style.top =
      `calc(50% + ${y}%)`;

    profile.style.transform =
      `translate(-50%,-50%) scale(${scale})`;

  }else{

    profile.classList.add("hidden");
  }
}


/* =====================================================
   CATEGORIES
===================================================== */

function renderCategories(){

  const bar =
    document.getElementById("categoryBar");

  const categories =
    [...new Set(
      products
        .map(p=>p.category)
        .filter(Boolean)
    )];

  if(!categories.length){

    bar.style.display="none";

    return;
  }

  bar.style.display="flex";

  bar.innerHTML =
    categories.map((category,index)=>`

      <button
        class="category-button ${index===0 ? "active":""}"
        onclick="scrollToCategory('${encodeURIComponent(category)}',this)">

        ${escapeHtml(category)}

      </button>

    `).join("");
}


function scrollToCategory(encoded,button){

  const category =
    decodeURIComponent(encoded);

  document
    .querySelectorAll(".category-button")
    .forEach(b=>b.classList.remove("active"));

  button.classList.add("active");

  const element =
    document.getElementById(
      "category-"+slug(category)
    );

  if(element){

    const y =
      element.getBoundingClientRect().top +
      window.scrollY -
      65;

    window.scrollTo({
      top:y,
      behavior:"smooth"
    });
  }
}


/* =====================================================
   MENU
===================================================== */

function renderMenu(){

  const menu =
    document.getElementById("menu");

  const categories =
    [...new Set(
      products
        .map(p=>p.category)
        .filter(Boolean)
    )];

  menu.innerHTML =
    categories.map(category=>{

      const items =
        products.filter(
          p=>p.category===category
        );

      return `

        <section
          id="category-${slug(category)}"
          class="category-section">

          <div class="category-title">

            <div class="category-title-line"></div>

            <h2>
              ${escapeHtml(category)}
            </h2>

          </div>

          <div class="products-grid">

            ${items.map(renderProduct).join("")}

          </div>

        </section>

      `;

    }).join("");
}


function renderProduct(p){

  const image =
    p.image_url ||
    "https://via.placeholder.com/600x600?text=Producto";

  const soldout =
    !p.available;

  return `

    <article
      class="product ${soldout ? "soldout":""}">

      <div class="product-image-wrap">

        <img
          class="product-image"
          src="${escapeAttr(image)}"
          loading="lazy"
          onerror="this.src='https://via.placeholder.com/600x600?text=Producto'"
        >

        ${
          soldout
          ?
          `
            <div class="soldout-label">
              AGOTADO
            </div>
          `
          :
          ""
        }

      </div>


      <div class="product-body">

        <div class="product-name">
          ${escapeHtml(p.name)}
        </div>

        <div class="product-description">
          ${escapeHtml(p.description || "")}
        </div>


        <div class="product-bottom">

          <div class="product-price">
            $${Number(p.price || 0).toFixed(2)}
          </div>

          ${
            soldout
            ?
            ""
            :
            `
              <button
                class="add-button"
                onclick="addToCart('${p.id}')"
                aria-label="Agregar">

                +

              </button>
            `
          }

        </div>

      </div>

    </article>

  `;
}


/* =====================================================
   CART
===================================================== */

function addToCart(id){

  const product =
    products.find(p=>p.id===id);

  if(!product || !product.available){
    return;
  }

  const existing =
    cart.find(i=>i.id===id);

  if(existing){

    existing.quantity++;

  }else{

    cart.push({
      id:product.id,
      name:product.name,
      price:Number(product.price),
      image:product.image_url,
      quantity:1
    });
  }

  updateCart();
  openCart();
}


function changeQuantity(id,change){

  const item =
    cart.find(i=>i.id===id);

  if(!item){
    return;
  }

  item.quantity += change;

  if(item.quantity<=0){

    cart =
      cart.filter(
        i=>i.id!==id
      );
  }

  updateCart();
}


function cartSubtotal(){

  return cart.reduce(
    (sum,item)=>
      sum + item.price*item.quantity,
    0
  );
}


function updateCart(){

  const count =
    cart.reduce(
      (sum,item)=>
        sum+item.quantity,
      0
    );

  document.getElementById(
    "cartCount"
  ).textContent=count;


  const subtotal =
    cartSubtotal();

  const delivery =
    deliveryType==="delivery"
      ?
      Number(settings.delivery_cost || 0)
      :
      0;

  document.getElementById(
    "cartSubtotal"
  ).textContent =
    money(subtotal);

  document.getElementById(
    "cartDelivery"
  ).textContent =
    delivery
      ?
      money(delivery)
      :
      "$0.00";

  document.getElementById(
    "cartTotal"
  ).textContent =
    money(subtotal+delivery);


  const container =
    document.getElementById("cartItems");

  if(!cart.length){

    container.innerHTML =
      `
        <div style="
          text-align:center;
          padding:40px 15px;
          color:#777;
        ">
          <div style="font-size:45px">🛒</div>
          <p>Tu carrito está vacío.</p>
        </div>
      `;

    return;
  }


  container.innerHTML =
    cart.map(item=>`

      <div class="cart-item">

        <img
          class="cart-item-image"
          src="${escapeAttr(item.image || "")}"
        >

        <div>

          <div class="cart-item-name">
            ${escapeHtml(item.name)}
          </div>

          <div class="cart-item-price">
            ${money(item.price)}
          </div>

          <div class="qty">

            <button
              onclick="changeQuantity('${item.id}',-1)">
              −
            </button>

            <strong>
              ${item.quantity}
            </strong>

            <button
              onclick="changeQuantity('${item.id}',1)">
              +
            </button>

          </div>

        </div>

        <strong>
          ${money(item.price*item.quantity)}
        </strong>

      </div>

    `).join("");
}


function openCart(){

  document
    .getElementById("cartOverlay")
    .classList.add("show");

  updateCart();
}


function closeCart(){

  document
    .getElementById("cartOverlay")
    .classList.remove("show");
}


function closeCartOutside(event){

  if(event.target.id==="cartOverlay"){
    closeCart();
  }
}


/* =====================================================
   CHECKOUT
===================================================== */

function showCheckout(){

  if(!cart.length){

    alert("Agrega al menos un producto.");

    return;
  }

  document
    .getElementById("checkout")
    .classList.add("show");
}


function setDeliveryType(type){

  deliveryType=type;

  document
    .getElementById("deliveryOption")
    .classList.toggle(
      "active",
      type==="delivery"
    );

  document
    .getElementById("pickupOption")
    .classList.toggle(
      "active",
      type==="pickup"
    );


  document
    .getElementById("addressGroup")
    .style.display =
      type==="delivery"
      ?
      "block"
      :
      "none";


  document
    .getElementById("pickupMap")
    .style.display =
      type==="pickup"
      ?
      "block"
      :
      "none";


  const mapUrl =
    settings.pickup_maps_url || "";

  document
    .getElementById("pickupMapLink")
    .href =
      mapUrl || "#";


  updateCart();
}


function updatePaymentPanel(){

  const method =
    document.getElementById(
      "paymentMethod"
    ).value;

  document
    .getElementById("transferPanel")
    .classList.toggle(
      "show",
      method==="transferencia"
    );
}


function updatePaymentData(){

  document.getElementById(
    "bankName"
  ).textContent =
    settings.bank_name || "";

  document.getElementById(
    "bankHolder"
  ).textContent =
    settings.bank_holder || "";

  document.getElementById(
    "bankClabe"
  ).textContent =
    settings.bank_clabe || "";

  document.getElementById(
    "bankCard"
  ).textContent =
    settings.bank_card || "";
}


/* =====================================================
   WHATSAPP
===================================================== */

function sendWhatsAppOrder(){

  if(!cart.length){

    alert("Tu carrito está vacío.");

    return;
  }


  const name =
    document
      .getElementById("customerName")
      .value
      .trim();

  const phone =
    document
      .getElementById("customerPhone")
      .value
      .trim();

  const address =
    document
      .getElementById("customerAddress")
      .value
      .trim();

  const notes =
    document
      .getElementById("orderNotes")
      .value
      .trim();

  const payment =
    document
      .getElementById("paymentMethod")
      .value;


  if(!name){

    alert("Escribe tu nombre.");

    return;
  }


  if(!phone){

    alert("Escribe tu teléfono.");

    return;
  }


  if(
    deliveryType==="delivery" &&
    !address
  ){

    alert("Escribe la dirección de entrega.");

    return;
  }


  const subtotal =
    cartSubtotal();

  const delivery =
    deliveryType==="delivery"
      ?
      Number(settings.delivery_cost || 0)
      :
      0;

  const total =
    subtotal+delivery;


  let message =
    `*NUEVO PEDIDO*%0A%0A`;

  message +=
    `*Cliente:* ${encodeURIComponent(name)}%0A`;

  message +=
    `*Teléfono:* ${encodeURIComponent(phone)}%0A`;

  message +=
    `*Tipo:* ${
      deliveryType==="delivery"
      ?
      "Entrega a domicilio"
      :
      "Recoger"
    }%0A`;


  if(deliveryType==="delivery"){

    message +=
      `*Dirección:* ${encodeURIComponent(address)}%0A`;
  }


  message +=
    `*Pago:* ${encodeURIComponent(payment)}%0A%0A`;

  message +=
    `*PRODUCTOS*%0A`;


  cart.forEach(item=>{

    message +=
      `• ${item.quantity} x ${encodeURIComponent(item.name)} — ${money(item.price*item.quantity)}%0A`;

  });


  message += `%0A`;

  message +=
    `Subtotal: ${money(subtotal)}%0A`;

  message +=
    `Entrega: ${money(delivery)}%0A`;

  message +=
    `*TOTAL: ${money(total)}*%0A`;


  if(notes){

    message +=
      `%0A*Notas:* ${encodeURIComponent(notes)}%0A`;
  }


  const whatsapp =
    String(settings.whatsapp || "")
      .replace(/\D/g,"");


  if(!whatsapp){

    alert(
      "Configura el número de WhatsApp desde el administrador."
    );

    return;
  }


  const url =
    `https://wa.me/${whatsapp}?text=${message}`;

  window.open(
    url,
    "_blank"
  );
}


/* =====================================================
   HELPERS
===================================================== */

function money(value){

  return "$"+
    Number(value || 0)
      .toFixed(2);
}


function slug(value){

  return String(value)
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"");
}


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function escapeAttr(value){

  return escapeHtml(value);
}


/* =====================================================
   START
===================================================== */

init();

</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PasteHot</title>

<meta name="description" content="PasteHot - Saborea tu tiempo.">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    color:#222;
}

header{
    background:#c90000;
    color:white;
    text-align:center;
    padding:24px 15px;
}

.logo{
    font-size:38px;
    font-weight:900;
    letter-spacing:2px;
}

.slogan{
    margin-top:5px;
    font-size:16px;
}

.container{
    width:94%;
    max-width:1100px;
    margin:25px auto;
}

h2{
    margin-top:35px;
    margin-bottom:15px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
}

.product{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.10);
}

.product img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
    background:#ddd;
}

.product-info{
    padding:15px;
}

.product-name{
    font-size:19px;
    font-weight:bold;
    margin-bottom:6px;
}

.product-description{
    color:#666;
    font-size:14px;
    min-height:38px;
}

.product-price{
    font-size:20px;
    font-weight:bold;
    margin:12px 0;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 15px;
    cursor:pointer;
    font-weight:bold;
}

.add-button{
    width:100%;
    background:#c90000;
    color:white;
}

.add-button:hover{
    background:#a90000;
}

.cart{
    background:white;
    margin-top:35px;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.10);
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid #ddd;
}

.cart-controls{
    display:flex;
    align-items:center;
    gap:8px;
}

.small-button{
    padding:6px 10px;
    background:#ddd;
}

.total{
    text-align:right;
    font-size:24px;
    font-weight:bold;
    margin-top:20px;
}

.form{
    background:white;
    margin-top:25px;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.10);
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:6px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.order-button{
    width:100%;
    margin-top:20px;
    background:#25D366;
    color:white;
    font-size:18px;
}

.empty{
    color:#777;
    text-align:center;
    padding:20px;
}

.loading{
    text-align:center;
    padding:30px;
    font-size:18px;
}

.error{
    background:#ffe0e0;
    color:#900;
    padding:15px;
    border-radius:8px;
    margin:20px 0;
}

.hidden{
    display:none;
}

footer{
    text-align:center;
    padding:35px 15px;
    color:#777;
}

</style>
</head>

<body>

<header>

<div class="logo">PASTEHOT</div>

<div class="slogan">
Saborea tu tiempo.
</div>

</header>

<div class="container">

<div id="loading" class="loading">
Cargando menú...
</div>

<div id="error" class="error hidden"></div>

<div id="menu"></div>

<div class="cart">

<h2>Tu pedido</h2>

<div id="cartItems">
<div class="empty">
Tu carrito está vacío.
</div>
</div>

<div class="total">
Total: $<span id="cartTotal">0.00</span>
</div>

</div>

<div class="form">

<h2>Datos del pedido</h2>

<label for="customerName">
Nombre
</label>

<input
id="customerName"
type="text"
placeholder="Tu nombre"
>

<label for="customerPhone">
Teléfono / WhatsApp
</label>

<input
id="customerPhone"
type="tel"
placeholder="10 dígitos"
>

<label for="deliveryType">
¿Cómo quieres recibir tu pedido?
</label>

<select id="deliveryType">

<option value="delivery">
Envío a domicilio
</option>

<option value="pickup">
Recoger
</option>

</select>

<div id="addressContainer">

<label for="address">
Dirección
</label>

<textarea
id="address"
placeholder="Calle, número, fraccionamiento, referencias..."
></textarea>

</div>

<label for="paymentMethod">
Forma de pago
</label>

<select id="paymentMethod">

<option value="cash">
Efectivo
</option>

<option value="card">
Tarjeta
</option>

<option value="transfer">
Transferencia
</option>

</select>

<label for="notes">
Notas del pedido
</label>

<textarea
id="notes"
placeholder="Alguna indicación especial..."
></textarea>

<button
class="order-button"
onclick="sendOrder()"
>
PEDIR POR WHATSAPP
</button>

</div>

</div>

<footer>

PasteHot<br>
Saborea tu tiempo.

</footer>

<script>

/* =====================================================
   CONFIGURACIÓN SUPABASE
   ===================================================== */

const SUPABASE_URL =
"https://cqlywpemisknrxswlmea.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_wDu6p-CtnQtYu7KWH1YS1A_h7LeL0SX";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
   CONFIGURACIÓN WHATSAPP
   ===================================================== */

/*
   CAMBIA ESTE NÚMERO POR EL WHATSAPP DE PASTEHOT.

   Formato:
   52 + número de México

   Ejemplo:
   529999999999
*/

const WHATSAPP_NUMBER =
"529902317606";


/* =====================================================
   VARIABLES
   ===================================================== */

let products = [];

let cart = [];


/* =====================================================
   CARGAR PRODUCTOS DESDE SUPABASE
   ===================================================== */

async function loadProducts(){

    const loading =
    document.getElementById("loading");

    const error =
    document.getElementById("error");

    try{

        const { data, error: supabaseError } =
        await supabaseClient
        .from("products")
        .select("*")
        .eq("available", true)
        .order("sort_order", { ascending:true });

        if(supabaseError){
            throw supabaseError;
        }

        products = data || [];

        loading.classList.add("hidden");

        renderProducts();

    }catch(errorObject){

        console.error(errorObject);

        loading.classList.add("hidden");

        error.classList.remove("hidden");

        error.textContent =
        "No se pudo cargar el menú. Revisa la conexión con Supabase.";

    }

}


/* =====================================================
   MOSTRAR PRODUCTOS
   ===================================================== */

function renderProducts(){

    const menu =
    document.getElementById("menu");

    menu.innerHTML = "";

    const categories = [];

    products.forEach(product => {

        if(!categories.includes(product.category)){
            categories.push(product.category);
        }

    });


    categories.forEach(category => {

        const title =
        document.createElement("h2");

        title.textContent =
        category;

        menu.appendChild(title);


        const grid =
        document.createElement("div");

        grid.className =
        "products";


        const categoryProducts =
        products.filter(
            product =>
            product.category === category
        );


        categoryProducts.forEach(product => {

            const card =
            document.createElement("div");

            card.className =
            "product";


            const image =
            document.createElement("img");

            if(product.image_url){

                image.src =
                product.image_url;

            }else{

                image.src =
                "data:image/svg+xml;charset=UTF-8," +
                encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg"
                width="600"
                height="600">
                <rect width="100%" height="100%"
                fill="#dddddd"/>
                <text x="50%" y="50%"
                dominant-baseline="middle"
                text-anchor="middle"
                font-size="35"
                fill="#777">
                Foto próximamente
                </text>
                </svg>
                `);

            }


            const info =
            document.createElement("div");

            info.className =
            "product-info";


            const name =
            document.createElement("div");

            name.className =
            "product-name";

            name.textContent =
            product.name;


            const description =
            document.createElement("div");

            description.className =
            "product-description";

            description.textContent =
            product.description || "";


            const price =
            document.createElement("div");

            price.className =
            "product-price";

            price.textContent =
            "$" +
            Number(product.price).toFixed(2);


            const button =
            document.createElement("button");

            button.className =
            "add-button";

            button.textContent =
            "AGREGAR AL PEDIDO";


            button.onclick =
            function(){

                addToCart(product.id);

            };


            info.appendChild(name);

            info.appendChild(description);

            info.appendChild(price);

            info.appendChild(button);

            card.appendChild(image);

            card.appendChild(info);

            grid.appendChild(card);

        });


        menu.appendChild(grid);

    });

}


/* =====================================================
   CARRITO
   ===================================================== */

function addToCart(productId){

    const product =
    products.find(
        p => p.id === productId
    );

    if(!product){
        return;
    }


    const existing =
    cart.find(
        item => item.product.id === productId
    );


    if(existing){

        existing.quantity++;

    }else{

        cart.push({
            product:product,
            quantity:1
        });

    }


    renderCart();

}


function changeQuantity(productId, amount){

    const item =
    cart.find(
        item =>
        item.product.id === productId
    );

    if(!item){
        return;
    }


    item.quantity += amount;


    if(item.quantity <= 0){

        cart =
        cart.filter(
            item =>
            item.product.id !== productId
        );

    }


    renderCart();

}


function getCartTotal(){

    return cart.reduce(
        (total,item) =>
        total +
        Number(item.product.price) *
        item.quantity,
        0
    );

}


function renderCart(){

    const container =
    document.getElementById("cartItems");

    const total =
    document.getElementById("cartTotal");


    if(cart.length === 0){

        container.innerHTML =
        '<div class="empty">Tu carrito está vacío.</div>';

        total.textContent =
        "0.00";

        return;

    }


    container.innerHTML = "";


    cart.forEach(item => {

        const row =
        document.createElement("div");

        row.className =
        "cart-item";


        const name =
        document.createElement("div");

        name.textContent =
        item.product.name +
        " × " +
        item.quantity;


        const controls =
        document.createElement("div");

        controls.className =
        "cart-controls";


        const minus =
        document.createElement("button");

        minus.className =
        "small-button";

        minus.textContent =
        "−";

        minus.onclick =
        function(){

            changeQuantity(
                item.product.id,
                -1
            );

        };


        const plus =
        document.createElement("button");

        plus.className =
        "small-button";

        plus.textContent =
        "+";

        plus.onclick =
        function(){

            changeQuantity(
                item.product.id,
                1
            );

        };


        controls.appendChild(minus);

        controls.appendChild(plus);


        row.appendChild(name);

        row.appendChild(controls);


        container.appendChild(row);

    });


    total.textContent =
    getCartTotal().toFixed(2);

}


/* =====================================================
   MOSTRAR / OCULTAR DIRECCIÓN
   ===================================================== */

document
.getElementById("deliveryType")
.addEventListener(
    "change",
    function(){

        const container =
        document.getElementById(
            "addressContainer"
        );

        if(this.value === "delivery"){

            container.classList.remove(
                "hidden"
            );

        }else{

            container.classList.add(
                "hidden"
            );

        }

    }
);


/* =====================================================
   ENVIAR PEDIDO A WHATSAPP
   ===================================================== */

function sendOrder(){

    if(cart.length === 0){

        alert(
            "Agrega al menos un producto al pedido."
        );

        return;

    }


    const name =
    document
    .getElementById("customerName")
    .value
    .trim();


    const phone =
    document
    .getElementById("customerPhone")
    .value
    .trim();


    const deliveryType =
    document
    .getElementById("deliveryType")
    .value;


    const address =
    document
    .getElementById("address")
    .value
    .trim();


    const paymentMethod =
    document
    .getElementById("paymentMethod")
    .value;


    const notes =
    document
    .getElementById("notes")
    .value
    .trim();


    if(!name){

        alert("Escribe tu nombre.");

        return;

    }


    if(!phone){

        alert(
            "Escribe tu teléfono o WhatsApp."
        );

        return;

    }


    if(
        deliveryType === "delivery"
        &&
        !address
    ){

        alert(
            "Escribe la dirección de entrega."
        );

        return;

    }


    const paymentNames = {

        cash:"Efectivo",

        card:"Tarjeta",

        transfer:"Transferencia"

    };


    const deliveryNames = {

        delivery:"Envío a domicilio",

        pickup:"Recoger"

    };


    let message =
    "Hola PasteHot 👋\n\n";


    message +=
    "*NUEVO PEDIDO*\n\n";


    message +=
    "Nombre: " +
    name +
    "\n";


    message +=
    "Teléfono: " +
    phone +
    "\n";


    message +=
    "Entrega: " +
    deliveryNames[deliveryType] +
    "\n";


    if(deliveryType === "delivery"){

        message +=
        "Dirección: " +
        address +
        "\n";

    }


    message +=
    "Pago: " +
    paymentNames[paymentMethod] +
    "\n";


    message +=
    "\n*Productos:*\n";


    cart.forEach(item => {

        message +=
        item.quantity +
        " × " +
        item.product.name +
        " — $" +
        (
            Number(item.product.price) *
            item.quantity
        ).toFixed(2) +
        "\n";

    });


    message +=
    "\n*TOTAL: $" +
    getCartTotal().toFixed(2) +
    "*";


    if(notes){

        message +=
        "\n\nNotas: " +
        notes;

    }


    const url =
    "https://wa.me/" +
    WHATSAPP_NUMBER +
    "?text=" +
    encodeURIComponent(message);


    window.open(
        url,
        "_blank"
    );

}


/* =====================================================
   INICIAR
   ===================================================== */

loadProducts();

renderCart();

</script>

</body>
</html>
